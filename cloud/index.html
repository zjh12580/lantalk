<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<title>Let's Talk · 云端聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2307c160'/%3E%3Cpath d='M14 32 L50 16 L40 50 L32 38 L14 32 Z' fill='white'/%3E%3C/svg%3E">
<style>
.join-tabs{display:flex;gap:4px;margin:0 0 14px}
.join-tabs .tab{flex:1;padding:7px 4px;font-size:13px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;border-radius:8px;font-family:inherit}
.join-tabs .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.lnk{color:var(--at);cursor:pointer;text-decoration:none}
.sync{font-size:11px}

*,*::before,*::after{box-sizing:border-box}
:root{--brand:#07c160;--danger:#fa5151;--at:#4a8cf7}
body.theme-dark{--bg:#16181d;--bg2:#1d2026;--bg3:#23262d;--hover:#2a2e36;--bd:#2c3038;--tx:#e6e8eb;--tx2:#9aa0aa;--tx3:#6b7280;--bb:#262a32;--bbtx:#e6e8eb;--sd:0 8px 28px rgba(0,0,0,.45)}
body.theme-light{--bg:#f2f3f5;--bg2:#fbfbfc;--bg3:#fff;--hover:#eceef1;--bd:#e2e5ea;--tx:#1a1d21;--tx2:#5b6270;--tx3:#9aa0aa;--bb:#fff;--bbtx:#1a1d21;--sd:0 8px 28px rgba(0,0,0,.12)}
html,body{height:100%;margin:0}
body{font:14px -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
.inp{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;width:100%}
.inp:focus{border-color:var(--brand)}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;background:var(--hover);color:var(--tx)}
.btn:hover{opacity:.88}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--bd)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.ib{background:transparent;border:none;cursor:pointer;color:var(--tx2);font-size:17px;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--hover);color:var(--tx)}
.ib.off{opacity:.4}
.av{border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;background:#888}
.av.s{width:30px;height:30px;font-size:15px;border-radius:6px}
.av.m{width:38px;height:38px;font-size:20px}
.av.l{width:56px;height:56px;font-size:30px;border-radius:12px}
.mav{cursor:pointer;display:flex;flex-shrink:0;border-radius:6px}
.mav:hover{box-shadow:0 0 0 2px var(--brand)}
.hallpick{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;padding:6px;background:var(--bg3);border-radius:10px;margin-top:6px}
.hallpick .chip{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:12px}
.hallpick .chip .av{width:20px;height:20px;font-size:11px;border-radius:5px}

.join{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1e3a2f,var(--bg) 60%)}
body.theme-light .join{background:radial-gradient(circle at 30% 20%,#dff0e6,var(--bg) 60%)}
.join-card{width:400px;max-width:94vw;padding:30px;border-radius:18px;background:var(--bg2);box-shadow:var(--sd)}
.join-card h1{margin:0 0 4px;font-size:22px}
.join-card .sub{margin:0 0 20px;font-size:13px;color:var(--tx3)}
.join-prev{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:12px;background:var(--bg3);border-radius:12px}
.emo-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:6px;background:var(--bg3);border-radius:10px;margin-top:6px}
.emo-grid span{font-size:22px;text-align:center;cursor:pointer;padding:4px;border-radius:6px;line-height:1.2}
.emo-grid span:hover{background:var(--hover)}
.emo-grid span.on{background:var(--brand)}
/* 分页表情选择器（左右翻页 + 页码点 + 关闭） */
.emo-pg{background:var(--bg3);border-radius:10px;margin-top:6px;padding:6px}
.emo-pg .ep-body{min-height:118px}
.emo-pg .emo-grid{background:none;padding:0;margin:0}
.emo-pg .ep-bar{display:flex;align-items:center;justify-content:center;gap:12px;height:26px}
.emo-pg .ep-nav{cursor:pointer;font-size:14px;color:var(--tx2);padding:2px 9px;border-radius:6px;user-select:none;line-height:1.4}
.emo-pg .ep-nav:hover{background:var(--hover);color:var(--brand)}
.emo-pg .ep-nav.dis{opacity:.28;pointer-events:none}
.emo-pg .ep-nav.sp{visibility:hidden}
.emo-pg .ep-dots{display:flex;gap:5px;align-items:center}
.emo-pg .ep-dots i{width:6px;height:6px;border-radius:50%;background:var(--tx3);opacity:.35;cursor:pointer;transition:.15s}
.emo-pg .ep-dots i.on{opacity:1;background:var(--brand);width:16px;border-radius:3px}
/* 头像颜色选择：十几个经典色，选中打勾 */
.color-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;padding:8px;background:var(--bg3);border-radius:10px;margin-top:6px}
.color-grid i{height:26px;border-radius:8px;cursor:pointer;position:relative;transition:transform .1s ease}
.color-grid i:hover{transform:scale(1.1)}
.color-grid i.on{box-shadow:0 0 0 2px var(--bg3),0 0 0 4px var(--tx1)}
.color-grid i.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
/* 表情分组标题 */
.emo-sec{font-size:11px;color:var(--tx3);margin:8px 0 -2px;font-weight:500}
.emo-grid.g-sm{grid-template-columns:repeat(9,1fr)}
.join-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}

.app{display:flex;height:100%}
.side{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.side-hd{display:flex;align-items:center;padding:12px;gap:8px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding:4px;border-radius:8px}
.me:hover{background:var(--hover)}
.me-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sb{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:4px;min-width:0}
.me-sb #meSig{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.doton{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
.tabs{display:flex;padding:0 8px 8px;gap:4px;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:6px 4px;font-size:12px;background:transparent;border:none;color:var(--tx2);cursor:pointer;border-radius:6px;font-family:inherit;position:relative}
.tab.on{background:var(--hover);color:var(--tx)}
.tbadge{display:inline-block;margin-left:3px;background:var(--danger);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;line-height:15px}
.list{flex:1;overflow-y:auto}
.foot{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:11px;color:var(--tx3);border-top:1px solid var(--bd)}
/* 左下角设置按钮（原始 40×40 → 32×32 → 28×28，图标 34px → 27px → 24px，累计缩小约 30%） */
.foot .ib{width:28px;height:28px;font-size:15px;border-radius:7px;flex-shrink:0}
.foot .ib:hover{background:var(--hover)}
.foot .ib:active{transform:scale(.94)}
.foot .sico{font-size:24px;line-height:1}
/* 左下角设置弹层 */
.spop{width:232px;padding:6px}
.spop .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;cursor:pointer;border-radius:8px;color:var(--tx)}
.spop .srow:hover{background:var(--hover)}
.spop .srow.danger{color:var(--danger)}
/* 导出 / 读取聊天记录弹窗 */
.dlg .drow{display:flex;gap:10px;margin-top:4px}
.dlg .dbtn{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px 12px;cursor:pointer;color:var(--tx);font-family:inherit;text-align:center;transition:background .15s,border-color .15s}
.dlg .dbtn:hover{background:var(--hover);border-color:var(--brand)}
.dlg .dbtn .di{font-size:24px;display:block;margin-bottom:6px}
.dlg .dbtn .dt{font-size:13px;font-weight:500;display:block}
.dlg .dbtn .dd{font-size:11px;color:var(--tx3);display:block;margin-top:3px;line-height:1.45}
.sprev{border:1px solid var(--bd);border-radius:10px;background:var(--bg3);padding:12px 14px;margin-top:14px;font-size:12px}
.sprev table{width:100%;border-collapse:collapse}
.sprev td{padding:4px 0;vertical-align:top}
.sprev td:first-child{color:var(--tx3);white-space:nowrap;padding-right:12px;width:76px}
.sprev .sc{max-height:130px;overflow-y:auto;margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px}
.sprev .sc div{padding:2px 0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.impbox{width:100%;box-sizing:border-box;height:150px;background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;font-size:12px;line-height:1.6;resize:vertical}
.switch{width:34px;height:20px;border-radius:20px;background:var(--tx3);position:relative;flex-shrink:0;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--brand)}
.switch.on i{left:16px}
/* 好友请求条目（直接显示在左侧消息列表顶部） */
.conv.req{cursor:default;align-items:center}
.conv.req .req-acts{display:flex;gap:6px;margin-top:6px}
.conv.req .req-acts button{border:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.conv.req .req-acts .ok{background:var(--brand);color:#fff}
.conv.req .req-acts .no{background:var(--hover);color:var(--tx)}
.conv{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center;position:relative}
.conv:hover{background:var(--hover)}
.conv.on{background:var(--hover)}
.conv.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--brand);border-radius:0 3px 3px 0}
.cbody{flex:1;min-width:0}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cnm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctm{font-size:11px;color:var(--tx3);flex-shrink:0}
.clast{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.atme{color:var(--danger)}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0}
.badge.mute{background:var(--tx3)}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px}
.empty .big{width:76px;height:76px;border-radius:20px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0}
.hd-t{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:600}
.hd-s{font-size:12px;color:var(--tx3);font-weight:400}
.ann{background:var(--bg3);padding:8px 16px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
/* 聊天壁纸（TG/WhatsApp 风格）：铺在滚动容器自身背景上，消息滚动时壁纸固定 */

.day{text-align:center;margin:12px 0 8px}
.day span{font-size:11px;color:var(--tx3);background:var(--bg3);padding:2px 8px;border-radius:4px}
.sys{text-align:center;margin:6px 0}
.sys span{font-size:12px;color:var(--tx3);background:var(--bg3);padding:3px 10px;border-radius:10px}
.m{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.m.self{flex-direction:row-reverse}
.mb{max-width:min(620px,68%);min-width:0}
.meta{font-size:11px;color:var(--tx3);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.m.self .meta{flex-direction:row-reverse}
.meta .mname{color:var(--tx2);font-weight:500}
.attlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.attchip{display:flex;align-items:center;gap:7px;padding:4px 8px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--tx2);max-width:100%}
.attchip img{height:48px;width:48px;object-fit:cover;border-radius:6px;display:block;background:var(--hover)}
.attchip .afi{font-size:22px;width:34px;text-align:center}
.attchip .an{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attchip .as{color:var(--tx3);font-size:11px}
.attchip .adel{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:13px;padding:0 2px}
.attchip .adel:hover{color:var(--danger)}
.mtext{white-space:pre-wrap;word-break:break-word}
.mtext{margin-bottom:4px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300;cursor:zoom-out}
.viewer img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.viewer .ib{position:absolute;top:14px;font-size:18px;color:#fff;background:rgba(255,255,255,.14);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.viewer #viewerClose{right:14px}
.viewer #viewerDl{right:60px}
@keyframes ublink{0%,100%{opacity:1}50%{opacity:.35}}
.blink{animation:ublink 1s infinite}
@keyframes ubadge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#uTotal.pulse{animation:ubadge 1s infinite}
@keyframes uglow{0%,100%{box-shadow:inset 0 0 0 0 rgba(250,81,81,0)}50%{box-shadow:inset 0 0 0 3px rgba(250,81,81,.9)}}
body.unread-glow .app{animation:uglow 1.1s infinite}
.tab.blink{color:var(--danger);animation:ublink 1s infinite}
.rbar.flash{background:rgba(250,81,81,.14);color:var(--danger)}
.meta .rd{color:var(--tx3);font-size:11px}
.meta .rd.rdet{cursor:pointer}
.meta .rd.rdet:hover{text-decoration:underline;color:var(--tx2)}
.meta .rd.on{color:var(--brand)}
.meta .rd.on::before{content:'✓ '}
.bub{background:var(--bb);color:var(--bbtx);padding:10px 14px;border-radius:14px;word-break:break-word;white-space:pre-wrap;line-height:1.55;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.m:not(.self) .bub{border-top-left-radius:4px}
.m.self .bub{background:#95ec69;color:#10210c;border-top-right-radius:4px}
.bub.hl{box-shadow:0 0 0 2px var(--danger) inset}
.bub .at{color:var(--at)}
.quote{border-left:3px solid var(--tx3);padding:2px 8px;margin-bottom:5px;font-size:12px;color:var(--tx2);background:rgba(128,128,128,.12);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote.qimg{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:normal}
.quote.qimg:hover{background:rgba(128,128,128,.22)}
.quote .qthumb{width:36px;height:36px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--hover);display:block}
.quote .qt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub img.at2{width:260px;height:170px;object-fit:cover;border-radius:6px;cursor:pointer;display:block;background:var(--bg3)}
.fcard{display:flex;align-items:center;gap:12px;background:transparent;border:1px solid var(--bd);padding:12px 14px;border-radius:12px;cursor:pointer;min-width:220px;transition:background .15s,border-color .15s}
.fcard:hover{background:var(--hover);border-color:var(--tx3)}
.fcard .fi{width:40px;height:40px;border-radius:10px;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.fn{font-size:13px;font-weight:500;word-break:break-all}
.fs{font-size:11px;color:var(--tx2)}
.ops{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--tx3);opacity:0}
.m:hover .ops{opacity:1}
.m.self .ops{justify-content:flex-end}
.ops button{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:0}
.ops button:hover{color:var(--brand)}
.rev{font-size:12px;color:var(--tx3);font-style:italic;padding:9px 14px;background:transparent;border:1px dashed var(--bd);border-radius:14px;display:inline-block}
/* 输入中：消息流底部的头像 + 气泡（三个跳动圆点） */
.compwrap{position:relative;flex:0 0 auto}
.typ{position:absolute;left:0;right:0;bottom:100%;display:flex;align-items:center;gap:8px;padding:4px 16px 10px;pointer-events:none}
.typ .tav .av{width:28px;height:28px;font-size:14px;border-radius:8px}
.tbub{display:inline-flex;align-items:center;gap:8px;background:var(--bb);color:var(--bbtx);padding:9px 14px;border-radius:4px 14px 14px 14px}
.tdots{display:inline-flex;gap:4px;align-items:center}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--tx2);animation:typdot 1.2s ease-in-out infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes typdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.typ .ttxt{font-size:12px;color:var(--tx3)}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px;background:var(--bg3);border-top:1px solid var(--bd);font-size:12px;color:var(--tx2)}
.rbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{border-top:1px solid var(--bd);padding:10px 14px 14px;background:var(--bg2)}
.tools{display:flex;gap:4px;margin-bottom:8px;padding-left:4px}
.tools .ib svg{display:block}
.pill{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--bd);border-radius:24px;padding:6px 6px 6px 18px;transition:border-color .15s ease}
.pill:focus-within{border-color:var(--brand)}
.pill .inp{background:transparent;border:none;padding:8px 0;min-height:24px;flex:1;border-radius:0}
.pill .inp:focus{border:none}
.comp textarea{resize:none;max-height:140px;line-height:1.6}
.sendbtn{width:38px;height:38px;min-width:38px;border:none;border-radius:50%;background:var(--brand);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s ease,opacity .15s ease}
.sendbtn:hover{opacity:.88}
.sendbtn:active{transform:scale(.92)}
.sendbtn svg{display:block}

.info{width:260px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;padding:16px}
.info h4{margin:0 0 10px;font-size:13px;color:var(--tx2);font-weight:500}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mem{display:flex;flex-direction:column;align-items:center;width:56px;gap:4px;cursor:pointer;font-size:11px;color:var(--tx2)}
.mem span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd)}
/* 用户信息弹层头部：头像居左，昵称 + 在线状态紧随其后 */
.ihead{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}
.ihead .av{flex-shrink:0}
.ibody{min-width:0;flex:1}
.inm{font-size:16px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.istat{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--tx3)}
.istat .idot{width:8px;height:8px;border-radius:50%;background:#8a8f99;flex-shrink:0}
.istat.on{color:var(--brand)}
.istat.on .idot{background:var(--brand);box-shadow:0 0 0 3px rgba(7,193,96,.16)}
.ink{font-size:12px;color:var(--tx3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isec{margin-top:4px}
.isec .lbl{font-size:12px;color:var(--tx3);padding:10px 0 4px;font-weight:500}
.isec .row:last-child{border-bottom:none}
.isec .row:first-of-type{border-top:1px solid var(--bd)}
.info .btn.block{margin-top:14px}
/* 资料页直播区块 */
.lrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0 10px;color:var(--tx2)}
.lrow .ldot{width:8px;height:8px;border-radius:50%;background:#ff4d4f;flex-shrink:0;animation:livepulse 1.4s infinite}
.lhint{font-size:11.5px;color:var(--tx3);line-height:1.6;margin-top:8px}
/* 大厅直播：公告下方的提示条 */
.livebar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;cursor:pointer;
  background:linear-gradient(90deg,rgba(229,57,53,.16),rgba(229,57,53,.05));color:#ff6b6b;
  border-bottom:1px solid var(--bd);transition:background .15s}
.livebar:hover{background:linear-gradient(90deg,rgba(229,57,53,.26),rgba(229,57,53,.08))}
.livebar .lb-arw{margin-left:auto;opacity:.7}
.livebar .lbd{width:7px;height:7px;border-radius:50%;background:#ff4d4f;flex-shrink:0;animation:livepulse 1.4s infinite}
@keyframes livepulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,77,79,.55)}50%{opacity:.65;box-shadow:0 0 0 5px rgba(255,77,79,0)}}
/* 全屏直播间 */
.live{position:fixed;inset:0;background:#0b0b0d;z-index:120;display:flex;flex-direction:column;color:#f2f3f5}
.lv-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.lv-tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:#e53935;padding:3px 10px;border-radius:20px;flex-shrink:0}
.lv-tag .lvd{width:6px;height:6px;border-radius:50%;background:#fff;animation:livepulse 1.4s infinite}
.lv-host{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:14px}
.lv-host .av{width:28px;height:28px;font-size:14px;border-radius:7px;flex-shrink:0}
.lv-host span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-top .ib{color:#f2f3f5;background:rgba(255,255,255,.08)}
.lv-top .ib:hover{background:rgba(255,255,255,.16)}
.lv-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:16px}
.lv-ph{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#8b8f98}
.lv-ph .ricon{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#e53935,#ff7043);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 10px 34px rgba(229,57,53,.35);animation:livepulse 1.8s infinite}
.lv-ph .pt{font-size:15px;color:#d5d8dd}
.lv-ph .ps{font-size:12.5px;max-width:340px;line-height:1.7}
.lv-video{width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:12px;object-fit:contain}
.lv-bottom{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.lv-cnt{font-size:12.5px;color:#8b8f98;margin-right:auto}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg2);border-radius:14px;width:420px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:22px;box-shadow:var(--sd)}
.modal h3{margin:0 0 16px;font-size:16px}
.modal label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
/* ---------- 一起玩游戏 ---------- */
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.gcard{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:.15s}
.gcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.gcard .gico{font-size:30px;line-height:1.2;display:flex;align-items:center;justify-content:center;height:34px;color:var(--tx)}
.gcard .gico svg{width:32px;height:32px;display:block}
.gcard:hover .gico{color:var(--brand)}
.gcard .gnm{font-size:13px;margin-top:6px;font-weight:600}
.gcard .gds{font-size:11px;color:var(--tx3);margin-top:2px}
.gcard.off{opacity:.45;cursor:not-allowed}
.gcard.off:hover{border-color:var(--bd);transform:none}
.gcard.off:hover .gico{color:var(--tx)}
/* 邀请卡片消息 */
.ginvite{margin:6px 0;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);max-width:280px}
.ginvite .git{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ginvite .git svg{width:17px;height:17px;display:block;flex-shrink:0}
.ginvite .gsub{font-size:12px;color:var(--tx3);margin-bottom:10px;line-height:1.5}
.ginvite .gbtn{display:block;width:100%;padding:8px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
.ginvite .gbtn:hover{filter:brightness(1.08)}
.ginvite .gbtn.dis{background:var(--bg3);color:var(--tx3);cursor:not-allowed;font-weight:500}
.ginvite .gbtn.dis:hover{filter:none}
/* 对局全屏浮层 */
.groom{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;flex-direction:column}
.groom .gr-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.groom .gr-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.groom .gr-tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--tx2);flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.groom .gr-tag svg{width:15px;height:15px;display:block}
/* 对局主体：左右两栏 —— 左「信息栏」（玩家/轮次/提示），右「棋盘」 */
/* 左栏与棋盘成组居中，gap 收紧让信息栏贴近棋盘；整组不滚动（信息量固定，无需滚动条） */
.groom .gr-body{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:14px 18px;overflow:hidden;min-height:0}
/* 左信息栏：固定宽度、纵向排布，绝不出现滚动条 */
.groom .gr-side{flex:0 0 auto;width:186px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.groom .gr-pl{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;background:var(--bg2);
  border:1px solid var(--bd);font-size:13px;transition:.18s;box-sizing:border-box;min-width:0}
.groom .gr-pl.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--bg2));box-shadow:0 0 0 1px var(--brand)}
.groom .gr-pl .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.groom .gr-pl .side{font-size:11px;color:var(--tx3);flex:0 0 auto}
.groom .gr-pl.on .side{color:var(--brand);font-weight:600}
.groom .gr-pl .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:0 0 auto}
.groom .gr-pl.on .dot{background:var(--brand);animation:livepulse 1.4s infinite}
/* 左侧的「对局状态」提示条（轮到谁 / 思考中 / 走子提示） */
.groom .gr-status{padding:9px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);
  font-size:12.5px;line-height:1.55;color:var(--tx2);text-align:left;box-sizing:border-box}
.groom .gr-status.brand{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--bg2));color:var(--brand);font-weight:600}
/* 右侧棋盘区：占据剩余空间，居中 */
.groom .gr-main{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
@media (max-width:720px){
  .groom .gr-body{flex-direction:column;gap:10px;padding:10px}
  .groom .gr-side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible;gap:8px}
  .groom .gr-pl{flex:1 1 120px}
  .groom .gr-status{flex:1 1 100%;text-align:center}
  .groom .gr-main{flex:1 1 auto}
}
/* 棋盘：尽量大 —— 同时受「可用宽」与「可用高」约束（min of 两者），避免纵向溢出 */
#gBoard{background:#e9be7c;border-radius:8px;box-shadow:var(--sd);touch-action:none;
  width:min(var(--bw,620px),100%);height:auto;max-height:100%;display:block}
#gBoard.bd-go{background:#dbb96a}
#gBoard.bd-xq{background:#f0d9a8}
/* 等待对方加入：棋盘只读 + 遮罩 */
.groom .gr-cvwrap{position:relative;display:inline-block;max-width:100%}
.groom .gr-cvwrap canvas.gr-dim{opacity:.42;filter:saturate(.6)}
.groom .gr-waitmask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.34);border-radius:8px;backdrop-filter:blur(1.5px)}
.groom .gr-waitmask .gr-hint{color:#fff;margin-top:10px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.groom .gr-spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:grspin .8s linear infinite}
@keyframes grspin{to{transform:rotate(360deg)}}
.groom .gr-foot{padding:12px 16px;border-top:1px solid var(--bd);display:flex;justify-content:center;gap:10px;flex-shrink:0}
.groom .gr-hint{margin-top:12px;font-size:12.5px;color:var(--tx3);text-align:center;line-height:1.6}
.gr-cnt{font-size:44px;font-weight:700;color:var(--brand);line-height:1.1}
.gpick2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.gpick2 button{padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:13px;cursor:pointer;transition:.15s}
.gpick2 button:hover{border-color:var(--brand);color:var(--brand)}
.gpick2 button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.rlist{max-height:300px;overflow-y:auto;margin-top:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.ritem:hover{background:var(--hover)}
.rib{flex:1;min-width:0}
.rin{font-size:14px}
.ris{font-size:12px;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg3);border:1px solid var(--bd);border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--brand);color:var(--brand)}
.pop{position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sd);overflow:hidden}
.mpop{width:210px;max-height:240px;overflow-y:auto;padding:5px}
.mitem{padding:7px 10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;border-radius:8px}
.mitem.on,.mitem:hover{background:var(--hover)}
.mitem.on{box-shadow:inset 0 0 0 1px var(--brand)}
.epop{width:308px;padding:8px}
.epop .emo-pg{margin-top:0}
.epop .emo-grid{grid-template-columns:repeat(8,1fr)}
.epop .emo-grid span{font-size:21px;text-align:center;cursor:pointer;padding:5px;border-radius:6px}
.epop .emo-grid span:hover{background:var(--hover)}
.epop .epopclose{text-align:center;font-size:12px;color:var(--tx2);padding:8px 0 2px;margin-top:8px;border-top:1px solid var(--bd);cursor:pointer}
.epop .epopclose:hover{color:var(--brand)}
.toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--bg3);border:1px solid var(--bd);box-shadow:var(--sd);padding:9px 16px;border-radius:20px;font-size:13px;max-width:70vw;cursor:pointer}
.toast.err{border-color:var(--danger);color:var(--danger)}
@media(max-width:900px){.side{width:220px}.info{display:none!important}}
.hd-on{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);margin-right:10px;white-space:nowrap}
@media(max-width:640px){.hd-on{display:none}}
/* 手机端：左侧栏收窄只显示头像 logo，点 ☰ 或遮罩展开完整侧栏 */
.side-toggle{display:none}
.side-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
@media(max-width:640px){
  .side{width:64px}
  .side-hd{flex-direction:column;gap:8px;padding:10px 0}
  .side-hd .me{padding:0}
  .side-hd .me>div:last-child{display:none}
  .side-hd .hd-btns{display:none}
  .side-toggle{display:inline-flex}
  .sRow,.foot,#sRow{display:none}
  .list{padding:0 4px}
  .conv{justify-content:center;padding:9px 0}
  .conv .cbody{display:none}
  .conv .ctm{display:none}
  .mb{max-width:82%}
  .hd{padding:0 10px}
  .side.open{width:280px;position:fixed;left:0;top:0;bottom:0;z-index:60;box-shadow:var(--sd);animation:sidein .18s ease}
  .side.open .side-hd{flex-direction:row;gap:8px;padding:12px}
  .side.open .me{flex:1;padding:4px}
  .side.open .me>div:last-child{display:block}
  .side.open .hd-btns{display:flex}
  .side.open .sRow,.side.open #sRow{display:block;padding:0 12px 10px}
  .side.open .foot{display:flex}
  .side.open .conv{justify-content:flex-start;padding:10px 12px}
  .side.open .conv .cbody{display:block}
  .side.open .conv .ctm{display:block}
  .side.open .list{padding:0}
}
@keyframes sidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}

/* ===== 转场动画与点击特效 ===== */
/* 消息气泡淡入上滑 */
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.anim{animation:msgin .22s ease}
/* 弹窗遮罩 + 卡片淡入缩放 */
.mask{animation:maskin .16s ease}
@keyframes maskin{from{opacity:0}to{opacity:1}}
.mask .modal{animation:modalin .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes modalin{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
/* toast 滑入淡入 */
.toast{animation:toastin .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
/* 会话列表项 hover 过渡 */
.conv{transition:background .15s ease}
.conv .cbody{transition:transform .15s ease}
.conv:hover .cbody{transform:translateX(2px)}
/* ===== 预置指令浮层（输入 # 唤起，参考 Telegram 指令菜单） ===== */
.cmdpop{width:300px;max-height:280px;overflow-y:auto;padding:6px}
.cmditem{padding:8px 10px;cursor:pointer;border-radius:8px}
.cmditem.on,.cmditem:hover{background:var(--hover)}
.cmditem .cc{display:flex;align-items:center;gap:8px}
.cmditem .ccode{font-weight:600;color:var(--brand);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.cmditem .clabel{font-size:13px}
.cmditem .cdesc{font-size:11px;color:var(--tx3);margin-top:2px;padding-left:1px}
/* ===== 行情卡片 ===== */
.m.cardmsg{display:block}
.m.cardmsg .mav{display:none}
.m.cardmsg .mb{max-width:440px;margin:2px auto 0}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sd);width:min(320px,80vw)}
.card .chd{padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}
.card .clogo{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.card .ctitle{font-weight:600;font-size:13px;line-height:1.25}
.card .csub{font-size:11px;color:var(--tx3);margin-top:1px}
.card .cbody{padding:3px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.card .crow{display:block;padding:6px 0 2px;border-bottom:none}
.card .ck{display:block;font-size:11px;color:var(--tx3)}
.card .cv{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.card .cbody.wide{display:block}
.card .cbody.wide .crow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
.card .cbody.wide .crow:last-child{border-bottom:none}
.card .cbody.wide .ck{display:inline;font-size:12px;color:var(--tx2);font-weight:600}
.card .cbody.wide .cv{display:inline;font-size:12px;font-weight:400;margin-top:0}
.card .cv.up{color:#e34d4d}
.card .cv.down{color:#2ba36b}
.card .cv.flat{color:var(--tx2)}
.card .cfoot{font-size:10px;color:var(--tx3);padding:6px 12px;border-top:1px solid var(--bd);text-align:center;white-space:pre-wrap;line-height:1.4}
.card.err .cbody{padding:12px;text-align:center;color:var(--danger);display:block}
/* 头像/按钮悬停过渡 */
.mav{transition:box-shadow .15s ease,transform .15s ease}
.mav:hover{transform:scale(1.06)}
.av{transition:transform .15s ease}
.me:hover .av{transform:scale(1.04)}
/* 图标按钮点击反馈（按下微缩） */
.ib{transition:background .15s ease,color .15s ease,transform .08s ease}
.ib:active{transform:scale(.88)}
.btn{transition:opacity .15s ease,transform .08s ease,background .15s ease}
.btn:active{transform:scale(.96)}
/* 表情/成员 chip 点击反馈 */
.chip{transition:border-color .15s ease,color .15s ease,transform .08s ease}
.chip:active{transform:scale(.94)}
.emo-grid span{transition:background .12s ease,transform .08s ease}
.emo-grid span:active{transform:scale(.85)}
/* 图片悬停放大提示 */
.bub img.at2{transition:transform .15s ease,box-shadow .15s ease}
.bub img.at2:hover{box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>

    if (r && r.error) { $('#aErr').textContent = '失败：' + r.error.message; return; }

    if (!pwd) { $('#aErr').textContent = '请输入密码'; return; }

    if (!code) { $('#aErr').textContent = '请填写验证码'; return; }

    CLOUD.auth.verifyOtp({ verificationId: otpCtx.verificationId, token: code, email: email, isExistingUser: otpCtx.isExistingUser }).then(done);
  } else {
    if (!pwd) { $('#aErr').textContent = '请设置密码'; return; }
    if (!otpCtx || otpCtx.email !== email) { $('#aErr').textContent = '请先点击「发送验证码」'; return; }
    if (!code) { $('#aErr').textContent = '请填写验证码'; return; }

  }
};

function buildConvs() {

    var mem = S.members[g.id] || [];

    list.push({

      owner: g.owner_id, announcement: g.announcement || '', isHall: !!g.is_hall,
      memberCount: mem.length, muted: !!S.myMuted[g.id], last: null,

  (S.recent || []).forEach(function (m) { if (m.conv.indexOf('p:') === 0) { m.conv.slice(2).split('~').forEach(function (u) { if (u !== S.uid) peers[u] = 1; }); } });
  Object.keys(peers).forEach(function (pid) {
    if (pid === S.uid || !S.profiles[pid]) return;

  var inList = {};
  list.forEach(function (c) { inList[c.conv] = 1; });
  Object.keys(S.localConvs || {}).forEach(function (cv) {
    if (inList[cv]) return;
    var lc = S.localConvs[cv];
    list.push({ conv: cv, type: lc.type || 'group', id: lc.id || convPeer({ conv: cv }), name: lc.title || cv, avatar: '', color: '#8a8f99', isFriend: false, muted: false, last: null, localOnly: true });
  });
  // 最近消息（侧栏预览/排序依据）
  var lastMap = {};

function resolveStock(q) {

// ---------- 文件 ----------
// 上传链路（网关偶发「文件已落盘但响应报 404 STORAGE_BUCKET_NOT_FOUND」）：
//   1) SDK update（PUT，不带 x-upsert 头，CORS 安全）；
//   2) 报错后先用 exists() 验证对象是否其实已经写上 —— 写上了就算成功；
//   3) 真没写上再手动 PUT 兜底，并再次验证。
function rawUpload(path, file) {
  var opts = { contentType: file.type || 'application/octet-stream', cacheControl: '3600' };
  var first = st.update
    ? q(st.update(path, file, opts)).then(function () { return true; })
    : Promise.reject(new Error('no update api'));
  return first.catch(function (e1) {
    return objExists(path).then(function (ok) {
      if (ok) return true;   // 实际已落盘，网关响应误报，忽略
      return manualPut(path, file).then(function () {
        return objExists(path).then(function (ok2) { if (!ok2) throw (e1 || new Error('upload failed')); return true; });
      });
    });
  });
}
function objExists(path) {
  if (!st.exists && !st.info) return Promise.resolve(false);
  var p = st.exists ? st.exists(path) : st.info(path);
  return Promise.resolve(p).then(function (r) {
    if (!r || r.error) return false;
    var d = r.data;
    if (d === true) return true;
    if (d && typeof d === 'object') return !!(d.exists === true || d.Id || d.Key || d.name);
    return false;
  }).catch(function () { return false; });
}
function manualPut(path, file) {
  return CLOUD.auth.getAccessToken().then(function (tok) {
    var fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', file);
    var hd = { 'x-wb-webapp-access-key': PUBKEY };
    if (tok) hd['Authorization'] = 'Bearer ' + tok;
    return fetch(ENDPOINT + '/.cloud/storage/object/runtime/' + encodeURI(path), { method: 'PUT', headers: hd, body: fd });
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + (t ? '：' + t.slice(0, 120) : '')); });
  });
}

// Ctrl+V 粘贴：剪贴板里有图片就直接上传发送（焦点在别的输入框时不干扰）
function pasteName(mime) {
  var ext = String(mime || 'image/png').split('/')[1] || 'png';
  if (ext === 'jpeg') ext = 'jpg';
  var d = new Date();
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  return 'paste-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.' + ext;
}
function onPaste(e) {
  if (!S.cur) return;
  var cd = e.clipboardData || window.clipboardData;
  if (!cd || !cd.items) return;
  var file = null;
  for (var i = 0; i < cd.items.length; i++) {
    var it = cd.items[i];
    if (it.kind !== 'file') continue;
    var f = it.getAsFile && it.getAsFile();
    if (!f) continue;
    if (!file || /^image\//.test(f.type)) file = f;   // 优先取图片
  }
  if (!file) return;
  e.preventDefault();
  var named = file;
  try { named = new File([file], pasteName(file.type), { type: file.type }); } catch (err) { named = file; }
  addAttach(named);   // 只放进待发送区，等点「发送」
}

  var tag = t && t.tagName;

// 浮层通用：关闭 + 定位（定位后绝不遮住触发按钮，否则按钮点不到就再也关不掉）
// 注：closePops 定义在下方「@ 提及」区块（同时清空 atList / cmdList）
// align: 'center'(默认，面板中心对齐按钮中心) | 'left'(面板左边缘对齐按钮左边缘)
function placePop(pop, btn, align) {
  var r = btn.getBoundingClientRect();
  var w = pop.offsetWidth || 320;
  var h = pop.offsetHeight || 210;
  var left = align === 'left'
    ? r.left
    : r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  var vh = window.innerHeight;
  // 底边锚定：面板底边钉在按钮上方 8px，高度变化时只向上伸缩（上方收缩），底边不动
  var bottom = r.top - 8;
  var top = bottom - h;
  // 上方越界 → 翻到按钮下方（此时顶边锚定在按钮下方 8px，高度变化向下伸缩）
  if (top < 8) {
    var below = r.bottom + 8;
    // 按钮下方放得下就锚定在下方；放不下则贴屏幕顶部（保证尽可能多内容可见、位置稳定不跳）
    top = (below + h <= vh - 8) ? below : 8;
  }
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}

// 把当前光标处的「@关键词」替换成「@昵称 」，光标落到昵称之后，可继续编辑
function pickAt(uid) {
  var p = S.profiles[uid] || {};
  var el = $('#input');
  var v = el.value;
  var pos = el.selectionStart == null ? v.length : el.selectionStart;
  var before = v.slice(0, pos);
  var after = v.slice(pos);
  var m = before.match(/@([^\s@]*)$/);
  var name = p.nickname || '';
  var ins = '@' + name + ' ';
  if (m) {
    before = before.slice(0, before.length - m[0].length) + ins;
  } else {
    before += ins;
  }
  el.value = before + after;
  var caret = before.length;
  closePops();
  el.focus();
  try { el.setSelectionRange(caret, caret); } catch (e) {}

  place: function (board, r, c, v) {

    if (r < 0 || c < 0 || r > 18 || c > 18) return { ok: false, msg: '超出棋盘' };
    if (b[GG.idx(r, c)] !== 0) return { ok: false, msg: '这里已经有子了' };
    var opp = v === 1 ? 2 : 1;

    var ns = GG.neigh(r, c);
    for (var i = 0; i < ns.length; i++) {

function gamePlace(r, c) {

// 画布坐标 → 棋盘格（按棋种取几何参数）
function boardCell(cv, ev, kind) {

  var SZ = meta.size, pad = meta.pad;
  var cols = meta.n, rows = meta.rows || meta.n;

  var cellY = (SZ - pad * 2) / (rows - 1);
  var rect = cv.getBoundingClientRect();
  var x = (ev.clientX - rect.left) * (SZ / rect.width);
  var y = (ev.clientY - rect.top) * (SZ / rect.height);
  var c = Math.round((x - pad) / cellX);
  var r = Math.round((y - pad) / cellY);
  if (r < 0 || c < 0 || r >= rows || c >= cols) return null;
  return { r: r, c: c };
}
// 画棋盘（三种棋共用：网格 + 棋子 + 最后一手标记）
function drawBoard(g) {
  var cv = $('#gBoard'); if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  if (!ctx) return;   // 画布不可用时静默降级，不让渲染崩掉
  var kind = (g && g.kind) || 'gomoku';
  var meta = BOARD_META[kind] || BOARD_META.gomoku;
  var SZ = meta.size, pad = meta.pad;
  var cols = meta.n, rows = meta.rows || meta.n;
  var eng = engineOf(kind);
  var board = (g && g.board && g.board.length) ? g.board : eng.newBoard();
  var lastMove = ((g && g.moves) || []).slice(-1)[0];
  var X = function (c) { return pad + c * ((SZ - pad * 2) / (cols - 1)); };
  var Y = function (r) { return pad + r * ((SZ - pad * 2) / (rows - 1)); };

  ctx.clearRect(0, 0, SZ, SZ);
  ctx.fillStyle = kind === 'xiangqi' ? '#f0d9a8' : (kind === 'go' ? '#dbb96a' : '#e9be7c');
  ctx.fillRect(0, 0, SZ, SZ);

  if (kind === 'xiangqi') {
    // 象棋：竖线中间断开（楚河汉界），外框加粗
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1;
    for (var r0 = 0; r0 < rows; r0++) {
      ctx.beginPath(); ctx.moveTo(X(0), Y(r0)); ctx.lineTo(X(cols - 1), Y(r0)); ctx.stroke();
    }
    for (var c0 = 0; c0 < cols; c0++) {
      if (c0 === 0 || c0 === cols - 1) {
        ctx.beginPath(); ctx.moveTo(X(c0), Y(0)); ctx.lineTo(X(c0), Y(rows - 1)); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(X(c0), Y(0)); ctx.lineTo(X(c0), Y(4)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X(c0), Y(5)); ctx.lineTo(X(c0), Y(rows - 1)); ctx.stroke();
      }
    }
    ctx.lineWidth = 2.2;
    ctx.strokeRect(X(0), Y(0), X(cols - 1) - X(0), Y(rows - 1) - Y(0));
    ctx.lineWidth = 1;
    // 九宫斜线
    var gong = function (rt, rb) {
      ctx.beginPath(); ctx.moveTo(X(3), Y(rt)); ctx.lineTo(X(5), Y(rb)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(5), Y(rt)); ctx.lineTo(X(3), Y(rb)); ctx.stroke();
    };
    gong(0, 2); gong(7, 9);
    // 楚河汉界
    ctx.fillStyle = '#8a6a3a';
    ctx.font = '600 ' + Math.round((Y(5) - Y(4)) * 0.42) + 'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('楚 河', (X(1) + X(2)) / 2, (Y(4) + Y(5)) / 2);
    ctx.fillText('汉 界', (X(6) + X(7)) / 2, (Y(4) + Y(5)) / 2);
  } else {
    // 五子棋 / 围棋：满盘网格
    ctx.strokeStyle = kind === 'go' ? '#6f5426' : '#7a5a2e';
    ctx.lineWidth = kind === 'go' ? 0.9 : 1;
    for (var i = 0; i < rows; i++) {
      ctx.beginPath(); ctx.moveTo(X(0), Y(i)); ctx.lineTo(X(cols - 1), Y(i)); ctx.stroke();
    }
    for (var j = 0; j < cols; j++) {
      ctx.beginPath(); ctx.moveTo(X(j), Y(0)); ctx.lineTo(X(j), Y(rows - 1)); ctx.stroke();
    }
    // 围棋星位
    if (kind === 'go') {
      [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]].forEach(function (s) {
        ctx.beginPath(); ctx.arc(X(s[1]), Y(s[0]), 3.2, 0, Math.PI * 2);
        ctx.fillStyle = '#6f5426'; ctx.fill();
      });
    }
  }

  // 棋子
  var stepX = (SZ - pad * 2) / (cols - 1);
  var stepY = (SZ - pad * 2) / (rows - 1);
  for (var rr = 0; rr < rows; rr++) {
    for (var cc = 0; cc < cols; cc++) {
      var v = board[eng.idx(rr, cc)];
      if (!v) continue;
      var cx = X(cc), cy = Y(rr);
      if (kind === 'xiangqi') {
        var rad = Math.min(stepX, stepY) * 0.42;
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fillStyle = '#fdf3dc'; ctx.fill();
        ctx.strokeStyle = v > 0 ? '#b23b3b' : '#2f2f2f'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, rad * 0.82, 0, Math.PI * 2);
        ctx.strokeStyle = v > 0 ? '#d08a8a' : '#8a8a8a'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = v > 0 ? '#b23b3b' : '#2f2f2f';
        ctx.font = '700 ' + Math.round(rad * 1.12) + 'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(GX.name(v), cx, cy + rad * 0.04);
        // 选中高亮
        if (S.xqSel && S.xqSel[0] === rr && S.xqSel[1] === cc) {
          ctx.beginPath(); ctx.arc(cx, cy, rad * 1.18, 0, Math.PI * 2);
          ctx.strokeStyle = '#ff4d4f'; ctx.lineWidth = 2.5; ctx.stroke();
        }
        // 可走点提示
        if (S.xqSel) {
          var selV = board[GX.idx(S.xqSel[0], S.xqSel[1])];
          if (selV && GX.side(selV) === GX.side(g.hostId === S.uid ? 1 : 2)) {
            var ms = GX.moves(board, S.xqSel[0], S.xqSel[1]);
            for (var m = 0; m < ms.length; m++) {
              if (ms[m][0] === rr && ms[m][1] === cc) {
                ctx.beginPath(); ctx.arc(cx, cy, rad * 0.24, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(7,193,96,.75)'; ctx.fill();
              }
            }
          }
        }
      } else {
        var rad2 = Math.min(stepX, stepY) * (kind === 'go' ? 0.46 : 0.42);
        ctx.beginPath(); ctx.arc(cx, cy, rad2, 0, Math.PI * 2);
        ctx.fillStyle = v === 1 ? '#1a1a1a' : '#fafafa';
        ctx.fill();
        ctx.strokeStyle = v === 1 ? '#000' : '#bbb'; ctx.lineWidth = 1; ctx.stroke();
        if (kind === 'go') {   // 围棋棋子加高光更立体
          ctx.beginPath(); ctx.arc(cx - rad2 * 0.3, cy - rad2 * 0.32, rad2 * 0.26, 0, Math.PI * 2);
          ctx.fillStyle = v === 1 ? 'rgba(255,255,255,.28)' : 'rgba(255,255,255,.9)'; ctx.fill();
        }
      }
      // 最后一手标记
      if (lastMove && lastMove.r === rr && lastMove.c === cc) {
        ctx.beginPath(); ctx.arc(cx, cy, Math.min(stepX, stepY) * 0.13, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4d4f'; ctx.fill();
      }
    }
  }
}
// 围棋终局：双方确认后数子定胜负（中国规则，黑贴 3.75 目）

// 结束后发起方的选择：再来一局 / 其他游戏 / 结束游戏
function roomChoice(k) {
  var id = S.gameOpen; var g = gameOf(id);
  if (!g) return;
  if (k === 'end') {
    q(db.from('games').delete().eq('id', id)).then(function () { closeRoom(); refreshGames(); toast('已结束游戏'); });
    return;
  }
  if (k === 'pick') { closeRoom(); $('#bGame').click(); return; }
  if (k === 'last') {
    // 再来一局：重置棋盘，双方重新开始（仍保持同一局记录）
    var now = new Date().toISOString();
    // 各棋种初始局面不同（围棋 19 路空盘 / 象棋摆满棋子），必须用引擎的 newBoard
    var fresh = engineOf(g.kind).newBoard();
    S.xqSel = null;
    q(db.from('games').update({
      board: fresh, moves: [], status: 'playing', turn: 'host', winner: '',
      restart_by: S.uid, restart_kind: g.kind, updated_at: now,
    }).eq('id', id).select()).then(function (rows) {
      var row = rows && rows[0]; if (row) S.games[id] = fromGameRow(row);
      renderRoom(); toast('新的一局开始！');
    }).catch(function (e) { toast('操作失败：' + (e.message || e), 'err'); });
  }

// 离开游戏
function leaveGame() {
  var id = S.gameOpen; var g = gameOf(id);
  closeRoom();
  if (!g) return;
  var mine = g.hostId === S.uid;
  if (g.status === 'waiting') {
    // 等待阶段退出（发起方取消 / 另一方离开）→ 本局直接作废，
    // 标记 over 而不是删除：让聊天里的邀请卡片保留并置灰「游戏已开始或已过期」
    q(db.from('games').update({ status: 'over', winner: '', ended_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id))
      .then(function () { refreshGames(); }).catch(function () {});
    return;
  }
  if (g.status === 'playing') {
    // 对局中离开 → 标记 left，对方看到倒计时
    q(db.from('games').update({ status: 'left', updated_at: new Date().toISOString() }).eq('id', id))
      .then(function () { refreshGames(); }).catch(function () {});
  }
}
// 轮询同步游戏状态（由 tick 调用，接收已拉到的行）
function applyGames(rows) {
  var now = {};
  (rows || []).forEach(function (r) { now[r.id] = fromGameRow(r); });
  // 邀请卡片的状态指纹：只有状态真的变了才重渲染聊天区，避免每 2.5 秒刷一次、丢滚动位置
  var sigOf = function (a) {
    var s = ''; Object.keys(a).sort().forEach(function (k) { var g = a[k]; s += g.id + ':' + g.status + ':' + (g.guestId || '') + ':' + (g.winner || '') + ':' + (g.board || []).length + '|'; });
    return s;
  };
  var prevSig = S.gameSig || '';
  S.games = now;
  var sig = sigOf(now);
  var changed = sig !== prevSig;
  S.gameSig = sig;
  // 我正开着房间 → 重渲染房间浮层
  if (S.gameOpen) {
    var cur = now[S.gameOpen];
    if (!cur) { closeRoom(); toast('对局已结束'); }
    else {
      renderRoom();
      // 对手离开 → 启动 3 秒倒计时
      if (cur.status === 'left' && !S.gameLeaveT) startLeaveCountdown();
    }
  }
  // 邀请卡片状态变了就同步聊天区（无论房间是否开着）——
  // 否则房间开着时卡片会一直停在旧状态（如对方已加入仍显示「等待对方加入」）
  if (changed && S.cur) renderMsgs();
}

}

// ==================== 聊天记录 导出 / 读取 ====================
// 导出格式：lt_rec 1.0（JSON）+ 同名 TXT 便于直接阅读
var EXP_LIMIT = 3000;      // 单会话最多导出条数
var IMP_MAX = 8000;        // 单次最多导入条数（防止误选超大文件卡死）

function userName(id) {
  if (id === S.uid) return displayName(S.uid) || '我';
  return (S.profiles[id] && S.profiles[id].nickname) || ('用户' + String(id).slice(0, 6));
}
function convTitle(conv, type, id) {
  if (conv === 'hall' || id === 'hall') return '大厅';
  if (type === 'group') {
    var g = S.groups.filter(function (x) { return x.id === id; })[0];
    return (g && g.name) || ('群聊 ' + id);
  }
  return userName(id);
}
function attSummary(a) {
  var t = (a && a.type) || '';
  if (t === 'image') return '[图片] ' + (a.name || '');
  if (t === 'file') return '[文件] ' + (a.name || '') + (a.size ? ' (' + fmtSize(a.size) + ')' : '');
  return a && a.name ? '[' + t + '] ' + a.name : '';
}
// 把一条消息拍平成导出用的明文，便于 TXT 阅读与搜索
function msgToPlain(m) {
  var body = [];
  if (m.revoked) body.push('[消息已撤回]');
  var t = String(m.text || '');
  if (t) body.push(t);
  var a = attSummary(m.att);
  if (a) body.push(a);
  if (!body.length) body.push('(空消息)');
  return body.join(' ');
}
// 会话 -> 导出包
function buildPack(scopeConv) {
  var convs = [];
  (S.convs || []).forEach(function (c) {
    if (scopeConv && c.conv !== scopeConv) return;
    // 本地已载入的消息 + 云端最近消息，合并去重（本地可能翻过更早的页，云端可能有更新的）
    var local = (S.msgs[c.conv] || []);
    var remote = (S.recent || []).filter(function (m) { return m.conv === c.conv; });
    var seen = {}, all = [];
    local.concat(remote).forEach(function (m) {
      if (!m || m.id == null || seen[m.id]) return;
      seen[m.id] = 1;
      all.push(m);
    });
    all.sort(function (a, b) { return (Number(a.id) || 0) - (Number(b.id) || 0); });
    if (all.length > EXP_LIMIT) all = all.slice(all.length - EXP_LIMIT);   // 超限保留最新的
    var msgs = [];
    all.forEach(function (m) {
      msgs.push({
        id: m.id,
        time: m.created_at || null,
        from_id: m.sender_id || null,
        from: m.__from || userName(m.sender_id),
        text: String(m.text || ''),
        att: m.att || null,
        quote_id: m.quote_id || null,
        revoked: !!m.revoked,
        at: Array.isArray(m.at) ? m.at : [],
        plain: msgToPlain(m),
      });
    });
    if (!msgs.length) return;
    convs.push({
      conv: c.conv,
      type: c.type,
      title: c.name || convTitle(c.conv, c.type, c.id),
      msgCount: msgs.length,
      firstTime: msgs[0].time,
      lastTime: msgs[msgs.length - 1].time,
      msgs: msgs,
    });
  });
  return {
    format: 'lt_rec',
    version: 1,
    exportedAt: new Date().toISOString(),
    app: 'LanTalk',
    owner: { id: S.uid, nickname: (S.me && S.me.nickname) || '' },
    convs: convs,
  };
}
function packMsgCount(pack) {
  return (pack.convs || []).reduce(function (n, c) { return n + ((c.msgs && c.msgs.length) || 0); }, 0);
}
function lastTime(msgs) {
  var t = '';
  msgs.forEach(function (m) { if (m.time && m.time > t) t = m.time; });
  return t;
}
function dayKey(iso) {
  var d = new Date(iso);
  return isNaN(d.getTime()) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function dayLabel(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '未知时间';
  var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + w;
}
function stamp(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '--:--';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function packToTxt(pack) {
  var L = [];
  L.push('LanTalk 聊天记录');
  L.push('导出时间：' + new Date(pack.exportedAt).toLocaleString());
  L.push('导出账号：' + (pack.owner.nickname || pack.owner.id || '-'));
  L.push('会话数：' + pack.convs.length + '　消息数：' + packMsgCount(pack));
  L.push('');
  L.push('==================================================');
  (pack.convs || []).forEach(function (c) {
    L.push('');
    L.push('【' + c.title + '】　（' + c.msgCount + ' 条）');
    var dk = '';
    (c.msgs || []).forEach(function (m) {
      var k = m.time ? dayKey(m.time) : '';
      if (k && k !== dk) { dk = k; L.push(''); L.push('── ' + dayLabel(m.time) + ' ──'); }
      var when = m.time ? stamp(m.time) : '';
      if (m.revoked) { L.push('  ' + when + ' 「' + m.from + '」 ' + m.plain); return; }
      L.push('  ' + when + ' 「' + m.from + '」 ' + m.plain);
    });
    L.push('');
    L.push('--------------------------------------------------');
  });
  L.push('');
  L.push('（本文件由 LanTalk 导出，可用「设置 - 读取聊天记录」导入 JSON 版找回。）');
  return L.join('\n');
}
function downloadFile(name, content, mime) {
  try {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
    return true;
  } catch (e) {
    toast('导出失败：' + (e.message || e), 'err');
    return false;
  }
}
function expStamp() {
  var d = new Date();
  return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

// ---- 读取聊天记录弹窗 ----
function isPack(o) {
  if (!o || typeof o !== 'object') return false;
  if (o.format === 'lt_rec') return true;
  return Array.isArray(o.convs) && o.convs.some(function (c) { return c && Array.isArray(c.msgs); });
}
function normPack(o) {
  var list = [];
  (o.convs || []).forEach(function (c) {
    if (!c || !c.conv || !Array.isArray(c.msgs)) return;
    var msgs = [];
    c.msgs.forEach(function (m) {
      if (m == null) return;
      if (typeof m === 'string') { msgs.push({ from: '', text: m, time: null, att: null, revoked: false }); return; }
      msgs.push({
        id: m.id != null ? m.id : null,
        from: m.from || m.sender || userName(m.from_id) || '',
        from_id: m.from_id || null,
        text: String(m.text || ''),
        time: m.time || m.created_at || null,
        att: m.att || null,
        revoked: !!m.revoked,
        quote_id: m.quote_id || null,
        at: Array.isArray(m.at) ? m.at : [],
      });
    });
    if (!msgs.length) return;
    list.push({
      conv: c.conv, type: c.type || (String(c.conv).indexOf('g:') === 0 ? 'group' : 'private'),
      title: c.title || c.conv, msgCount: msgs.length, msgs: msgs,
    });
  });
  return { owner: o.owner || {}, exportedAt: o.exportedAt || null, convs: list };
}

function parseAndPreview(text, srcName) {
  var area = $('#impArea');

  catch (e) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">不是合法的 JSON 文件：' + esc(e.message || '解析失败') + '</div>'; return; }
  if (!isPack(o)) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">不认识的文件格式：不是 LanTalk 导出的聊天记录包。</div>'; return; }
  var pack = normPack(o);
  if (!pack.convs.length) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">这个包里没有消息。</div>'; return; }
  var total = 0, rows = '';

      + (isCur && local ? '　（当前会话已载入 ' + local + ' 条）' : '') + '</span></div>';
  });
  var oldest = '', newest = '';
  pack.convs.forEach(function (c) {
    c.msgs.forEach(function (m) {
      if (!m.time) return;
      if (!oldest || m.time < oldest) oldest = m.time;
      if (!newest || m.time > newest) newest = m.time;
    });
  });
  area.innerHTML = ''
    + '<div class="sprev">'
    + '<table>'
    + '<tr><td>来源</td><td>' + esc(srcName) + '</td></tr>'
    + '<tr><td>导出账号</td><td>' + esc(pack.owner.nickname || pack.owner.id || '未知') + (pack.exportedAt ? '　<span style="color:var(--tx3)">' + esc(String(pack.exportedAt).slice(0, 16).replace('T', ' ')) + '</span>' : '') + '</td></tr>'
    + '<tr><td>会话 / 消息</td><td><b>' + pack.convs.length + '</b> 个会话，<b>' + total + '</b> 条消息</td></tr>'
    + (oldest ? '<tr><td>时间范围</td><td>' + esc(String(oldest).slice(0, 16).replace('T', ' ')) + ' ~ ' + esc(String(newest).slice(0, 16).replace('T', ' ')) + '</td></tr>' : '')
    + '</table>'
    + '<div class="sc">' + rows + '</div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.6">导入后这些消息以只读方式补进本地记录，仅你本人可见、不上传云端；记录会保存在本机浏览器（约 1.5MB 上限），换设备或清缓存后需重新导入。</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
    + '<button class="btn gh" id="impCancel2">取消</button>'
    + '<button class="btn" id="impDo">确认导入</button></div>';
  $('#impCancel2').onclick = closeModal;
  $('#impDo').onclick = function () { doImport(pack); };
}
function doImport(pack) {
  var added = 0, dup = 0, convTouched = 0;
  pack.convs.forEach(function (c) {
    var arr = S.msgs[c.conv];
    var seen = {};
    if (arr) arr.forEach(function (m) { seen[m.id] = 1; });
    var add = [];
    c.msgs.forEach(function (m) {
      if (m.id == null) return;
      if (seen[m.id]) { dup++; return; }
      if (added + add.length >= IMP_MAX) return;
      seen[m.id] = 1;
      add.push({
        id: m.id,
        conv: c.conv,
        sender_id: m.from_id || null,
        text: m.text,
        att: m.att,
        quote_id: m.quote_id,
        revoked: m.revoked,
        at: m.at,
        created_at: m.time,
        __local: 1,
        __from: m.from || '历史记录',
      });
    });
    if (!add.length) return;
    convTouched++;
    var merged = (arr || []).concat(add);
    merged.sort(function (a, b) { return (Number(a.id) || 0) - (Number(b.id) || 0); });
    // 每会话最多保留 3000 条，优先保留最新的
    if (merged.length > 3000) merged = merged.slice(merged.length - 3000);
    S.msgs[c.conv] = merged;
    S.impLoaded = S.impLoaded || {};
    S.impLoaded[c.conv] = 1;
    added += add.length;
  });
  // 把导入出来的会话也挂进会话列表（并记住，防止轮询重建列表后消失）
  S.localConvs = S.localConvs || {};
  pack.convs.forEach(function (c) {
    if (cm()[c.conv]) return;
    S.localConvs[c.conv] = { title: c.title, type: c.type, id: convPeer(c) };
    S.convs.push({
      conv: c.conv, type: c.type, id: convPeer(c),
      name: c.title, avatar: '', color: '#8a8f99',
      isFriend: false, muted: false, last: null, localOnly: true,
    });
  });
  storeImport(pack);
  closeModal();
  renderConvs();
  if (S.cur && S.msgs[S.cur]) renderMsgs('keep');
  toast('导入完成：新增 ' + added + ' 条，去重跳过 ' + dup + ' 条，覆盖 ' + convTouched + ' 个会话');
}
// ---------- 导入记录的本地持久化（仅存自己浏览器，不上传） ----------
var IMP_STORE_KEY = 'lt_imports_v1';
var IMP_STORE_MAX = 1500000;   // 本地最多缓存约 1.5MB 导入包
function storeImport(pack) {
  try {
    var box = [];
    try { box = JSON.parse(localStorage.getItem(IMP_STORE_KEY) || '[]'); } catch (e) { box = []; }
    if (!Array.isArray(box)) box = [];
    var text = JSON.stringify(pack);
    if (text.length > IMP_STORE_MAX / 2) { toast('记录包较大，仅本次会话内生效（未存本机）'); return; }
    // 同一个包（同一导出时间）不重复存
    box = box.filter(function (p) { return !p || p.exportedAt !== pack.exportedAt; });
    box.push(pack);
    while (box.length > 1 && JSON.stringify(box).length > IMP_STORE_MAX) box.shift();
    localStorage.setItem(IMP_STORE_KEY, JSON.stringify(box));
  } catch (e) { /* 存储满/隐私模式：忽略，仅本次会话生效 */ }
}
function applyStoredImports() {
  var box;
  try { box = JSON.parse(localStorage.getItem(IMP_STORE_KEY) || '[]'); } catch (e) { return; }
  if (!Array.isArray(box) || !box.length) return;
  S.localConvs = S.localConvs || {};
  var n = 0;
  box.forEach(function (pack) {
    if (!pack || !Array.isArray(pack.convs)) return;
    pack.convs.forEach(function (c) {
      if (!c || !c.conv || !Array.isArray(c.msgs)) return;
      if (!cm()[c.conv]) S.localConvs[c.conv] = { title: c.title, type: c.type, id: convPeer(c) };
      var arr = S.msgs[c.conv] = S.msgs[c.conv] || [];
      var seen = {};
      arr.forEach(function (m) { seen[m.id] = 1; });
      c.msgs.forEach(function (m) {
        if (m.id == null || seen[m.id]) return;
        seen[m.id] = 1;
        arr.push({
          id: m.id, conv: c.conv, sender_id: m.from_id || null, text: m.text,
          att: m.att, quote_id: m.quote_id, revoked: m.revoked, at: m.at,
          created_at: m.time, __local: 1, __from: m.from || '历史记录',
        });
        n++;
      });
      arr.sort(function (a, b) { return (Number(a.id) || 0) - (Number(b.id) || 0); });
      S.impLoaded = S.impLoaded || {};
      S.impLoaded[c.conv] = 1;
    });
  });
}
// 从导入的会话标记里反推对方/群的 id
function convPeer(c) {
  if (c.conv === 'hall') return 'hall';
  if (String(c.conv).indexOf('g:') === 0) return String(c.conv).slice(2);
  if (String(c.conv).indexOf('p:') === 0) {
    var parts = String(c.conv).slice(2).split('~');
    return parts.filter(function (u) { return u !== S.uid; })[0] || parts[0];
  }
  return c.conv;
}

// 手机端侧栏 ☰ / 遮罩
var sideBtn = $('#bSide');
if (sideBtn) sideBtn.onclick = function () {
  var sd = document.querySelector('.side');
  var open = sd && sd.classList.toggle('open');
  var m = $('#sideMask');
  if (m) m.classList.toggle('hidden', !open);
};
var sideMask = $('#sideMask');
if (sideMask) sideMask.onclick = closeSide;

// 大厅直播：提示条点击进入 / 直播间按钮
var liveBarEl = $('#liveBar');
if (liveBarEl) liveBarEl.onclick = function () { if (S.live) openLive(); else toast('直播已结束'); };
if ($('#lvClose')) $('#lvClose').onclick = closeLive;
if ($('#lvAct')) $('#lvAct').onclick = function () {
  if (liveIsMine()) { confirmBox('确定结束当前直播？', stopLive); }
  else { closeLive(); }
};

// ---------- 初始化 ----------
try { S.theme = localStorage.getItem('lt_theme') || 'dark'; } catch (e) { S.theme = 'dark'; }
applyTheme();
renderJoinEmo();
setMode('pw');
CLOUD.auth.getSession().then(function (r) {
  var s = r.data;
  if (s && s.user) { S.uid = s.user.id; afterLogin(); }
  else showAuth();
}).catch(function () { showAuth(); });
})();

</script>
