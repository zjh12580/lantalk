<!--    生产发布前，请确认该 App 在 OneSignal 后台 Settings > Push & In-App > Web 的 Site URL 指向你的云端站点域名 -->
<!-- 2) 确保同目录的 OneSignalSDKWorker.js 随站点发布到根目录（作用域为 "/"） -->
<script>
  window.ONE_SIGNAL_APP_ID = "6a3141cd-e9d2-4f61-a8eb-75bbcdb0a945";
  window.__osReady = false;
  // 只有填入真实 App ID 才初始化，避免占位符触发控制台报错 / 无效网络请求
  if (window.ONE_SIGNAL_APP_ID && window.ONE_SIGNAL_APP_ID.indexOf('YOUR_') !== 0) {
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function (OneSignal) {
      try {
        await OneSignal.init({
          appId: window.ONE_SIGNAL_APP_ID,
          notifyButton: { enable: false },   // 不显示 OneSignal 默认按钮，由应用自身（首次新消息）触发订阅
          allowLocalhostAsSecureOrigin: true // 本地 server.js（localhost）也能测试 Web Push
        });
        window.__osReady = true;
      } catch (e) { window.__osReady = false; }
    });
  }
</script>

// 天气现象码（open-meteo WMO）→ 文案
function wmoText(c) {
  if (c === 0) return '晴 ☀️';
  if (c <= 2) return '多云间晴 🌤️';
  if (c === 3) return '阴 ☁️';
  if (c === 45 || c === 48) return '有雾 🌫️';
  if (c >= 51 && c <= 57) return '毛毛雨 🌦️';
  if (c >= 61 && c <= 67) return '有雨 🌧️';
  if (c >= 71 && c <= 77) return '有雪 ❄️';
  if (c >= 80 && c <= 82) return '阵雨 🌦️';
  if (c === 85 || c === 86) return '阵雪 🌨️';
  if (c >= 95) return '雷雨 ⛈️';
  return '天气未知 🤔';
}
function botPick(a) { return a[Math.floor(Math.random() * a.length)]; }

// 注：这里的 botJoke / botStory / botPoem 包装函数随语料一并删除（见上）。
// 笑话、故事、诗词现在由服务端 Agent 现场生成，不再从本地语料里挑。
// 时间词/动词/语气词：会出现在地名的**前面**（明天上海）或**后面**（广州今天、会不会、呢），
// 两头都要剥，否则「广州今天多少度」会解析出「广州今天」（踩过）
var CITY_PRE = /^(今天|明天|后天|大后天|现在|当前|昨日|昨天|明儿|明早|今晚|今早|中午|早上|晚上|下午|上午|这会儿|的|查|查下|查一下|查询|看看|看|报|报个|说说|问|问下|问一下|告诉我|知道|帮我|帮|我想|我要|了解|一下|下|个)+/;
var CITY_POST = /(今天|明天|后天|现在|当前|这两天|这几天|最近|今日|明日|的天气|天气|气温|温度|要不要带伞|要带伞|带伞吗|会不会|会不|会|要|下不下雨|下雨|下雪|冷不冷|热不热|多少度|怎么样|怎样|如何|呢|吗|吧|啊|呀|哈|哦|喔|了|的)+$/;
// 从自然语言里解析城市名（抽出来单独可测，天气主流程只负责取数据）
function parseCity(text) {
  var raw = String(text || '')
    .replace(/@小美/g, '').replace(/[\?？。！!，,、；;:：]/g, ' ');
  raw = raw.replace(/(的)?(天气|气温|温度|下雨|下雪|下不下雨|多少度|穿什么|冷不冷|热不热)/g, ' ');
  var city = '';
  var seg = raw.split(/\s+/).filter(Boolean);
  for (var i = 0; i < seg.length; i++) {
    var w = seg[i], guard = 0;
    while (guard++ < 10) {
      var before = w;
      w = w.replace(CITY_PRE, '').replace(CITY_POST, '').trim();
      if (w === before) break;
    }
    w = w.replace(/[的地得]$/, '').trim();
    if (w) { city = w; break; }
  }
  if (!city || !/[\u4e00-\u9fa5a-zA-Z]/.test(city)) city = '北京';
  if (city.length > 8) city = '北京';
  return city;
}

  //    catchUpScoped 每 ~10s 无条件回填 200 条（desc），里面绝大多数是比当前窗口更旧的历史。
  //    放行它们 = 把成百上千条旧话题灌进最新窗口，且因为回填是倒序到达、push 又是直接追加，
  //    数组会变成 [最新…, 旧…] → 用户看到的正是「聊着聊着最新消息变成历史记录」。
  //    历史归 loadHistory 分页管（往上翻才拉），回填只负责补「真·新消息」。
  // 只拦「有数字 id 且确实更旧」的：本地构造的消息（id 形如 local_xxx）mid() 是 0，

  if ((S.histLoaded || {})[conv] && arr.length && isNumId(m) && id < mid(arr[0])) return false;

    S.myMuted = {}; r[2].forEach(function (m) { if (m.user_id === S.uid) S.myMuted[m.group_id] = !!m.muted; });

 *
 * messages 表是全员共享的，所以「这条消息该不该让我看见」必须有个明确的判据。
 * 这个判据就是 canReadConv()，它是**唯一**权威。

// 重建白名单。数据同步（refreshAll / heavy tick）后调用，成本 O(好友数 + 群数)。
function rebuildMyConvs() {
  var set = {};

  (S.groups || []).forEach(function (g) {
    if (g.is_hall) { set[gconv(g.id)] = 1; set[g.id] = 1; return; }
    if ((S.members[g.id] || []).indexOf(S.uid) >= 0) set[gconv(g.id)] = 1;

  // 大厅兜底：即使 groups 还没同步，也允许读
  if (S.members && S.members.hall) set[gconv('hall')] = 1;
  // 私聊：好友关系（accepted）—— 不依赖 messages
  (S.friends || []).forEach(function (f) {
    if (f.status !== 'accepted') return;
    var other = f.a === S.uid ? f.b : (f.b === S.uid ? f.a : null);
    if (other && other !== S.uid) set[pconv(S.uid, other)] = 1;
  });
  // 私聊：最近消息里出现过的会话（推导源，非权威 —— 只是让历史会话不丢）
  (S.recent || []).forEach(function (m) {
    if (!m.conv || String(m.conv).indexOf('p:') !== 0) return;
    var pair = m.conv.slice(2).split('~');
    if (pair.indexOf(S.uid) >= 0) set[m.conv] = 1;
  });
  // 小美：固定可读（她不在 friends 表里也可能被私聊）
  if (S.uid) set[pconv(S.uid, BOT.id)] = 1;
  // 本地导入的会话：是我自己导进来的，可读
  Object.keys(S.localConvs || {}).forEach(function (cv) { set[cv] = 1; });
  // 自己已发过言的会话：发送即注册，保证刚建好还没同步关系的会话不被拦
  Object.keys(S.msgs || {}).forEach(function (cv) {
    var arr = S.msgs[cv];
    if (arr && arr.some(function (m) { return m.sender_id === S.uid; })) set[cv] = 1;
  });

function allowConv(conv) {

// 读权限判定：这是**唯一**该被用来决定「能否读某会话」的函数
function canReadConv(conv) {
  if (!conv || !S.uid) return false;
  if (!S.myConvs || !Object.keys(S.myConvs).length) rebuildMyConvs();
  return !!S.myConvs[conv];

// 是否只含我参与的会话（供拉取侧使用，见 tick / refreshAll）

function ensureConv(conv, type, id) {

  // ⚠️ 会话隔离（方案 B）：只拉「我参与的会话」的消息，而不是全表。
  //    messages 是全员共享表，不加这个条件的话陌生人私聊的正文照样会下传到浏览器，
  //    只是不显示而已 —— 那不叫隔离。

  var jobs = [
    q(db.from('messages').select('*').in('conv', scope).gt('id', S.lastId).order('id', { ascending: true }).limit(200)),
    q(db.from('friends').select('*')),
    q(db.from('profiles').select('*')),   // 每轮都拉（表很小）：「正在输入」状态 2.5 秒内可见
    q(db.from('games').select('*')),      // 每轮都拉（表很小）：游戏状态 2.5 秒内同步
  ];
  if (heavy) jobs.push(q(db.from('group_members').select('*')), q(db.from('groups').select('*')), q(db.from('reads').select('*')));
  // ⚠️ 逐路兜底（不再 Promise.all 一荣俱荣一损俱损）：7 路查询里任何一路抖动，

    var r = rs.map(function (x) { return x.ok ? x.v : []; });

    applyGames(r[3]);

      S.groups = r[5];

    if (heavy) {

      if (S.cur) renderMsgs();
    }
    if (fresh.length || heavy) { renderConvs(); updTitle(); }
    // 同步状态：全绿才亮「云端已同步」；偶发单路失败先静默（下一轮多半自己好），
    // 连续 2 轮失败才亮红字，避免网络抖动时左下角「连接异常」闪个不停。
    if (!bad.length) { S.syncFails = 0; setSync('云端已同步'); }

// 白名单扩张后补拉一次消息：解决「新会话在自己的第一条消息到达时还不在 scope 里」的时序问题。

function catchUpScoped() {

//    虽然随后会被云端覆盖，但那一闪足以让人以为数据错乱。

    var arr = (S.msgs[conv] || []).filter(function (m) { return !m.__local; });
    if (!arr.length) return;
    o[conv] = arr.slice(Math.max(0, arr.length - MSG_CACHE_MAX));

function loadHistory(conv, before) {
  var qy = db.from('messages').select('*').eq('conv', conv).order('id', { ascending: false }).limit(MSG_PAGE);
  if (before) qy = qy.lt('id', before);
  return q(qy).then(function (rows) {
    rows = (rows || []).slice().reverse();   // 升序：旧 → 新
    var lo = rows.length ? mid(rows[0]) : 0;
    var hi = rows.length ? mid(rows[rows.length - 1]) : 0;
    // 兜底：云端已翻到底（rows 空），但本地导入历史还有更旧的 → 直接取本地一页，
    // 否则这些历史永远显示不出来（导入包与云端 id 不重叠时会命中这条路径）。
    if (before && !rows.length) {
      var older = ((S.localMsgs || {})[conv] || [])
        .filter(function (m) { return mid(m) < mid({ id: before }); })
        .sort(function (a, b) { return mid(b) - mid(a); });
      var pg = older.slice(0, MSG_PAGE).reverse();
      if (pg.length) {
        S.msgs[conv] = mergeById(pg, S.msgs[conv]);
        S.more[conv] = older.length > MSG_PAGE;
        renderMsgs('keep');
      } else {

      return;
    }
    if (before) {
      // 往更早翻：新页拼到已有列表**前面**，并合入落在同一区间的导入历史
      S.msgs[conv] = mergeById(rows.concat(localPage(conv, lo, hi)), S.msgs[conv]);
    } else {
      // ⚠️ 首屏**只放最新一页**。导入的历史不再 concat 全量进来 ——
      //    旧实现 rows.concat(全部 __local) 会把几千条历史直接灌进最新窗口（用户报的「显示错乱」）。
      S.msgs[conv] = mergeById(rows, localPage(conv, lo, hi));
    }
    // 「还有更早」= 云端这页满了，或本地导入里还有比当前最早一条更旧的消息
    S.more[conv] = rows.length === MSG_PAGE || hasEarlierLocal(conv, lo);
    rows.forEach(trackRecent);   // 补齐 recent，避免未读/预览缺失
    // 只有「首屏加载成功」才记为已拉过历史（分页 before 不算）：
    // 失败时不能标记，否则下次进会话就不会再拉了 → 永远只剩残缺消息。
    if (!before) { S.histLoaded = S.histLoaded || {}; S.histLoaded[conv] = 1; }

    if (S.histLoaded) delete S.histLoaded[conv];

}

// ===================== 群聊话题墙（参考小红书话题发现页） =====================

function topicsOf(text) {

  var t = esc(text || '');

    var s = seg.replace(/#([^\s#@]{1,30})/g, function (w) {

    if (m.type === 'system' || m.type === 'card' || m.revoked) return;
    var ts = topicsOf(m.text);
    if (!ts.length) return;
    var cover = (m.type === 'image' && m.file_path) ? m.file_path : null;
    var tm = new Date(m.created_at).getTime() || 0;
    ts.forEach(function (t) {
      var k = t.toLowerCase();
      if (!map[k]) map[k] = { name: t, count: 0, users: {}, cover: null, last: 0, lastMsg: null, lastBy: null };
      var o = map[k];
      o.count++; o.users[m.sender_id] = 1;
      if (!o.cover && cover) o.cover = cover;

// 复制到剪贴板：navigator.clipboard 只在安全上下文（https / localhost）存在，
// 直连 http://192.168.x.x 这种内网地址时它是 undefined —— 原来直接
// navigator.clipboard.writeText(...) 会当场抛 TypeError，点「复制」毫无反应
// 还往控制台扔异常。这里补一条 execCommand 的兜底路径。
function copyText(s) {
  var str = String(s == null ? '' : s);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(str).then(function () { toast('已复制'); }, function () { legacyCopy(str); });
    return;
  }
  legacyCopy(str);
}
function legacyCopy(str) {
  try {
    var ta = document.createElement('textarea');
    ta.value = str;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, str.length);
    var ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? '已复制' : '复制失败', ok ? '' : 'err');
  } catch (e) { toast('复制失败', 'err'); }
}

//       ② 币种别名 / 6 位股票代码（含 sh/sz/bj 前缀）

// ---------- 文件 ----------
// 上传链路（网关偶发「文件已落盘但响应报 404 STORAGE_BUCKET_NOT_FOUND」）：
//   1) SDK update（PUT，不带 x-upsert 头，CORS 安全）；
//   2) 报错后先用 exists() 验证对象是否其实已经写上 —— 写上了就算成功；
//   3) 真没写上再手动 PUT 兜底，并再次验证。
function rawUpload(path, file) {
  var opts = { contentType: file.type || 'application/octet-stream', cacheControl: '3600' };
  var first = st.update
    ? q(st.update(path, file, opts)).then(function () { return true; })
    : Promise.reject(new Error('no update api'));
  return first.catch(function (e1) {
    return objExists(path).then(function (ok) {
      if (ok) return true;   // 实际已落盘，网关响应误报，忽略
      return manualPut(path, file).then(function () {
        return objExists(path).then(function (ok2) { if (!ok2) throw (e1 || new Error('upload failed')); return true; });
      });
    });
  });
}
function objExists(path) {
  if (!st.exists && !st.info) return Promise.resolve(false);
  var p = st.exists ? st.exists(path) : st.info(path);
  return Promise.resolve(p).then(function (r) {
    if (!r || r.error) return false;
    var d = r.data;
    if (d === true) return true;
    if (d && typeof d === 'object') return !!(d.exists === true || d.Id || d.Key || d.name);
    return false;
  }).catch(function () { return false; });
}
function manualPut(path, file) {
  return CLOUD.auth.getAccessToken().then(function (tok) {
    var fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', file);
    var hd = { 'x-wb-webapp-access-key': PUBKEY };
    if (tok) hd['Authorization'] = 'Bearer ' + tok;
    return fetch(ENDPOINT + '/.cloud/storage/object/runtime/' + encodeURI(path), { method: 'PUT', headers: hd, body: fd });
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + (t ? '：' + t.slice(0, 120) : '')); });
  });
}

function friendRel(pid) {
  return S.friends.filter(function (f) { return (f.a === S.uid && f.b === pid) || (f.b === S.uid && f.a === pid); })[0] || null;
}
function sendFriendReq(pid) {
  var rel = friendRel(pid);
  if (rel) {
    toast(rel.status === 'accepted' ? '你们已经是好友了' : '请求已发送，等待对方确认');
    return;

  // 注意：RLS 策略 friends_insert 只允许写 a = auth.uid() 的行，故只写自己这一侧；
  // isFriend / friendRel 都是双向匹配，单边记录已足够。
  if (pid === BOT.id) {

// 浮层通用：关闭 + 定位（定位后绝不遮住触发按钮，否则按钮点不到就再也关不掉）
// 注：closePops 定义在下方「@ 提及」区块（同时清空 atList / cmdList）
// align: 'center'(默认，面板中心对齐按钮中心) | 'left'(面板左边缘对齐按钮左边缘)
function placePop(pop, btn, align) {
  var r = btn.getBoundingClientRect();
  var w = pop.offsetWidth || 320;
  var h = pop.offsetHeight || 210;
  var left = align === 'left'
    ? r.left
    : r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  var vh = window.innerHeight;
  // 底边锚定：面板底边钉在按钮上方 8px，高度变化时只向上伸缩（上方收缩），底边不动
  var bottom = r.top - 8;
  var top = bottom - h;
  // 上方越界 → 翻到按钮下方（此时顶边锚定在按钮下方 8px，高度变化向下伸缩）
  if (top < 8) {
    var below = r.bottom + 8;
    // 按钮下方放得下就锚定在下方；放不下则贴屏幕顶部（保证尽可能多内容可见、位置稳定不跳）
    top = (below + h <= vh - 8) ? below : 8;
  }
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}
// ---------- @ 提及：输入 @ 自动弹出群成员列表（↑↓ 选择 / Enter 确认 / 点击确认）----------
// 关键：列表打开时 Enter 是「确认艾特谁」，绝不能触发发送。
function atCandidates() {
  var c = cm()[S.cur];
  if (!c || c.type !== 'group') return [];
  // ⚠️ 必须把小美**显式并入**候选：ensureBot() 异步只在拉完数据后把她补进 members，
  //    且历史上只补 S.members.hall —— 非大厅群永远没有她；
  //    首次进群时 ensureBot 可能还没跑完 → 表现为「第一次 @ 没有小美，再 @ 一次就有」。
  //    这里不依赖 S.members 是否已同步，直接拼上（真实成员 + 小美）。
  var ids = (S.members[c.id] || []).slice();
  if (ids.indexOf(BOT.id) < 0) ids.push(BOT.id);
  return ids.map(function (u) {
    var p = (u === BOT.id) ? { nickname: BOT.name } : (S.profiles[u] || {});
    return { u: u, name: (p.nickname || ''), self: u === S.uid };
  }).filter(function (x) { return x.name; });
}
// 渲染 @ 成员浮层；kw 为空 = 全部成员
function renderAtPop(kw) {
  var pop = $('#mpop');
  var q0 = String(kw || '').toLowerCase();
  var list = atCandidates();
  if (q0) list = list.filter(function (x) { return x.name.toLowerCase().indexOf(q0) >= 0; });
  if (!list.length) { pop.classList.add('hidden'); S.atList = []; return; }
  S.atList = list; S.atIdx = 0;
  pop.className = 'pop mpop';
  pop.innerHTML = list.map(function (x, i) {
    var p = S.profiles[x.u] || {};
    return '<div class="mitem' + (i === 0 ? ' on' : '') + '" data-u="' + esc(x.u) + '">'
      + avOf(x.name, p.avatar, p.color, 's')
      + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.name) + '</span>'
      + (x.self ? '<span style="font-size:11px;color:var(--tx3)">我</span>' : '') + '</div>';
  }).join('');
  $$('#mpop .mitem').forEach(function (it, i) {
    it.onmouseenter = function () { S.atIdx = i; hlAt(); };
    it.onclick = function () { pickAt(it.dataset.u); };
  });
  pop.classList.remove('hidden');
  placePop(pop, $('#pPill'), 'left');   // 左对齐输入框（不居中）
}
function hlAt() {
  $$('#mpop .mitem').forEach(function (it, i) { it.classList.toggle('on', i === S.atIdx); });

// 五子棋：棋盘 15x15，board 用长度 225 的一维数组（0空 1黑 2白）
var GB = {
  n: 15,
  idx: function (r, c) { return r * 15 + c; },
  newBoard: function () { var a = []; for (var i = 0; i < 225; i++) a.push(0); return a; },
  // 判断在 (r,c) 落子后是否五连
  checkWin: function (board, r, c, v) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < 4; d++) {
      var cnt = 1;
      for (var s = -1; s <= 1; s += 2) {
        for (var k = 1; k < 5; k++) {
          var rr = r + dirs[d][0] * k * s, cc = c + dirs[d][1] * k * s;
          if (rr < 0 || cc < 0 || rr >= 15 || cc >= 15) break;
          if (board[GB.idx(rr, cc)] !== v) break;
          cnt++;
        }
      }
      if (cnt >= 5) return true;
    }
    return false;
  },
  // 统一落子：返回 {ok, board, msg, win}
  place: function (board, r, c, v) {
    var b = (board && board.length) ? board.slice() : GB.newBoard();
    if (r < 0 || c < 0 || r >= 15 || c >= 15) return { ok: false, msg: '超出棋盘' };
    if (b[GB.idx(r, c)] !== 0) return { ok: false, msg: '这里已经有子了' };
    b[GB.idx(r, c)] = v;
    return { ok: true, board: b, win: GB.checkWin(b, r, c, v) };
  },
};

// ---------- 围棋（19路，中国规则数子 + 贴目 3.75）----------
// board: 0空 1黑(host) 2白(guest)
var GG = {
  n: 19,
  KOMI: 3.75,
  idx: function (r, c) { return r * 19 + c; },
  newBoard: function () { var a = []; for (var i = 0; i < 361; i++) a.push(0); return a; },
  neigh: function (r, c) {
    var out = [];
    if (r > 0) out.push([r - 1, c]);
    if (r < 18) out.push([r + 1, c]);
    if (c > 0) out.push([r, c - 1]);
    if (c < 18) out.push([r, c + 1]);
    return out;
  },
  // (r,c) 所在连通块 → {stones:[[r,c]], libs:{idx:1}}
  group: function (board, r, c) {
    var v = board[GG.idx(r, c)];
    if (!v) return { stones: [], libs: {} };
    var seen = {}, stones = [], libs = {}, stack = [[r, c]];
    seen[GG.idx(r, c)] = 1;
    while (stack.length) {
      var cur = stack.pop(); stones.push(cur);
      var ns = GG.neigh(cur[0], cur[1]);
      for (var i = 0; i < ns.length; i++) {
        var rr = ns[i][0], cc = ns[i][1], k = GG.idx(rr, cc);
        if (board[k] === 0) libs[k] = 1;
        else if (board[k] === v && !seen[k]) { seen[k] = 1; stack.push([rr, cc]); }
      }
    }
    return { stones: stones, libs: libs };
  },
  // 落子：先提对方无气块，再判自杀
  place: function (board, r, c, v) {
    var b = (board && board.length === 361) ? board.slice() : GG.newBoard();
    if (r < 0 || c < 0 || r > 18 || c > 18) return { ok: false, msg: '超出棋盘' };
    if (b[GG.idx(r, c)] !== 0) return { ok: false, msg: '这里已经有子了' };
    var opp = v === 1 ? 2 : 1;
    b[GG.idx(r, c)] = v;
    var captured = [];
    var ns = GG.neigh(r, c);
    for (var i = 0; i < ns.length; i++) {
      if (b[GG.idx(ns[i][0], ns[i][1])] !== opp) continue;
      var g = GG.group(b, ns[i][0], ns[i][1]);
      if (Object.keys(g.libs).length === 0) {
        g.stones.forEach(function (s) { b[GG.idx(s[0], s[1])] = 0; captured.push({ r: s[0], c: s[1] }); });
      }
    }
    if (!captured.length) {
      var mine = GG.group(b, r, c);
      if (Object.keys(mine.libs).length === 0) return { ok: false, msg: '不能落子自杀' };
    }
    return { ok: true, board: b, captured: captured };
  },
  // 中国规则数子：活子 + 围空，白加贴目
  score: function (board) {
    var black = 0, white = 0, i;
    for (i = 0; i < 361; i++) { if (board[i] === 1) black++; else if (board[i] === 2) white++; }
    var seen = {}, terr = { 1: 0, 2: 0 };
    for (var r = 0; r < 19; r++) {
      for (var c = 0; c < 19; c++) {
        var k0 = GG.idx(r, c);
        if (board[k0] !== 0 || seen[k0]) continue;
        var region = [], borders = {}, stack = [[r, c]];
        seen[k0] = 1;
        while (stack.length) {
          var cur = stack.pop(); region.push(cur);
          var ns2 = GG.neigh(cur[0], cur[1]);
          for (var j = 0; j < ns2.length; j++) {
            var rr = ns2[j][0], cc = ns2[j][1], kk = GG.idx(rr, cc);
            if (board[kk] === 0) { if (!seen[kk]) { seen[kk] = 1; stack.push([rr, cc]); } }
            else borders[board[kk]] = 1;
          }
        }
        var keys = Object.keys(borders);
        if (keys.length === 1) terr[keys[0]] += region.length;
      }
    }
    var bTotal = black + terr[1];
    var wTotal = white + terr[2] + GG.KOMI;
    return { black: bTotal, white: wTotal, winner: bTotal > wTotal ? 1 : (wTotal > bTotal ? 2 : 0) };
  },
};

// ---------- 象棋（9列 × 10行）----------
// board 长度 90；红(host)=正数 黑(guest)=负数
//  1兵/卒 2炮 3车 4马 5象 6士 7将/帅
// ⚠️ 阵营靠**正负号**表达，不是数值：GX.side(2) === 1（因为 2 是正数）。
//    所以「我方棋子值」在象棋里必须是 ±1，绝不能写成 房主?1:2 ——
//    那样客人会拿到 2 被判成红方，表现就是「两个人都只能动一边」（已修，见 gamePlace）。
//    五子棋/围棋 (GB/GG) 用的是 1/2 颜色标识，那是另一套约定，两者不要互相「统一」。
var GX = {

      var rc = boardCell(cv, ev, g.kind);
      if (rc) gamePlace(rc.r, rc.c);
    };
      var hint = $('#grHint');
      if (hint) {
        hint.classList.remove('warn');
        var meSide = g.hostId === S.uid ? 'host' : 'guest';
        var mySideVal = meSide === 'host' ? 1 : 2;          // 象棋阵营：红 1 / 黑 2
        var chkSide = xqCheckSide(g);
        if (g.status === 'waiting') {
          hint.textContent = '对方加入后即可开始落子';
        } else if (chkSide) {
          // 将军：双方都看得见的红字提示（只是提醒，不再限制走法）
          hint.textContent = (chkSide === mySideVal)
            ? '⚠️ 将军！你的老将危险了（仍可自由走子）'
            : '⚠️ 将军！对方被将军';
          hint.classList.remove('brand');
          hint.classList.add('warn');
        } else {
          var myTurn = g.turn === meSide;
          var turnName = g.turn === 'host' ? (g.hostName || '发起方') : (g.guestName || '对手');
          if (!myTurn) {
            hint.textContent = '⏳ ' + turnName + ' 正在思考…';
            hint.classList.remove('brand');
          } else if (g.kind === 'xiangqi') {
            hint.textContent = S.xqSel ? '✅ 轮到你走子 —— 再点目标点走子（点原子取消）' : '✅ 轮到你走子 —— 先点自己的棋子';
            hint.classList.add('brand');
          } else {
            hint.textContent = '✅ 轮到你落子';
            hint.classList.add('brand');
          }
        }
      }
  }
}
// 画布坐标 → 棋盘格（按棋种取几何参数）
function boardCell(cv, ev, kind) {
  var meta = BOARD_META[kind] || BOARD_META.gomoku;
  var SZ = meta.size, pad = meta.pad;
  var cols = meta.n, rows = meta.rows || meta.n;
  var cellX = (SZ - pad * 2) / (cols - 1);
  var cellY = (SZ - pad * 2) / (rows - 1);
  var rect = cv.getBoundingClientRect();
  var x = (ev.clientX - rect.left) * (SZ / rect.width);
  var y = (ev.clientY - rect.top) * (SZ / rect.height);
  var c = Math.round((x - pad) / cellX);
  var r = Math.round((y - pad) / cellY);
  if (r < 0 || c < 0 || r >= rows || c >= cols) return null;
  return { r: r, c: c };
}
// 画棋盘（三种棋共用：网格 + 棋子 + 最后一手标记）
function drawBoard(g) {
  var cv = $('#gBoard'); if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  if (!ctx) return;   // 画布不可用时静默降级，不让渲染崩掉
  var kind = (g && g.kind) || 'gomoku';
  var meta = BOARD_META[kind] || BOARD_META.gomoku;
  var SZ = meta.size, pad = meta.pad;
  var cols = meta.n, rows = meta.rows || meta.n;
  var eng = engineOf(kind);
  var board = (g && g.board && g.board.length) ? g.board : eng.newBoard();
  var lastMove = ((g && g.moves) || []).slice(-1)[0];
  var X = function (c) { return pad + c * ((SZ - pad * 2) / (cols - 1)); };
  var Y = function (r) { return pad + r * ((SZ - pad * 2) / (rows - 1)); };

  ctx.clearRect(0, 0, SZ, SZ);
  ctx.fillStyle = kind === 'xiangqi' ? '#f0d9a8' : (kind === 'go' ? '#dbb96a' : '#e9be7c');
  ctx.fillRect(0, 0, SZ, SZ);

  if (kind === 'xiangqi') {
    // 象棋：竖线中间断开（楚河汉界），外框加粗
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1;
    for (var r0 = 0; r0 < rows; r0++) {
      ctx.beginPath(); ctx.moveTo(X(0), Y(r0)); ctx.lineTo(X(cols - 1), Y(r0)); ctx.stroke();
    }
    for (var c0 = 0; c0 < cols; c0++) {
      if (c0 === 0 || c0 === cols - 1) {
        ctx.beginPath(); ctx.moveTo(X(c0), Y(0)); ctx.lineTo(X(c0), Y(rows - 1)); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(X(c0), Y(0)); ctx.lineTo(X(c0), Y(4)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X(c0), Y(5)); ctx.lineTo(X(c0), Y(rows - 1)); ctx.stroke();
      }
    }
    ctx.lineWidth = 2.2;
    ctx.strokeRect(X(0), Y(0), X(cols - 1) - X(0), Y(rows - 1) - Y(0));
    ctx.lineWidth = 1;
    // 九宫斜线
    var gong = function (rt, rb) {
      ctx.beginPath(); ctx.moveTo(X(3), Y(rt)); ctx.lineTo(X(5), Y(rb)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(5), Y(rt)); ctx.lineTo(X(3), Y(rb)); ctx.stroke();
    };
    gong(0, 2); gong(7, 9);
    // 楚河汉界
    ctx.fillStyle = '#8a6a3a';
    ctx.font = '600 ' + Math.round((Y(5) - Y(4)) * 0.42) + 'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('楚 河', (X(1) + X(2)) / 2, (Y(4) + Y(5)) / 2);
    ctx.fillText('汉 界', (X(6) + X(7)) / 2, (Y(4) + Y(5)) / 2);
  } else {
    // 五子棋 / 围棋：满盘网格
    ctx.strokeStyle = kind === 'go' ? '#6f5426' : '#7a5a2e';
    ctx.lineWidth = kind === 'go' ? 0.9 : 1;
    for (var i = 0; i < rows; i++) {
      ctx.beginPath(); ctx.moveTo(X(0), Y(i)); ctx.lineTo(X(cols - 1), Y(i)); ctx.stroke();
    }
    for (var j = 0; j < cols; j++) {
      ctx.beginPath(); ctx.moveTo(X(j), Y(0)); ctx.lineTo(X(j), Y(rows - 1)); ctx.stroke();
    }
    // 围棋星位
    if (kind === 'go') {
      [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]].forEach(function (s) {
        ctx.beginPath(); ctx.arc(X(s[1]), Y(s[0]), 3.2, 0, Math.PI * 2);
        ctx.fillStyle = '#6f5426'; ctx.fill();
      });
    }
  }

  // 棋子
  var stepX = (SZ - pad * 2) / (cols - 1);
  var stepY = (SZ - pad * 2) / (rows - 1);
  for (var rr = 0; rr < rows; rr++) {
    for (var cc = 0; cc < cols; cc++) {
      var v = board[eng.idx(rr, cc)];
      if (!v) continue;
      var cx = X(cc), cy = Y(rr);
      if (kind === 'xiangqi') {
        var rad = Math.min(stepX, stepY) * 0.42;
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fillStyle = '#fdf3dc'; ctx.fill();
        ctx.strokeStyle = v > 0 ? '#b23b3b' : '#2f2f2f'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, rad * 0.82, 0, Math.PI * 2);
        ctx.strokeStyle = v > 0 ? '#d08a8a' : '#8a8a8a'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = v > 0 ? '#b23b3b' : '#2f2f2f';
        ctx.font = '700 ' + Math.round(rad * 1.12) + 'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(GX.name(v), cx, cy + rad * 0.04);
        // 选中高亮
        if (S.xqSel && S.xqSel[0] === rr && S.xqSel[1] === cc) {
          ctx.beginPath(); ctx.arc(cx, cy, rad * 1.18, 0, Math.PI * 2);
          ctx.strokeStyle = '#ff4d4f'; ctx.lineWidth = 2.5; ctx.stroke();
        }
        // 可走点提示
        if (S.xqSel) {
          var selV = board[GX.idx(S.xqSel[0], S.xqSel[1])];
          if (selV && GX.side(selV) === (g.hostId === S.uid ? 1 : 2)) {
            // ⚠️ 这里 GX.side() 返回 1(红)/2(黑)，与 xqVal 的 ±1 不同域，别去「统一」它
            var ms = GX.moves(board, S.xqSel[0], S.xqSel[1]);
            for (var m = 0; m < ms.length; m++) {
              if (ms[m][0] === rr && ms[m][1] === cc) {
                ctx.beginPath(); ctx.arc(cx, cy, rad * 0.24, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(7,193,96,.75)'; ctx.fill();
              }
            }
          }
        }
      } else {
        var rad2 = Math.min(stepX, stepY) * (kind === 'go' ? 0.46 : 0.42);
        ctx.beginPath(); ctx.arc(cx, cy, rad2, 0, Math.PI * 2);
        ctx.fillStyle = v === 1 ? '#1a1a1a' : '#fafafa';
        ctx.fill();
        ctx.strokeStyle = v === 1 ? '#000' : '#bbb'; ctx.lineWidth = 1; ctx.stroke();
        if (kind === 'go') {   // 围棋棋子加高光更立体
          ctx.beginPath(); ctx.arc(cx - rad2 * 0.3, cy - rad2 * 0.32, rad2 * 0.26, 0, Math.PI * 2);
          ctx.fillStyle = v === 1 ? 'rgba(255,255,255,.28)' : 'rgba(255,255,255,.9)'; ctx.fill();
        }
      }
      // 最后一手标记
      if (lastMove && lastMove.r === rr && lastMove.c === cc) {
        ctx.beginPath(); ctx.arc(cx, cy, Math.min(stepX, stepY) * 0.13, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4d4f'; ctx.fill();
      }
    }
  }
  // 象棋：被将军的一方，给老将套一圈红环（双方都看得见的第二重提示）
  if (kind === 'xiangqi') {
    var cs = xqCheckSide(g);
    var kp = cs ? GX.kingPos(board, cs) : null;
    if (kp) {
      ctx.beginPath(); ctx.arc(X(kp[1]), Y(kp[0]), Math.min(stepX, stepY) * 0.54, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff4d4f'; ctx.lineWidth = 3.5; ctx.stroke();
    }
  }
}
// 围棋终局：双方确认后数子定胜负（中国规则，黑贴 3.75 目）
function goEndGame() {
  var id = S.gameOpen; var g = gameOf(id);
  if (!g || g.kind !== 'go') return;
  if (g.status !== 'playing') return;
  var sc = GG.score((g.board && g.board.length === 361) ? g.board : GG.newBoard());
  var meSide = g.hostId === S.uid ? 1 : 2;
  var iWin = sc.winner === meSide;
  var txt = '终局数子：\n黑 ' + sc.black.toFixed(2) + ' 目　白 ' + sc.white.toFixed(2) + ' 目（含贴目）\n\n'
    + (sc.winner === 0 ? '和棋' : (iWin ? '你将获胜，确定终局？' : '你将被判负，确定终局？'));
  confirmBox(txt, function () {
    q(db.from('games').update({
      status: 'over', winner: sc.winner === 0 ? '' : (sc.winner === 1 ? g.hostId : g.guestId),
      ended_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).eq('id', id).select()).then(function (rows) {
      var row = rows && rows[0]; if (row) S.games[id] = fromGameRow(row);
      renderRoom();
      toast(sc.winner === 0 ? '和棋' : ('🎉 ' + (sc.winner === meSide ? '你赢了' : '你输了')));
    }).catch(function (e) { toast('操作失败：' + (e.message || e), 'err'); });
  });
}
// 结束后发起方的选择：再来一局 / 其他游戏 / 结束游戏
function roomChoice(k) {
  var id = S.gameOpen; var g = gameOf(id);
  if (!g) return;
  if (k === 'end') {
    q(db.from('games').delete().eq('id', id)).then(function () { closeRoom(); refreshGames(); toast('已结束游戏'); });
    return;
  }
  if (k === 'pick') { closeRoom(); $('#bGame').click(); return; }
  if (k === 'last') {
    // 再来一局：重置棋盘，双方重新开始（仍保持同一局记录）
    var now = new Date().toISOString();
    // 各棋种初始局面不同（围棋 19 路空盘 / 象棋摆满棋子），必须用引擎的 newBoard
    var fresh = engineOf(g.kind).newBoard();
    S.xqSel = null;
    q(db.from('games').update({
      board: fresh, moves: [], status: 'playing', turn: 'host', winner: '',
      restart_by: S.uid, restart_kind: g.kind, updated_at: now,
    }).eq('id', id).select()).then(function (rows) {
      var row = rows && rows[0]; if (row) S.games[id] = fromGameRow(row);
      renderRoom(); toast('新的一局开始！');
    }).catch(function (e) { toast('操作失败：' + (e.message || e), 'err'); });
  }
}
// 离开游戏
function leaveGame() {
  var id = S.gameOpen; var g = gameOf(id);
  closeRoom();
  if (!g) return;
  // 注意：不要在这里重新算 hostId === S.uid 之类的角色判断，
  // 后续分支全部按 g.status 走（waiting → 作废本局，playing → 标记 left）。
  if (g.status === 'waiting') {
    // 等待阶段退出（发起方取消 / 另一方离开）→ 本局直接作废，
    // 标记 over 而不是删除：让聊天里的邀请卡片保留并置灰「游戏已开始或已过期」
    q(db.from('games').update({ status: 'over', winner: '', ended_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id))
      .then(function () { refreshGames(); }).catch(function () {});
    return;
  }
  if (g.status === 'playing') {
    // 对局中离开 → 标记 left，对方看到倒计时
    q(db.from('games').update({ status: 'left', updated_at: new Date().toISOString() }).eq('id', id))
      .then(function () { refreshGames(); }).catch(function () {});
  }
}
// 轮询同步游戏状态（由 tick 调用，接收已拉到的行）
function applyGames(rows) {
  var now = {};
  (rows || []).forEach(function (r) { now[r.id] = fromGameRow(r); });
  // 邀请卡片的状态指纹：只有状态真的变了才重渲染聊天区，避免每 2.5 秒刷一次、丢滚动位置
  var sigOf = function (a) {
    var s = ''; Object.keys(a).sort().forEach(function (k) { var g = a[k]; s += g.id + ':' + g.status + ':' + (g.guestId || '') + ':' + (g.winner || '') + ':' + (g.board || []).length + '|'; });
    return s;
  };
  var prevSig = S.gameSig || '';
  S.games = now;
  var sig = sigOf(now);
  var changed = sig !== prevSig;
  S.gameSig = sig;
  // 我正开着房间 → 重渲染房间浮层
  if (S.gameOpen) {
    var cur = now[S.gameOpen];
    if (!cur) { closeRoom(); toast('对局已结束'); }
    else {
      renderRoom();
      // 对手离开 → 启动 3 秒倒计时
      if (cur.status === 'left' && !S.gameLeaveT) startLeaveCountdown();
    }
  }
  // 邀请卡片状态变了就同步聊天区（无论房间是否开着）——
  // 否则房间开着时卡片会一直停在旧状态（如对方已加入仍显示「等待对方加入」）
  if (changed && S.cur) renderMsgs();
}
function startLeaveCountdown() {
  stopLeaveCountdown();
  S.gameLeaveN = 3;
  var el = $('#grCnt'); if (el) el.textContent = String(S.gameLeaveN);
  S.gameLeaveT = setInterval(function () {
    S.gameLeaveN--;
    var e2 = $('#grCnt');
    if (e2) e2.textContent = String(Math.max(0, S.gameLeaveN));
    if (S.gameLeaveN <= 0) { stopLeaveCountdown(); toast('对方已离开，对局结束'); closeRoom(); }
  }, 1000);
}
// 邀请卡片点击（事件委托）

// ==================== 聊天记录 导出 / 读取 ====================
// 导出格式：lt_rec 1.0（JSON）+ 同名 TXT 便于直接阅读
var EXP_LIMIT = 3000;      // 单会话最多导出条数
var IMP_MAX = 8000;        // 单次最多导入条数（防止误选超大文件卡死）

function userName(id) {
  if (id === S.uid) return displayName(S.uid) || '我';
  return (S.profiles[id] && S.profiles[id].nickname) || ('用户' + String(id).slice(0, 6));
}
function convTitle(conv, type, id) {
  if (conv === 'hall' || id === 'hall') return '大厅';
  if (type === 'group') {
    var g = S.groups.filter(function (x) { return x.id === id; })[0];
    return (g && g.name) || ('群聊 ' + id);
  }
  return userName(id);
}
function attSummary(a) {
  var t = (a && a.type) || '';
  if (t === 'image') return '[图片] ' + (a.name || '');
  if (t === 'file') return '[文件] ' + (a.name || '') + (a.size ? ' (' + fmtSize(a.size) + ')' : '');
  return a && a.name ? '[' + t + '] ' + a.name : '';
}
// 把一条消息拍平成导出用的明文，便于 TXT 阅读与搜索
function msgToPlain(m) {
  var body = [];
  if (m.revoked) body.push('[消息已撤回]');
  var t = String(m.text || '');
  if (t) body.push(t);
  var a = attSummary(m.att);
  if (a) body.push(a);
  if (!body.length) body.push('(空消息)');
  return body.join(' ');
}
// 会话 -> 导出包
function buildPack(scopeConv) {
  var convs = [];
  (S.convs || []).forEach(function (c) {
    if (scopeConv && c.conv !== scopeConv) return;
    // 云端合并到 S.msgs 的可见消息（导出不该丢掉导入历史桶里的）
    var local = (S.msgs[c.conv] || []).concat((S.localMsgs || {})[c.conv] || []);
    var remote = (S.recent || []).filter(function (m) { return m.conv === c.conv; });
    var seen = {}, all = [];
    local.concat(remote).forEach(function (m) {
      if (!m || m.id == null || seen[m.id]) return;
      seen[m.id] = 1;
      all.push(m);
    });
    all.sort(function (a, b) { return (Number(a.id) || 0) - (Number(b.id) || 0); });
    if (all.length > EXP_LIMIT) all = all.slice(all.length - EXP_LIMIT);   // 超限保留最新的
    var msgs = [];
    all.forEach(function (m) {
      msgs.push({
        id: m.id,
        time: m.created_at || null,
        from_id: m.sender_id || null,
        from: m.__from || userName(m.sender_id),
        text: String(m.text || ''),
        att: m.att || null,
        quote_id: m.quote_id || null,
        revoked: !!m.revoked,
        at: Array.isArray(m.at) ? m.at : [],
        plain: msgToPlain(m),
      });
    });
    if (!msgs.length) return;
    convs.push({
      conv: c.conv,
      type: c.type,
      title: c.name || convTitle(c.conv, c.type, c.id),
      msgCount: msgs.length,
      firstTime: msgs[0].time,
      lastTime: msgs[msgs.length - 1].time,
      msgs: msgs,
    });
  });
  return {
    format: 'lt_rec',
    version: 1,
    exportedAt: new Date().toISOString(),
    app: 'LanTalk',
    owner: { id: S.uid, nickname: (S.me && S.me.nickname) || '' },
    convs: convs,
  };
}
function packMsgCount(pack) {
  return (pack.convs || []).reduce(function (n, c) { return n + ((c.msgs && c.msgs.length) || 0); }, 0);
}
function lastTime(msgs) {
  var t = '';
  msgs.forEach(function (m) { if (m.time && m.time > t) t = m.time; });
  return t;
}
function dayKey(iso) {
  var d = new Date(iso);
  return isNaN(d.getTime()) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function dayLabel(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '未知时间';
  var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + w;
}
function stamp(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '--:--';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function packToTxt(pack) {
  var L = [];
  L.push('LanTalk 聊天记录');
  L.push('导出时间：' + new Date(pack.exportedAt).toLocaleString());
  L.push('导出账号：' + (pack.owner.nickname || pack.owner.id || '-'));
  L.push('会话数：' + pack.convs.length + '　消息数：' + packMsgCount(pack));
  L.push('');
  L.push('==================================================');
  (pack.convs || []).forEach(function (c) {
    L.push('');
    L.push('【' + c.title + '】　（' + c.msgCount + ' 条）');
    var dk = '';
    (c.msgs || []).forEach(function (m) {
      var k = m.time ? dayKey(m.time) : '';
      if (k && k !== dk) { dk = k; L.push(''); L.push('── ' + dayLabel(m.time) + ' ──'); }
      var when = m.time ? stamp(m.time) : '';
      if (m.revoked) { L.push('  ' + when + ' 「' + m.from + '」 ' + m.plain); return; }
      L.push('  ' + when + ' 「' + m.from + '」 ' + m.plain);
    });
    L.push('');
    L.push('--------------------------------------------------');
  });
  L.push('');
  L.push('（本文件由 LanTalk 导出，可用「设置 - 读取聊天记录」导入 JSON 版找回。）');
  return L.join('\n');
}
function downloadFile(name, content, mime) {
  try {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
    return true;
  } catch (e) {
    toast('导出失败：' + (e.message || e), 'err');
    return false;
  }
}
function expStamp() {
  var d = new Date();
  return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}
// 弹窗骨架
function openDlg(title, bodyHtml) {
  var mask = $('#mask');
  var m = $('#modal');
  m.className = 'modal dlg';
  m.innerHTML = '<h3>' + esc(title) + '</h3>' + bodyHtml;
  mask.classList.remove('hidden');
  return m;
}
// ---- 导出弹窗 ----
function openExportDlg() {
  closePops();
  var cur = S.cur ? cm()[S.cur] : null;
  var curName = cur ? convTitle(cur.conv, cur.type, cur.id) : '';
  var allCount = packMsgCount(buildPack(null));
  openDlg('导出聊天记录', ''
    + '<div style="font-size:12px;color:var(--tx2);line-height:1.6">导出为 JSON（可回读）+ TXT（直接阅读）两个文件。只导出你自己能看到的会话。</div>'
    + '<div class="drow">'
    + '<button class="dbtn" id="expCur"' + (cur ? '' : ' disabled style="opacity:.45;cursor:not-allowed"') + '>'
    + '<span class="di">💬</span><span class="dt">当前会话</span>'
    + '<span class="dd">' + (cur ? esc(curName) : '请先打开一个会话') + '</span></button>'
    + '<button class="dbtn" id="expAll">'
    + '<span class="di">🗂️</span><span class="dt">全部会话</span>'
    + '<span class="dd">共 ' + (S.convs || []).length + ' 个会话 / ' + allCount + ' 条消息</span></button>'
    + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn gh" id="expCancel">关闭</button></div>');
  $('#expCancel').onclick = closeModal;
  if (cur) $('#expCur').onclick = function () { doExport(cur.conv); };
  $('#expAll').onclick = function () { doExport(null); };
}
function doExport(scopeConv) {
  var pack = buildPack(scopeConv);
  if (!pack.convs.length) { toast('没有可导出的消息', 'err'); return; }
  var base = 'LanTalk-' + (scopeConv ? '会话' : '全部记录') + '-' + expStamp();
  var ok1 = downloadFile(base + '.json', JSON.stringify(pack, null, 2), 'application/json;charset=utf-8');
  var ok2 = downloadFile(base + '.txt', packToTxt(pack), 'text/plain;charset=utf-8');
  closeModal();
  if (ok1 || ok2) {
    toast('已导出 ' + pack.convs.length + ' 个会话 / ' + packMsgCount(pack) + ' 条消息');
  }
}
// ---- 读取聊天记录弹窗 ----
function isPack(o) {
  if (!o || typeof o !== 'object') return false;
  if (o.format === 'lt_rec') return true;
  return Array.isArray(o.convs) && o.convs.some(function (c) { return c && Array.isArray(c.msgs); });
}
function normPack(o) {
  var list = [];
  (o.convs || []).forEach(function (c) {
    if (!c || !c.conv || !Array.isArray(c.msgs)) return;
    var msgs = [];
    c.msgs.forEach(function (m) {
      if (m == null) return;
      if (typeof m === 'string') { msgs.push({ from: '', text: m, time: null, att: null, revoked: false }); return; }
      msgs.push({
        id: m.id != null ? m.id : null,
        from: m.from || m.sender || userName(m.from_id) || '',
        from_id: m.from_id || null,
        text: String(m.text || ''),
        time: m.time || m.created_at || null,
        att: m.att || null,
        revoked: !!m.revoked,
        quote_id: m.quote_id || null,
        at: Array.isArray(m.at) ? m.at : [],
      });
    });
    if (!msgs.length) return;
    list.push({
      conv: c.conv, type: c.type || (String(c.conv).indexOf('g:') === 0 ? 'group' : 'private'),
      title: c.title || c.conv, msgCount: msgs.length, msgs: msgs,
    });
  });
  return { owner: o.owner || {}, exportedAt: o.exportedAt || null, convs: list };
}
function openImportDlg() {
  closePops();
  openDlg('读取聊天记录', ''
    + '<div style="font-size:12px;color:var(--tx2);line-height:1.6">选择之前用「导出聊天记录」生成的 <b>.json</b> 文件，先预览再导入。'
    + '导入是<b>只读合并</b>：按消息 ID 去重，只在自己这边补上缺失的旧消息，<b>不会上传、不会改动云端数据</b>，也不影响别人。</div>'
    + '<div class="drow" style="margin-top:14px">'
    + '<button class="dbtn" id="impPick"><span class="di">📄</span><span class="dt">选择 .json 文件</span><span class="dd">从导出包还原</span></button>'
    + '<button class="dbtn" id="impPaste"><span class="di">📋</span><span class="dt">粘贴 JSON 内容</span><span class="dd">直接把内容贴进来</span></button>'
    + '</div>'
    + '<input type="file" id="impFile" accept=".json,application/json" style="display:none">'
    + '<div id="impArea"></div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn gh" id="impCancel">关闭</button></div>');
  $('#impCancel').onclick = closeModal;
  var file = $('#impFile');
  $('#impPick').onclick = function () { file.value = ''; file.click(); };
  file.onchange = function () {
    var f = file.files && file.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { parseAndPreview(String(rd.result), f.name); };
    rd.onerror = function () { $('#impArea').innerHTML = '<div class="sprev" style="color:var(--danger)">文件读取失败</div>'; };
    rd.readAsText(f, 'utf-8');
  };
  $('#impPaste').onclick = function () {
    $('#impArea').innerHTML = ''
      + '<textarea class="impbox" id="impText" placeholder="把导出的 JSON 内容粘贴到这里…"></textarea>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" id="impGo">解析预览</button></div>';
    $('#impGo').onclick = function () { parseAndPreview($('#impText').value, '粘贴内容'); };
  };
}
function parseAndPreview(text, srcName) {
  var area = $('#impArea');
  var o;
  try { o = JSON.parse(text); }
  catch (e) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">不是合法的 JSON 文件：' + esc(e.message || '解析失败') + '</div>'; return; }
  if (!isPack(o)) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">不认识的文件格式：不是 LanTalk 导出的聊天记录包。</div>'; return; }
  var pack = normPack(o);
  if (!pack.convs.length) { area.innerHTML = '<div class="sprev" style="color:var(--danger)">这个包里没有消息。</div>'; return; }
  var total = 0, rows = '';
  pack.convs.forEach(function (c) {
    total += c.msgCount;
    var local = (S.msgs[c.conv] || []).length;
    var newest = lastTime(c.msgs);
    var isCur = c.conv === S.cur;
    rows += '<div>' + esc(c.title) + '　<span style="color:var(--tx3)">' + c.msgCount + ' 条'
      + (newest ? '　至 ' + esc(String(newest).slice(0, 16).replace('T', ' ')) : '')
      + (isCur && local ? '　（当前会话已载入 ' + local + ' 条）' : '') + '</span></div>';
  });
  var oldest = '', newest = '';
  pack.convs.forEach(function (c) {
    c.msgs.forEach(function (m) {
      if (!m.time) return;
      if (!oldest || m.time < oldest) oldest = m.time;
      if (!newest || m.time > newest) newest = m.time;
    });
  });
  area.innerHTML = ''
    + '<div class="sprev">'
    + '<table>'
    + '<tr><td>来源</td><td>' + esc(srcName) + '</td></tr>'
    + '<tr><td>导出账号</td><td>' + esc(pack.owner.nickname || pack.owner.id || '未知') + (pack.exportedAt ? '　<span style="color:var(--tx3)">' + esc(String(pack.exportedAt).slice(0, 16).replace('T', ' ')) + '</span>' : '') + '</td></tr>'
    + '<tr><td>会话 / 消息</td><td><b>' + pack.convs.length + '</b> 个会话，<b>' + total + '</b> 条消息</td></tr>'
    + (oldest ? '<tr><td>时间范围</td><td>' + esc(String(oldest).slice(0, 16).replace('T', ' ')) + ' ~ ' + esc(String(newest).slice(0, 16).replace('T', ' ')) + '</td></tr>' : '')
    + '</table>'
    + '<div class="sc">' + rows + '</div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.6">导入后这些消息以只读方式补进本地记录，仅你本人可见、不上传云端；记录会保存在本机浏览器（约 1.5MB 上限），换设备或清缓存后需重新导入。</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
    + '<button class="btn gh" id="impCancel2">取消</button>'
    + '<button class="btn" id="impDo">确认导入</button></div>';
  $('#impCancel2').onclick = closeModal;
  $('#impDo').onclick = function () { doImport(pack); };
}
function doImport(pack) {
  var added = 0, dup = 0, convTouched = 0;
  pack.convs.forEach(function (c) {
    // ⚠️ 导入历史放进 S.localMsgs 这个独立桶，**不**直接塞进 S.msgs。
    //    塞进 S.msgs 会让首屏一次性渲染几千条历史 —— 正是用户报的「很多历史消息加载进最新的窗口」。
    //    现在它们按 id 区间分页合入，只有用户往上翻到那一屏时才出现。
    var bucket = (S.localMsgs[c.conv] = S.localMsgs[c.conv] || []);
    var seen = {};
    bucket.forEach(function (m) { seen[m.id] = 1; });
    (S.msgs[c.conv] || []).forEach(function (m) { seen[m.id] = 1; });   // 云端已有的不重复导入
    var add = [];
    c.msgs.forEach(function (m) {
      if (m.id == null) return;
      if (seen[m.id]) { dup++; return; }
      if (added + add.length >= IMP_MAX) return;
      seen[m.id] = 1;
      add.push({
        id: m.id,
        conv: c.conv,
        sender_id: m.from_id || null,
        text: m.text,
        att: m.att,
        quote_id: m.quote_id,
        revoked: m.revoked,
        at: m.at,
        created_at: m.time,
        __local: 1,
        __from: m.from || '历史记录',
      });
    });
    if (!add.length) return;
    convTouched++;
    var merged = mergeById(bucket, add);
    if (merged.length > 3000) merged = merged.slice(merged.length - 3000);   // 导入上限，保留最新的
    S.localMsgs[c.conv] = merged;
    S.impLoaded = S.impLoaded || {};
    S.impLoaded[c.conv] = 1;
    added += add.length;
  });
  // 把导入出来的会话也挂进会话列表（并记住，防止轮询重建列表后消失）
  S.localConvs = S.localConvs || {};
  pack.convs.forEach(function (c) {
    if (cm()[c.conv]) return;
    S.localConvs[c.conv] = { title: c.title, type: c.type, id: convPeer(c) };
    S.convs.push({
      conv: c.conv, type: c.type, id: convPeer(c),
      name: c.title, avatar: '', color: '#8a8f99',
      isFriend: false, muted: false, last: null, localOnly: true,
    });
  });
  storeImport(pack);
  closeModal();
  renderConvs();
  // 导入的是历史：当前会话需要重拉一次，才能把落在本屏 id 区间内的导入消息合进来
  if (S.cur && cm()[S.cur]) loadHistory(S.cur);
  else if (S.cur && S.msgs[S.cur]) renderMsgs('keep');
  toast('导入完成：新增 ' + added + ' 条，去重跳过 ' + dup + ' 条，覆盖 ' + convTouched + ' 个会话');
}
// ---------- 导入记录的本地持久化（仅存自己浏览器，不上传） ----------
var IMP_STORE_KEY = 'lt_imports_v1';
var IMP_STORE_MAX = 1500000;   // 本地最多缓存约 1.5MB 导入包
function storeImport(pack) {
  try {
    var box = [];
    try { box = JSON.parse(localStorage.getItem(IMP_STORE_KEY) || '[]'); } catch (e) { box = []; }
    if (!Array.isArray(box)) box = [];
    var text = JSON.stringify(pack);
    if (text.length > IMP_STORE_MAX / 2) { toast('记录包较大，仅本次会话内生效（未存本机）'); return; }
    // 同一个包（同一导出时间）不重复存
    box = box.filter(function (p) { return !p || p.exportedAt !== pack.exportedAt; });
    box.push(pack);
    while (box.length > 1 && JSON.stringify(box).length > IMP_STORE_MAX) box.shift();
    localStorage.setItem(IMP_STORE_KEY, JSON.stringify(box));
  } catch (e) { /* 存储满/隐私模式：忽略，仅本次会话生效 */ }
}
function applyStoredImports() {
  var box;
  try { box = JSON.parse(localStorage.getItem(IMP_STORE_KEY) || '[]'); } catch (e) { return; }
  if (!Array.isArray(box) || !box.length) return;
  S.localConvs = S.localConvs || {};
  var added = 0;
  box.forEach(function (pack) {
    if (!pack || !Array.isArray(pack.convs)) return;
    pack.convs.forEach(function (c) {
      if (!c || !c.conv || !Array.isArray(c.msgs)) return;
      if (!cm()[c.conv]) S.localConvs[c.conv] = { title: c.title, type: c.type, id: convPeer(c) };
      // ⚠️ 同上：启动恢复时只填 S.localMsgs，不污染 S.msgs（首屏只显示最新一页云端消息）
      var bucket = (S.localMsgs[c.conv] = S.localMsgs[c.conv] || []);
      var seen = {};
      bucket.forEach(function (m) { seen[m.id] = 1; });
      c.msgs.forEach(function (m) {
        if (m.id == null || seen[m.id]) return;
        seen[m.id] = 1;
        bucket.push({
          id: m.id, conv: c.conv, sender_id: m.from_id || null, text: m.text,
          att: m.att, quote_id: m.quote_id, revoked: m.revoked, at: m.at,
          created_at: m.time, __local: 1, __from: m.from || '历史记录',
        });
        added++;
      });
      bucket.sort(function (a, b) { return mid(a) - mid(b); });
      S.impLoaded = S.impLoaded || {};
      S.impLoaded[c.conv] = 1;
    });
  });
}
// 从导入的会话标记里反推对方/群的 id
function convPeer(c) {
  if (c.conv === 'hall') return 'hall';
  if (String(c.conv).indexOf('g:') === 0) return String(c.conv).slice(2);
  if (String(c.conv).indexOf('p:') === 0) {
    var parts = String(c.conv).slice(2).split('~');
    return parts.filter(function (u) { return u !== S.uid; })[0] || parts[0];
  }
  return c.conv;
}

// 手机端侧栏 ☰ / 遮罩
var sideBtn = $('#bSide');
if (sideBtn) sideBtn.onclick = function () {
  var sd = document.querySelector('.side');
  var open = sd && sd.classList.toggle('open');
  var m = $('#sideMask');
  if (m) m.classList.toggle('hidden', !open);
};
var sideMask = $('#sideMask');
if (sideMask) sideMask.onclick = closeSide;

// ---------- 初始化 ----------
try { S.theme = localStorage.getItem('lt_theme') || 'dark'; } catch (e) { S.theme = 'dark'; }
applyTheme();
renderJoinEmo();
setMode('pw');
CLOUD.auth.getSession().then(function (r) {
  var s = r.data;
  if (s && s.user) { S.uid = s.user.id; afterLogin(); }
  else showAuth();
}).catch(function () { showAuth(); });
})();
