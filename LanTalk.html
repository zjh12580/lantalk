  var rs = S.reads[S.cur] || {};
  var list = S.msgs[S.cur] || [];
  var mi = -1;
  for (var k = 0; k < list.length; k++) { if (list[k].id === msgId) { mi = k; break; } }
  if (mi < 0) return;
  var mem = (S.gcache[c.id] || []).filter(function (u) { return u.id !== S.me.id && u.id !== BOT_ID; });
  var read = [], unread = [];
  mem.forEach(function (u) {
    var id = rs[u.id];
    var done = false;
    if (id) { for (var j = 0; j < list.length; j++) { if (list[j].id === id) { done = j >= mi; break; } } }
    (done ? read : unread).push(u);
  });
  var row = function (x, ok) {
    return '<div class="row" style="padding:4px 0"><span style="display:flex;align-items:center;gap:8px;min-width:0">'
      + avOf(x.name, x.avatar, x.color, 's') + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.name) + '</span></span>'
      + '<span style="font-size:12px;color:' + (ok ? '#3ba55d' : 'var(--tx3)') + '">' + (ok ? '✅ 已读' : '⏳ 未读') + '</span></div>';
  };
  openModal('<h3>已读详情 · ' + read.length + '/' + mem.length + ' 人已读</h3>'
    + (mem.length ? (read.length ? '<h4>已读（' + read.length + '）</h4>' + read.map(function (x) { return row(x, true); }).join('') : '')
      + (unread.length ? '<h4>未读（' + unread.length + '）</h4>' + unread.map(function (x) { return row(x, false); }).join('') : '')
      : '<p style="color:var(--tx3)">群内暂无其他成员</p>')
    + '<div class="acts"><button class="btn" onclick="LT.close()">关闭</button></div>');
}
function fIcon(name) {
  var ext = String(name || '').split('.').pop().toLowerCase();
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'].indexOf(ext) >= 0) return '🖼';
  if (['zip', 'rar', '7z', 'tar', 'gz'].indexOf(ext) >= 0) return '🗜';
  if (ext === 'pdf') return '📕';
  if (['doc', 'docx'].indexOf(ext) >= 0) return '📘';
  if (['xls', 'xlsx', 'csv'].indexOf(ext) >= 0) return '📗';
  if (['mp4', 'avi', 'mov', 'mkv'].indexOf(ext) >= 0) return '🎬';
  if (['mp3', 'wav', 'flac'].indexOf(ext) >= 0) return '🎵';
  if (['sh', 'py', 'js', 'tcl', 'c', 'cpp', 'java', 'go'].indexOf(ext) >= 0) return '📜';
  return '📄';
}
function msgAct(act, id) {
  var m = (S.msgs[S.cur] || []).filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  if (act === 'reply') {
    S.reply = { id: m.id, fromName: m.fromName, text: m.text || m.fileName || '[文件]' };
    $('#rBar').classList.remove('hidden');
    $('#rText').textContent = '回复 ' + m.fromName + '：' + (m.text || m.fileName);
    $('#input').focus();
  } else if (act === 'copy') {
    navigator.clipboard.writeText(m.text || '').then(function () { toast('已复制'); }, function () { toast('复制失败', 'err'); });
  } else if (act === 'revoke') {
    send('revoke', { conv: S.cur, msgId: id });
  }
}
function renderTyping() {
  var t = S.typing[S.cur] || {};
  var cut = Date.now() - 3500;
  var list = Object.keys(t).filter(function (k) { return t[k].ts >= cut; })
    .map(function (k) { return t[k]; });
  var bar = $('#typBar');
  if (!list.length) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
  // 取第一个打字者的头像；多人时名字合并（≤2 全列，超过 2 人显示「A、B 等」）
  var first = list[0];
  var av = avOf(first.name, first.avatar, first.color, 's');
  var names = list.map(function (x) { return x.name; });
  var label = names.length <= 2 ? names.join('、') : (names.slice(0, 2).join('、') + ' 等');
  bar.innerHTML = '<span class="tav">' + av + '</span>'
    + '<div class="tbub"><span class="tdots"><i></i><i></i><i></i></span>'
    + '<span class="ttxt">' + esc(label) + ' 正在输入…</span></div>';
  bar.classList.remove('hidden');
}

// 待发送附件队列：粘贴/选择后只是预览，点「发送」才真正上传
function addAttach(file, type) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast('文件不能超过 25MB', 'err'); return; }
  var isImg = type === 'image' || /^image\//.test(file.type);
  var a = { file: file, name: file.name || '文件', size: file.size || 0, type: isImg ? 'image' : 'file', url: '' };
  try { if (isImg && window.URL && URL.createObjectURL) a.url = URL.createObjectURL(file); } catch (e) { a.url = ''; }
  S.attach.push(a);
  renderAttach();
  try { input.focus(); } catch (e) {}
  toast('已加入待发送，可以再输入文字，点「发送」一起发出');
}
function renderAttach() {
  var box = $('#attBar');
  if (!box) return;
  box.classList.toggle('hidden', !S.attach.length);
  box.innerHTML = S.attach.map(function (a, i) {
    var prev = a.type === 'image'
      ? (a.url ? '<img src="' + esc(a.url) + '" alt="">' : '<span class="afi">🖼</span>')
      : '<span class="afi">📄</span>';
    return '<div class="attchip">' + prev
      + '<span class="an">' + esc(a.name) + '</span>'
      + '<span class="as">' + fmtSize(a.size) + '</span>'
      + '<button class="adel" data-i="' + i + '" title="移除">✕</button></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.adel'), function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, a = S.attach[i];
      if (a && a.url) { try { URL.revokeObjectURL(a.url); } catch (e) {} }
      S.attach.splice(i, 1);
      renderAttach();
    };
  });
}
function clearAttach() {
  S.attach.forEach(function (a) { if (a.url) { try { URL.revokeObjectURL(a.url); } catch (e) {} } });
  S.attach = [];
  renderAttach();
}
// 发送
function doSend() {
  var el = $('#input');
  if (!S.cur) return;
  var text = el.value.replace(/\s+$/, '');
  var atts = S.attach.slice();
  if (!text.trim() && !atts.length) return;
  var mentions = detectMentions(text);
  var replyTo = S.reply ? { id: S.reply.id, fromName: S.reply.fromName, text: S.reply.text, fileId: S.reply.fileId || '', fileType: S.reply.fileType || '', fileName: S.reply.fileName || '' } : null;
  el.value = ''; autoH();
  clearAttach();
  S.reply = null; $('#rBar').classList.add('hidden');
  send('typing', { conv: S.cur, on: false });
  if (!atts.length) {
    send('chat', { conv: S.cur, type: 'text', text: text, mentions: mentions, replyTo: replyTo });
    return;
  }
  atts.forEach(function (a, i) {
    api('/api/upload?name=' + encodeURIComponent(a.name) + '&mime=' + encodeURIComponent(a.file.type || 'application/octet-stream'), { method: 'POST', body: a.file })
      .then(function (r) {
        send('chat', {
          conv: S.cur, type: a.type, fileId: r.file.id, fileName: r.file.name, fileSize: r.file.size, mime: r.file.mime,
          text: i === 0 ? text : '', mentions: i === 0 ? mentions : [], replyTo: i === 0 ? replyTo : null,
        });
      }).catch(function (e) { toast(e.message, 'err'); });
  });
}
function detectMentions(text) {
  var out = [];
  var c = cmap()[S.cur];
  if (c && c.type === 'group' && S.gcache[c.id]) {
    S.gcache[c.id].forEach(function (m) {
      if (text.indexOf('@' + m.name) >= 0 && out.indexOf(m.id) < 0) out.push(m.id);
    });
    if (text.indexOf('@全体成员') >= 0 || text.indexOf('@all') >= 0) {
      S.gcache[c.id].forEach(function (m) { if (m.id !== S.me.id && out.indexOf(m.id) < 0) out.push(m.id); });
    }
  }
  return out;
}
function upload(file, type) { addAttach(file, type || (/^image\//.test(file.type || '') ? 'image' : 'file')); }
var input = $('#input');
var composing = false;
input.addEventListener('compositionstart', function () { composing = true; });
input.addEventListener('compositionend', function () { composing = false; });
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !composing) { e.preventDefault(); doSend(); return; }
  send('typing', { conv: S.cur, on: true });
  clearTimeout(input._t);
  input._t = setTimeout(function () { send('typing', { conv: S.cur, on: false }); }, 2500);
});
function autoH() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autoH);

// Ctrl+V 粘贴：剪贴板里有图片/文件就直接上传发送
function pasteName(mime) {
  var ext = String(mime || 'image/png').split('/')[1] || 'png';
  if (ext === 'jpeg') ext = 'jpg';
  var d = new Date();
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  return 'paste-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.' + ext;
}
document.addEventListener('paste', function (e) {
  var t = e.target;
  var tag = t && t.tagName;
  if ((tag === 'TEXTAREA' || tag === 'INPUT') && t.id !== 'input') return;
  if (!S.cur) return;
  var cd = e.clipboardData || window.clipboardData;
  if (!cd || !cd.items) return;
  var file = null;
  for (var i = 0; i < cd.items.length; i++) {
    var it = cd.items[i];
    if (it.kind !== 'file') continue;
    var f = it.getAsFile && it.getAsFile();
    if (!f) continue;
    if (!file || /^image\//.test(f.type)) file = f;
  }
  if (!file) return;
  e.preventDefault();
  var named = file;
  try { named = new File([file], pasteName(file.type), { type: file.type }); } catch (err) { named = file; }
  upload(named, /^image\//.test(file.type) ? 'image' : 'file');
});

function showNew() {
  openModal('<h3>发起会话</h3>'
    + '<label>搜索昵称，添加好友或拉进群聊</label>'
    + '<input class="inp" id="nq" placeholder="输入昵称关键字">'
    + '<div class="rlist" id="nr"></div>'
    + '<div class="chips" id="ns"></div>'
    + '<label>大厅成员（点击即可拉进群聊）</label>'
    + '<div class="hallpick" id="nhp"><div style="font-size:12px;color:var(--tx3)">加载中…</div></div>'
    + '<label>群聊名称（选 2 人及以上可建群）</label>'
    + '<input class="inp" id="ng" placeholder="例如：项目周会">'
    + '<div class="acts"><button class="btn" onclick="LT.close()">关闭</button><button class="btn primary" id="ncreate">创建群聊</button></div>');
  var sel = {};
  var n = 0;
  var hall = [];
  function render() {
    $('#ns').innerHTML = Object.keys(sel).map(function (k) { return '<div class="chip on" data-k="' + k + '">' + esc(sel[k].name) + ' ✕</div>'; }).join('');
    Array.prototype.forEach.call($('#ns').querySelectorAll('.chip'), function (c) {
      c.onclick = function () { delete sel[c.dataset.k]; render(); };
    });
    renderHall();
  }
  function renderHall() {
    var box = $('#nhp');
    if (!box) return;
    box.innerHTML = hall.length ? hall.map(function (u) {
      return '<div class="chip ' + (sel[u.id] ? 'on' : '') + '" data-h="' + u.id + '" title="点击' + (sel[u.id] ? '移出' : '加入') + '群聊">'
        + avOf(u.name, u.avatar, u.color, 's') + esc(u.name) + (sel[u.id] ? ' ✕' : '') + '</div>';
    }).join('') : '<div style="font-size:12px;color:var(--tx3)">大厅里还没有其他人</div>';
    Array.prototype.forEach.call(box.querySelectorAll('.chip[data-h]'), function (c) {
      c.onclick = function () {
        var uid = c.dataset.h;
        if (sel[uid]) delete sel[uid];
        else {
          var u = hall.filter(function (x) { return x.id === uid; })[0];
          sel[uid] = { id: uid, name: u ? u.name : uid };
        }
        render();
      };
    });
  }
  api('/api/group/members?id=hall').then(function (r) {
    hall = (r.members || []).filter(function (u) { return u.id !== S.me.id; });
    renderHall();
  }).catch(function () {
    var box = $('#nhp');
    if (box) box.innerHTML = '<div style="font-size:12px;color:var(--tx3)">大厅成员加载失败</div>';
  });
  var timer;
  $('#nq').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = $('#nq').value.trim();
      if (!q) { $('#nr').innerHTML = ''; return; }
      api('/api/search?q=' + encodeURIComponent(q)).then(function (r) {
        $('#nr').innerHTML = r.users.length ? r.users.map(function (u) {
          return '<div class="ritem" data-i="' + u.id + '" data-n="' + esc(u.name) + '">'
            + avOf(u.name, u.avatar, u.color, 's')
            + '<div class="rib"><div class="rin">' + esc(u.name) + '</div><div class="ris">' + (u.remark ? '备注：' + esc(u.remark) : (u.online ? '在线' : '离线')) + '</div></div>'
            + '<button class="btn ' + (sel[u.id] ? '' : 'primary') + '" style="padding:4px 12px;font-size:12px">' + (sel[u.id] ? '移除' : '选择') + '</button></div>';
        }).join('') : '<div style="padding:12px;color:var(--tx3);font-size:13px">未找到用户</div>';
        Array.prototype.forEach.call($('#nr').querySelectorAll('.ritem'), function (it) {
          it.onclick = function () {
            if (sel[it.dataset.i]) { delete sel[it.dataset.i]; render(); return; }
            sel[it.dataset.i] = { id: it.dataset.i, name: it.dataset.n };
            render();
          };
        });
      });
    }, 250);
  });
  $('#ncreate').onclick = function () {
    var ids = Object.keys(sel);
    if (ids.length < 2) { toast('请至少选择 2 位成员', 'err'); return; }
    var name = $('#ng').value.trim() || (S.me.name + '、' + ids.slice(0, 2).map(function (k) { return sel[k].name; }).join('、') + ' 等');

      window.LT.close();
      refresh().then(function () { openConv('g:' + r.group.id); });
    }).catch(function (e) { toast(e.message, 'err'); });
  };
}

  });
}

// 右侧资料栏
function renderInfo() {
  var c = cmap()[S.cur];
  if (!c) return;
  var bar = $('#info');
  if (c.type === 'group') {
    api('/api/group/members?id=' + c.id).then(function (r) {
      S.gcache[c.id] = r.members;
      var isOwner = c.owner === S.me.id;
      var isHall = c.id === 'hall';
      bar.innerHTML = '<div style="text-align:center;margin-bottom:16px">' + avOf(c.name, '', c.color, 'l')
        + '<div style="margin-top:8px;font-weight:600">' + esc(c.name) + '</div>'
        + '<div style="font-size:12px;color:var(--tx3)">' + c.memberCount + ' 位成员</div></div>'
        + '<div style="margin-bottom:16px"><h4>群成员</h4><div class="mgrid">'
        + r.members.map(function (m) {
          return '<div class="mem" data-u="' + m.id + '">' + avOf(m.name, m.avatar, m.color, 's')
            + '<span>' + esc(m.name) + (m.id === c.owner ? ' 👑' : '') + '</span></div>';
        }).join('')
        + (isOwner && !isHall ? '<div class="mem" id="invBtn"><div class="av s" style="background:var(--bg3);color:var(--tx2)">＋</div><span>邀请</span></div>' : '')
        + '</div></div>'
        + '<div style="margin-bottom:16px"><h4>设置</h4>'
        + '<div class="row"><span>消息免打扰</span><button class="btn ghost" id="muteBtn" style="padding:4px 12px;font-size:12px">' + (c.muted ? '已开启' : '已关闭') + '</button></div>'
        + (isOwner && !isHall ? '<div class="row"><span>群名称</span><button class="btn ghost" id="rnBtn" style="padding:4px 12px;font-size:12px">修改</button></div>' : '')
        + (isOwner ? '<div class="row"><span>群公告</span><button class="btn ghost" id="anBtn" style="padding:4px 12px;font-size:12px">编辑</button></div>' : '')
        + '</div>'
        + (isHall ? '' : '<button class="btn ' + (isOwner ? 'danger' : 'ghost') + ' block" id="lvBtn">' + (isOwner ? '解散群聊' : '退出群聊') + '</button>');
      Array.prototype.forEach.call(bar.querySelectorAll('.mem[data-u]'), function (m) {
        m.onclick = function () { openPrivate(m.dataset.u); };
      });
      if ($('#invBtn')) $('#invBtn').onclick = function () { showInvite(c); };
      $('#muteBtn').onclick = function () {
        api('/api/group/update', { method: 'POST', body: { groupId: c.id, muted: !c.muted } }).then(function () {
          refresh(); toast(c.muted ? '已关闭免打扰' : '已开启免打扰');
        });
      };
      if ($('#rnBtn')) $('#rnBtn').onclick = function () {
        promptBox('修改群名称', c.name, false, function (v) {
          api('/api/group/update', { method: 'POST', body: { groupId: c.id, name: v } }).then(function () { refresh(); toast('已修改'); });
        });
      };
      if ($('#anBtn')) $('#anBtn').onclick = function () {
        promptBox('编辑群公告', c.announcement || '', true, function (v) {
          api('/api/group/update', { method: 'POST', body: { groupId: c.id, announcement: v } }).then(function () { refresh(); toast('已更新'); });
        });
      };
      if ($('#lvBtn')) $('#lvBtn').onclick = function () {
        confirmBox(isOwner ? '确定解散该群聊？所有消息将被删除。' : '确定退出该群聊？', function () {
          api(isOwner ? '/api/group/dismiss' : '/api/group/leave', { method: 'POST', body: { groupId: c.id } }).then(function () {
            window.LT.close(); closeConv(); refresh();
          }).catch(function (e) { toast(e.message, 'err'); });
        });
      };
    });
  } else {
    bar.innerHTML = '<div style="text-align:center;margin-bottom:16px">' + avOf(c.name, c.avatar, c.color, 'l')
      + '<div style="margin-top:8px;font-weight:600">' + esc(c.name) + '</div>'
      + '<div style="font-size:12px;color:var(--tx3)">' + (S.online[c.id] ? '🟢 在线' : '⚪ 离线') + '</div></div>'
      + '<div style="margin-bottom:16px"><h4>设置</h4>'
      + '<div class="row"><span>备注名</span><button class="btn ghost" id="rmBtn" style="padding:4px 12px;font-size:12px">修改</button></div>'
      + (c.isFriend ? '<div class="row"><span>好友关系</span><button class="btn ghost" id="dfBtn" style="padding:4px 12px;font-size:12px;color:var(--danger)">删除好友</button></div>'
        : '<div class="row"><span>非好友</span><button class="btn primary" id="afBtn" style="padding:4px 12px;font-size:12px">加为好友</button></div>')
      + '</div><button class="btn block" id="clBtn">关闭会话</button>';
    $('#rmBtn').onclick = function () {
      promptBox('设置备注名', c.name, false, function (v) {
        api('/api/remark', { method: 'POST', body: { peerId: c.id, remark: v } }).then(function () { refresh(); toast('已保存'); });
      });
    };
    if ($('#dfBtn')) $('#dfBtn').onclick = function () {
      confirmBox('确定删除该好友？', function () {
        api('/api/friend?peer=' + c.id, { method: 'DELETE' }).then(function () { window.LT.close(); closeConv(); refresh(); });
      });
    };
    if ($('#afBtn')) $('#afBtn').onclick = function () {
      api('/api/friend/request', { method: 'POST', body: { to: c.id, message: '你好，加个好友' } }).then(function () { toast('好友请求已发送'); });
    };
    $('#clBtn').onclick = closeConv;
  }
}
function openPrivate(uid) {
  api('/api/conv/open', { method: 'POST', body: { peerId: uid } }).then(function (r) {
    refresh().then(function () { openConv(r.conv); });
  }).catch(function (e) { toast(e.message, 'err'); });
}
function showInvite(c) {
  openModal('<h3>邀请成员</h3><input class="inp" id="iq" placeholder="搜索昵称"><div class="rlist" id="ir"></div>'
    + '<div class="acts"><button class="btn" onclick="LT.close()">关闭</button></div>');
  var timer;
  $('#iq').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = $('#iq').value.trim();
      if (!q) return;
      api('/api/search?q=' + encodeURIComponent(q)).then(function (r) {
        var inG = {};
        c.members.forEach(function (m) { inG[m] = 1; });
        $('#ir').innerHTML = r.users.map(function (u) {
          return '<div class="ritem" data-i="' + u.id + '">' + avOf(u.name, u.avatar, u.color, 's')
            + '<div class="rib"><div class="rin">' + esc(u.name) + '</div></div>'
            + '<button class="btn ' + (inG[u.id] ? '' : 'primary') + '" style="padding:4px 12px;font-size:12px" ' + (inG[u.id] ? 'disabled' : '') + '>'
            + (inG[u.id] ? '已在群内' : '邀请') + '</button></div>';
        }).join('');
        Array.prototype.forEach.call($('#ir').querySelectorAll('.ritem'), function (it) {
          it.onclick = function () {
            api('/api/group/invite', { method: 'POST', body: { groupId: c.id, members: [it.dataset.i] } }).then(function () {
              toast('已邀请'); refresh(); if (S.info) renderInfo();
            });
          };
        });
      });
    }, 250);
  });
}
function promptBox(title, val, ta, onOk) {
  openModal('<h3>' + esc(title) + '</h3>'
    + (ta ? '<textarea class="inp" id="pb" rows="4" style="resize:vertical">' + esc(val) + '</textarea>' : '<input class="inp" id="pb" value="' + esc(val) + '">')
    + '<div class="acts"><button class="btn" onclick="LT.close()">取消</button><button class="btn primary" id="pbOk">确定</button></div>');
  $('#pbOk').onclick = function () { onOk($('#pb').value.trim()); window.LT.close(); };
}
function confirmBox(text, onOk) {
  openModal('<h3>确认操作</h3><p style="color:var(--tx2);line-height:1.7">' + esc(text) + '</p>'
    + '<div class="acts"><button class="btn" onclick="LT.close()">取消</button><button class="btn danger" id="cfOk">确定</button></div>');
  $('#cfOk').onclick = onOk;
}

// 初始化
applyTheme();
renderJoin();
updatePrev();
if (FILE_MODE) {
  $('#jTip').innerHTML = '当前以本地文件方式打开。若无法连接，请先在本文件所在目录执行 <b>node LanTalk.html</b> 启动服务，再刷新本页。';
} else {
  $('#jTip').innerHTML = '同一台电脑（IP）只对应一个身份：下次打开会直接进入；想换昵称，进来后点头像改即可。';
}
// 先问服务端：这台机器是不是已经有身份了？有就直接进，没有才显示昵称页
api('/api/enter').then(function (r) {
  if (r && r.user) {
    S.ip = r.ip || '';
    enter(r.token, r.user, r.conversations);
    toast('欢迎回来，' + r.user.name);
  } else {
    $('#join').classList.remove('hidden');
  }
}).catch(function () {
  $('#join').classList.remove('hidden');
});
})();
</script>
