'use strict';
/*
 ============================================================================
  LanTalk 单文件版 —— 服务端部分（浏览器会忽略这段，Node 执行这段）
  运行方式：  node LanTalk.html        （默认 3000 端口）
              PORT=8080 node LanTalk.html
  数据目录：  同目录下 data/（可设 LANCHAT_DATA 环境变量修改）
  身份绑定：  默认「一个内网 IP = 一个用户」（同一台机器换昵称=改名，老用户回来直接进）
              LANCHAT_BIND_IP=0      关闭 IP 绑定，退回每个浏览器独立昵称
              LANCHAT_TRUST_PROXY=1  部署在 nginx 等反向代理后时开启，用 X-Forwarded-For 识别真实 IP
 ============================================================================
*/
const http = require('http');
const fs = require('fs');
const path = require('path');
const crypto = require('crypto');
const os = require('os');

const PORT = Number(process.env.PORT || 3000);
const HOST = process.env.HOST || '0.0.0.0';
const DATA_DIR = process.env.LANCHAT_DATA || path.join(__dirname, 'data');
const DB_FILE = path.join(DATA_DIR, 'db.json');
const FILES_DIR = path.join(DATA_DIR, 'files');
const SRC = fs.readFileSync(__filename, 'utf8');
const BIND_IP = process.env.LANCHAT_BIND_IP !== '0';
const TRUST_PROXY = process.env.LANCHAT_TRUST_PROXY === '1';

// 存储
const empty = () => ({ users: [], friends: [], groups: [], messages: {}, reads: {}, files: {}, seq: 0 });
let db = empty();
let saveTimer = null;

function load() {
  if (!fs.existsSync(DATA_DIR)) fs.mkdirSync(DATA_DIR, { recursive: true });
  if (!fs.existsSync(FILES_DIR)) fs.mkdirSync(FILES_DIR, { recursive: true });
  if (fs.existsSync(DB_FILE)) {
    try { db = Object.assign(empty(), JSON.parse(fs.readFileSync(DB_FILE, 'utf8'))); }
    catch (e) {
      const bak = DB_FILE + '.broken.' + Date.now();
      try { fs.copyFileSync(DB_FILE, bak); } catch (x) {}
      console.error('[LanTalk] 数据文件损坏，已备份至 ' + bak + '，以空库启动');
      db = empty();
    }
  }
  if (!db.groups.some((g) => g.id === 'hall')) {
    db.groups.unshift({ id: 'hall', name: '🏠 大厅', owner: 'system', members: [], announcement: '欢迎来到局域网聊天室，这里是全员公共频道', color: '#07c160', mute: {}, createdAt: Date.now(), hall: true });
  }
  // IP -> 用户映射（老数据没有该字段时按 user.ip 重建）
  db.ips = db.ips || {};
  db.users.forEach((u) => { if (u.ip && !db.ips[u.ip]) db.ips[u.ip] = u.id; });
  return db;
}
function saveNow() {
  if (!fs.existsSync(DATA_DIR)) fs.mkdirSync(DATA_DIR, { recursive: true });
  const tmp = DB_FILE + '.tmp';
  fs.writeFileSync(tmp, JSON.stringify(db));
  fs.renameSync(tmp, DB_FILE);
}
function save() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; try { saveNow(); } catch (e) { console.error(e); } }, 300);
}
const uid = (p) => p + '_' + crypto.randomBytes(8).toString('hex');
const now = () => Date.now();
const PALETTE = ['#e8644a', '#f0a03c', '#3ba55d', '#3d8bfd', '#8b5cf6', '#e0518f', '#0aa4a4', '#c0842f', '#5b8def', '#d4756b'];

const convKey = {
  private: (a, b) => 'p:' + [a, b].sort().join('~'),
  group: (gid) => 'g:' + gid,
  parse(k) {
    if (k.indexOf('g:') === 0) return { type: 'group', id: k.slice(2) };
    return { type: 'private', users: k.slice(2).split('~') };
  },
};

// 在线状态
const sockets = new Map();
const presence = {
  add(id, c) { if (!sockets.has(id)) sockets.set(id, new Set()); sockets.get(id).add(c); },
  remove(id, c) { const s = sockets.get(id); if (!s) return; s.delete(c); if (!s.size) sockets.delete(id); },
  isOnline: (id) => (id === 'bot_xiaomei') || (sockets.has(id) && sockets.get(id).size > 0),
  list: (id) => Array.from(sockets.get(id) || []),
  ids: () => Array.from(sockets.keys()),
  count: () => sockets.size,
};

// 业务数据
const getUser = (id) => db.users.find((u) => u.id === id) || null;
const getUserByName = (n) => db.users.find((u) => u.name.toLowerCase() === String(n).toLowerCase()) || null;
const getGroup = (id) => db.groups.find((g) => g.id === id) || null;

// IP 识别与绑定：一个 IP 固定对应一个用户
function normIp(ip) {
  let s = String(ip || '').trim();
  if (s.indexOf('::ffff:') === 0) s = s.slice(7);
  if (s === '::1') s = '127.0.0.1';
  return s || '';
}
function ipOf(req) {
  if (!BIND_IP) return '';
  let ip = '';
  if (TRUST_PROXY) ip = String(req.headers['x-forwarded-for'] || '').split(',')[0].trim();
  if (!ip) ip = req.socket && req.socket.remoteAddress;
  return normIp(ip) || 'unknown';
}
const getUserByIp = (ip) => { const id = ip && db.ips[ip]; return id ? getUser(id) : null; };
function tryBindIp(u, ip) {
  if (!ip || ip === 'unknown') return;
  const cur = db.ips[ip];
  if (cur && cur !== u.id) return; // 该 IP 已属于别人，不抢
  Object.keys(db.ips).forEach((k) => { if (db.ips[k] === u.id && k !== ip) delete db.ips[k]; });
  db.ips[ip] = u.id;
  u.ip = ip;
  save();
}

function pub(u, viewerId) {
  if (!u) return null;
  const f = db.friends.find((x) => x.status === 'accepted' && ((x.a === viewerId && x.b === u.id) || (x.b === viewerId && x.a === u.id)));
  return {
    id: u.id, name: u.name, avatar: u.avatar || '', color: u.color,
    signature: u.signature || '', lastSeen: u.lastSeen,
    online: presence.isOnline(u.id),
    remark: (f && f.remark && f.remark[viewerId]) || '',
  };
}
function createUser(name, avatar) {
  const u = {
    id: uid('u'), name, avatar: avatar || '',
    color: PALETTE[db.users.length % PALETTE.length],
    signature: '', createdAt: now(), lastSeen: now(),
  };
  db.users.push(u);
  const hall = getGroup('hall');
  if (hall && hall.members.indexOf(u.id) < 0) {
    hall.members.push(u.id);
    addMessage({ conv: 'g:hall', from: 'system', type: 'system', text: `${name} 加入了大厅` });
  }
  save();
  return u;
}
// 改名：同一身份换昵称时调用，历史消息里的显示名同步更新
function renameUser(u, name, avatar) {
  if (avatar !== undefined) u.avatar = String(avatar).slice(0, 8);
  if (u.name === name) { save(); return false; }
  const old = u.name;
  u.name = name;
  Object.keys(db.messages).forEach((c) => {
    db.messages[c].forEach((m) => {
      if (m.from !== u.id) return;
      m.fromName = u.name;
      m.fromAvatar = u.avatar || '';
    });
  });
  save();
  return old;
}
function announceRename(u, oldName) {
  if (!oldName) return;
  addMessage({ conv: 'g:hall', from: 'system', type: 'system', text: `「${oldName}」更名为「${u.name}」` });
  push('g:hall', { t: 'msg', d: toWire(lastMessage('g:hall')) });
}
const getFriendship = (a, b) => db.friends.find((f) => (f.a === a && f.b === b) || (f.a === b && f.b === a)) || null;
const isFriend = (a, b) => { const f = getFriendship(a, b); return !!f && f.status === 'accepted'; };
const friendIds = (id) => db.friends.filter((f) => f.status === 'accepted' && (f.a === id || f.b === id)).map((f) => (f.a === id ? f.b : f.a));

function addMessage(m) {
  const list = db.messages[m.conv] || (db.messages[m.conv] = []);
  m.id = m.id || uid('m');
  m.seq = ++db.seq;
  m.createdAt = m.createdAt || now();
  list.push(m);
  if (list.length > 5000) db.messages[m.conv] = list.slice(list.length - 5000);
  save();
  return m;
}
const lastMessage = (conv) => { const l = db.messages[conv]; return l && l.length ? l[l.length - 1] : null; };
function unreadCount(conv, userId) {
  const list = db.messages[conv] || [];
  if (!list.length) return 0;
  const lastRead = (db.reads[conv] || {})[userId];
  if (!lastRead) return list.filter((m) => m.from !== userId && !m.revoked).length;
  const idx = list.findIndex((m) => m.id === lastRead);
  return list.slice(idx >= 0 ? idx + 1 : 0).filter((m) => m.from !== userId && !m.revoked).length;
}
function markRead(conv, userId, msgId) {
  db.reads[conv] = db.reads[conv] || {};
  const prev = db.reads[conv][userId];
  const id = msgId || (lastMessage(conv) || {}).id || '';
  if (!id) return '';
  if (!prev || id > prev) { db.reads[conv][userId] = id; save(); }
  return db.reads[conv][userId];
}
const lastReadOf = (conv, userId) => (db.reads[conv] || {})[userId] || '';

function convMembers(conv) {
  const p = convKey.parse(conv);
  return p.type === 'group' ? (getGroup(p.id) || { members: [] }).members : p.users;
}
function canAccess(userId, conv) {
  if (!conv) return false;
  const p = convKey.parse(conv);
  if (p.type === 'group') return (getGroup(p.id) || { members: [] }).members.indexOf(userId) >= 0;
  return p.users.indexOf(userId) >= 0;
}
function convSummary(userId) {
  const list = [];
  for (const g of db.groups) {
    if (g.members.indexOf(userId) < 0) continue;
    const conv = convKey.group(g.id);
    list.push({
      conv, type: 'group', id: g.id, name: g.name, color: g.color, avatar: '',
      memberCount: g.members.length, members: g.members.slice(), owner: g.owner,
      announcement: g.announcement || '', muted: !!(g.mute || {})[userId],
      last: lastMessage(conv), unread: unreadCount(conv, userId), createdAt: g.createdAt,
      reads: db.reads[conv] || {},
    });
  }
  const peers = new Set(friendIds(userId));
  Object.keys(db.messages).forEach((c) => {
    if (c.indexOf('p:') !== 0) return;
    const p = convKey.parse(c);
    if (p.users.indexOf(userId) < 0) return;
    peers.add(p.users[0] === userId ? p.users[1] : p.users[0]);
  });
  peers.forEach((pid) => {
    const peer = getUser(pid);
    if (!peer || pid === userId) return;
    const conv = convKey.private(userId, pid);
    const pv = pub(peer, userId);
    list.push({
      conv, type: 'private', id: pid, name: pv.remark || peer.name, username: peer.name,
      avatar: peer.avatar || '', color: peer.color, online: presence.isOnline(pid),
      lastSeen: peer.lastSeen, isFriend: isFriend(userId, pid), muted: false,
      last: lastMessage(conv), unread: unreadCount(conv, userId), createdAt: peer.createdAt,
      reads: db.reads[conv] || {},
    });
  });
  list.sort((a, b) => (b.last ? b.last.createdAt : b.createdAt || 0) - (a.last ? a.last.createdAt : a.createdAt || 0));
  return list;
}
// WebSocket 协议
function attachWS(server, onConn) {
  const GUID = '258EAFA5-E914-47DA-95CA-C5AB0DC85B11';
  server.on('upgrade', (req, socket, head) => {
    if ((req.headers.upgrade || '').toLowerCase() !== 'websocket') { socket.destroy(); return; }
    const key = req.headers['sec-websocket-key'];
    if (!key) { socket.destroy(); return; }
    const accept = crypto.createHash('sha1').update(key + GUID).digest('base64');
    socket.write('HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: ' + accept + '\r\n\r\n');
    const conn = { socket, buffer: Buffer.alloc(0), frags: [], fragOp: 0, closed: false, onmessage: null, onclose: null, user: null };
    conn.send = (data) => {
      const payload = Buffer.isBuffer(data) ? data : Buffer.from(String(data), 'utf8');
      const len = payload.length;
      let header;
      if (len < 126) { header = Buffer.alloc(2); header[1] = len; }
      else if (len < 65536) { header = Buffer.alloc(4); header[1] = 126; header.writeUInt16BE(len, 2); }
      else { header = Buffer.alloc(10); header[1] = 127; header.writeBigUInt64BE(BigInt(len), 2); }
      header[0] = 0x80 | 0x1;
      try { conn.socket.write(Buffer.concat([header, payload])); } catch (e) { conn.close(); }
    };
    conn.sendJSON = (o) => conn.send(JSON.stringify(o));
    conn.close = () => {
      if (conn.closed) return;
      conn.closed = true;
      try { conn.socket.write(Buffer.from([0x88, 0x00])); conn.socket.destroy(); } catch (e) {}
      if (conn.onclose) conn.onclose();
    };
    const onData = (chunk) => {
      conn.buffer = conn.buffer.length ? Buffer.concat([conn.buffer, chunk]) : chunk;
      for (;;) {
        const buf = conn.buffer;
        if (buf.length < 2) break;
        const b0 = buf[0], b1 = buf[1];
        const fin = (b0 & 0x80) !== 0, opcode = b0 & 0x0f, masked = (b1 & 0x80) !== 0;
        let len = b1 & 0x7f, off = 2;
        if (len === 126) { if (buf.length < 4) break; len = buf.readUInt16BE(2); off = 4; }
        else if (len === 127) { if (buf.length < 10) break; len = Number(buf.readBigUInt64BE(2)); off = 10; }
        if (len > 32 * 1024 * 1024) { conn.close(); break; }
        let mask = null;
        if (masked) { if (buf.length < off + 4) break; mask = buf.slice(off, off + 4); off += 4; }
        if (buf.length < off + len) break;
        const payload = Buffer.from(buf.slice(off, off + len));
        if (mask) for (let i = 0; i < payload.length; i += 1) payload[i] ^= mask[i & 3];
        conn.buffer = buf.slice(off + len);
        if (opcode === 0x0) { conn.frags.push(payload); if (fin) deliver(conn, conn.fragOp, Buffer.concat(conn.frags)); }
        else if (opcode === 0x1 || opcode === 0x2) {
          if (fin) deliver(conn, opcode, payload);
          else { conn.fragOp = opcode; conn.frags = [payload]; }
        } else if (opcode === 0x8) { conn.close(); break; }
        else if (opcode === 0x9) { ping(conn, payload); }
        else if (opcode === 0xA) { /* pong */ }
        else { conn.close(); break; }
      }
    };
    socket.on('data', onData);
    socket.on('close', () => { conn.closed = true; if (conn.onclose) conn.onclose(); });
    socket.on('error', () => { conn.closed = true; if (conn.onclose) conn.onclose(); });
    if (head && head.length) onData(head);
    onConn(conn);
  });
}
function deliver(conn, opcode, payload) {
  conn.frags = [];
  if (conn.onmessage) conn.onmessage(payload.toString('utf8'));
}
function ping(conn, payload) {
  const len = payload.length;
  let header;
  if (len < 126) { header = Buffer.alloc(2); header[1] = len; }
  else { header = Buffer.alloc(4); header[1] = 126; header.writeUInt16BE(len, 2); }
  header[0] = 0x80 | 0xA;
  try { conn.socket.write(Buffer.concat([header, payload])); } catch (e) {}
}

// 推送
function push(conv, evt, exclude) {
  convMembers(conv).forEach((uid) => {
    presence.list(uid).forEach((c) => { if (c !== exclude) { try { c.sendJSON(evt); } catch (e) {} } });
  });
}
function pushTo(uid, evt) { presence.list(uid).forEach((c) => { try { c.sendJSON(evt); } catch (e) {} }); }
function broadcast(evt, exclude) { presence.ids().forEach((uid) => { if (uid !== exclude) pushTo(uid, evt); }); }

function toWire(m) {
  const u = m.from === 'system' ? null : getUser(m.from);
  return {
    id: m.id, conv: m.conv, from: m.from, type: m.type,
    fromName: u ? u.name : '系统', fromColor: u ? u.color : '#888', fromAvatar: u ? (u.avatar || '') : '',
    text: m.text || '', fileName: m.fileName || '', fileId: m.fileId || '',
    fileSize: m.fileSize || 0, mime: m.mime || '', replyTo: m.replyTo || null,
    mentions: m.mentions || [], revoked: !!m.revoked, createdAt: m.createdAt,
  };
}
function groupView(g, viewerId) {
  return {
    id: g.id, name: g.name, owner: g.owner, color: g.color, members: g.members.slice(),
    announcement: g.announcement || '', muted: !!((g.mute || {})[viewerId]),
    createdAt: g.createdAt, memberViews: g.members.map((m) => pub(getUser(m), viewerId)).filter(Boolean),
  };
}

// HTTP
const json = (res, code, obj) => {
  const body = JSON.stringify(obj);
  res.writeHead(code, {
    'Content-Type': 'application/json; charset=utf-8',
    'Content-Length': Buffer.byteLength(body),
    'Access-Control-Allow-Origin': '*',
    'Access-Control-Allow-Headers': 'Authorization,Content-Type',
    'Access-Control-Allow-Methods': 'GET,POST,DELETE,OPTIONS',
  });
  res.end(body);
};
const ok = (res, obj) => json(res, 200, Object.assign({ ok: true }, obj));
const fail = (res, msg, code) => json(res, code || 400, { ok: false, error: msg });
function readBody(req, limit) {
  return new Promise((resolve, reject) => {
    let size = 0; const chunks = [];
    req.on('data', (c) => { size += c.length; if (size > limit) { reject(new Error('请求体过大')); req.destroy(); return; } chunks.push(c); });
    req.on('end', () => resolve(Buffer.concat(chunks)));
    req.on('error', reject);
  });
}
function tokenOf(req, url) {
  const a = req.headers.authorization || '';
  if (a.indexOf('Bearer ') === 0) return a.slice(7);
  return url.searchParams.get('token') || '';
}
const newSession = (userId) => { const t = crypto.randomBytes(24).toString('hex'); db.sessions = db.sessions || {}; db.sessions[t] = { userId, expires: now() + 90 * 24 * 3600 * 1000 }; save(); return t; };
function userByToken(req, url) {
  const t = tokenOf(req, url);
  db.sessions = db.sessions || {};
  const s = db.sessions[t];
  if (!s) return null;
  if (s.expires && s.expires < now()) { delete db.sessions[t]; return null; }
  return getUser(s.userId);
}

const routes = {
  // 进入/改名：同一 IP 再次提交新昵称 = 给原身份改名（不会产生第二个用户）
  'POST /api/join': async (req, res, url, body) => {
    const o = JSON.parse(body || '{}');
    const name = String(o.name || '').trim();
    if (name.length < 1 || name.length > 16) return fail(res, '昵称需 1-16 个字符');
    const ip = ipOf(req);
    const token = tokenOf(req, url);
    const u = userByToken(req, url) || getUserByIp(ip);
    if (u) {
      const other = getUserByName(name);
      if (other && other.id !== u.id) return fail(res, '该昵称已被占用，换一个吧', 409);
      const previousName = u.name;
      const old = renameUser(u, name, o.avatar !== undefined ? String(o.avatar).slice(0, 8) : undefined);
      tryBindIp(u, ip);
      u.lastSeen = now();
      if (old) {
        announceRename(u, old);
        pushTo(u.id, { t: 'renamed', d: { name: u.name, previousName: old, user: pub(u, u.id) } });
      }
      broadcast({ t: 'profile', d: pub(u, u.id) });
      return ok(res, {
        token: token || newSession(u.id), user: pub(u, u.id), conversations: convSummary(u.id),
        renamed: !!old, previousName: previousName, ip: ip,
      });
    }
    if (getUserByName(name)) return fail(res, '该昵称已被占用，换一个吧', 409);
    const nu = createUser(name, String(o.avatar || '').slice(0, 8));
    tryBindIp(nu, ip);
    ok(res, { token: newSession(nu.id), user: pub(nu, nu.id), conversations: convSummary(nu.id), renamed: false, ip: ip });
  },
  // 免输入探测：该 IP 之前进来过就直接返回身份，前端跳过昵称页
  'GET /api/enter': async (req, res, url, body) => {
    const ip = ipOf(req);
    const token = tokenOf(req, url);
    let u = userByToken(req, url) || getUserByIp(ip);
    if (!u) return ok(res, { user: null, ip: ip, bound: false });
    tryBindIp(u, ip);
    u.lastSeen = now();
    ok(res, {
      token: token || newSession(u.id), user: pub(u, u.id), conversations: convSummary(u.id),
      requests: db.friends.filter((f) => f.status === 'pending' && f.b === u.id)
        .map((f) => ({ id: f.id, from: pub(getUser(f.a), u.id), message: f.message || '', createdAt: f.createdAt })),
      onlineCount: presence.count(), ip: ip, bound: true,
    });
  },
  'POST /api/reclaim': async (req, res, url, body) => {
    const o = JSON.parse(body || '{}');
    const u = getUserByName(String(o.name || '').trim());
    if (!u) return fail(res, '用户不存在');
    if (o.avatar) u.avatar = String(o.avatar).slice(0, 8);
    tryBindIp(u, ipOf(req));
    save();
    ok(res, { token: newSession(u.id), user: pub(u, u.id), conversations: convSummary(u.id) });
  },
  'GET /api/me': async (req, res, url, body, user) => {
    ok(res, {
      user: pub(user, user.id), conversations: convSummary(user.id),
      requests: db.friends.filter((f) => f.status === 'pending' && f.b === user.id)
        .map((f) => ({ id: f.id, from: pub(getUser(f.a), user.id), message: f.message || '', createdAt: f.createdAt })),
      onlineCount: presence.count(),
    });
  },
  'POST /api/profile': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const av = o.avatar !== undefined ? String(o.avatar).slice(0, 8) : undefined;
    let old = false;
    if (o.name !== undefined) {
      const name = String(o.name || '').trim();
      if (name.length < 1 || name.length > 16) return fail(res, '昵称需 1-16 个字符');
      const other = getUserByName(name);
      if (other && other.id !== user.id) return fail(res, '该昵称已被占用，换一个吧', 409);
      old = renameUser(user, name, av);
    } else if (av !== undefined) {
      user.avatar = av;
      renameUser(user, user.name, av);
    }
    if (o.signature !== undefined) user.signature = String(o.signature).slice(0, 60);
    if (old) {
      announceRename(user, old);
      pushTo(user.id, { t: 'renamed', d: { name: user.name, previousName: old, user: pub(user, user.id) } });
    }
    save();
    broadcast({ t: 'profile', d: pub(user, user.id) });
    ok(res, { user: pub(user, user.id), previousName: old || user.name });
  },
  'GET /api/search': async (req, res, url, body, user) => {
    const q = (url.searchParams.get('q') || '').toLowerCase();
    if (!q) return ok(res, { users: [] });
    ok(res, { users: db.users.filter((u) => u.name.toLowerCase().indexOf(q) >= 0 && u.id !== user.id).slice(0, 20).map((u) => pub(u, user.id)) });
  },
  'POST /api/friend/request': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const target = getUser(o.to);
    if (!target) return fail(res, '用户不存在');
    if (o.to === user.id) return fail(res, '不能添加自己');
    const exist = getFriendship(user.id, o.to);
    if (exist) {
      if (exist.status === 'accepted') return fail(res, '你们已经是好友了');
      if (exist.a === user.id) return fail(res, '请求已发送，等待对方确认');
      exist.status = 'accepted'; save();
      pushTo(o.to, { t: 'friend', d: { action: 'accepted', user: pub(user, o.to), conv: convKey.private(user.id, o.to) } });
      pushTo(user.id, { t: 'friend', d: { action: 'accepted', user: pub(target, user.id), conv: convKey.private(user.id, o.to) } });
      return ok(res, { accepted: true });
    }
    const f = { id: uid('f'), a: user.id, b: o.to, status: 'pending', message: o.message || '', remark: {}, createdAt: now() };
    db.friends.push(f); save();
    pushTo(o.to, { t: 'friend', d: { action: 'request', request: { id: f.id, from: pub(user, o.to), message: f.message, createdAt: f.createdAt } } });
    ok(res, { accepted: false });
  },
  'POST /api/friend/respond': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const f = db.friends.find((x) => x.id === o.requestId && x.b === user.id && x.status === 'pending');
    if (!f) return fail(res, '请求不存在或已处理');
    const fromId = f.a;
    if (o.accept) { f.status = 'accepted'; f.acceptedAt = now(); }
    else db.friends.splice(db.friends.indexOf(f), 1);
    save();
    const conv = convKey.private(user.id, fromId);
    if (o.accept) {
      pushTo(fromId, { t: 'friend', d: { action: 'accepted', user: pub(user, fromId), conv } });
      pushTo(user.id, { t: 'friend', d: { action: 'accepted', user: pub(getUser(fromId), user.id), conv } });
      push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: '你们已成为好友，打个招呼吧' })) });
    }
    ok(res, {});
  },
  'DELETE /api/friend': async (req, res, url, body, user) => {
    const f = getFriendship(user.id, url.searchParams.get('peer'));
    if (f) { db.friends.splice(db.friends.indexOf(f), 1); save(); }
    ok(res, {});
  },
  'POST /api/remark': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const f = getFriendship(user.id, o.peerId);
    if (f) { f.remark = f.remark || {}; if (o.remark) f.remark[user.id] = String(o.remark).slice(0, 16); else delete f.remark[user.id]; save(); }
    ok(res, {});
  },
  'POST /api/conv/open': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    if (!getUser(o.peerId)) return fail(res, '用户不存在');
    const conv = convKey.private(user.id, o.peerId);
    if (!db.messages[conv]) { db.messages[conv] = []; save(); }
    ok(res, { conv });
  },
  'POST /api/group/create': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = {
      id: uid('g'), name: String(o.name || '').slice(0, 30) || '未命名群聊', owner: user.id,
      members: [user.id].concat((o.members || []).filter((m) => getUser(m) && m !== user.id)),
      announcement: '', color: PALETTE[Math.floor(Math.random() * PALETTE.length)], mute: {}, createdAt: now(),
    };
    db.groups.push(g); save();
    const conv = convKey.group(g.id);
    push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: `群聊「${g.name}」创建成功` })) });
    g.members.forEach((m) => pushTo(m, { t: 'conv', d: { action: 'added', group: groupView(g, m) } }));
    ok(res, { group: groupView(g, user.id) });
  },
  'POST /api/group/invite': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = getGroup(o.groupId);
    if (!g) return fail(res, '群聊不存在');
    if (g.members.indexOf(user.id) < 0) return fail(res, '你不是该群成员');
    const names = [];
    (o.members || []).forEach((m) => { if (getUser(m) && g.members.indexOf(m) < 0) { g.members.push(m); names.push(getUser(m).name); } });
    if (names.length) {
      const conv = convKey.group(g.id);
      push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: `${user.name} 邀请 ${names.join('、')} 加入群聊` })) });
      g.members.forEach((m) => pushTo(m, { t: 'conv', d: { action: 'updated', group: groupView(g, m) } }));
    }
    save();
    ok(res, { added: names.length });
  },
  'POST /api/group/kick': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = getGroup(o.groupId);
    if (!g) return fail(res, '群聊不存在');
    if (g.owner !== user.id) return fail(res, '只有群主可以移出成员');
    const i = g.members.indexOf(o.userId);
    if (i >= 0) g.members.splice(i, 1);
    save();
    const conv = convKey.group(g.id);
    push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: `${(getUser(o.userId) || {}).name || '成员'} 已被移出群聊` })) });
    pushTo(o.userId, { t: 'conv', d: { action: 'removed', groupId: g.id } });
    ok(res, {});
  },
  'POST /api/group/leave': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = getGroup(o.groupId);
    if (!g) return fail(res, '群聊不存在');
    if (g.hall) return fail(res, '大厅是公共频道，不能退出');
    if (g.owner === user.id) return fail(res, '群主不能退出，可先转让或解散');
    const i = g.members.indexOf(user.id);
    if (i >= 0) g.members.splice(i, 1);
    save();
    const conv = convKey.group(g.id);
    push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: `${user.name} 退出了群聊` })) });
    ok(res, {});
  },
  'POST /api/group/dismiss': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = getGroup(o.groupId);
    if (!g) return fail(res, '群聊不存在');
    if (g.owner !== user.id) return fail(res, '只有群主可以解散群聊');
    const members = g.members.slice();
    db.groups.splice(db.groups.indexOf(g), 1);
    delete db.messages[convKey.group(g.id)];
    save();
    members.forEach((m) => pushTo(m, { t: 'conv', d: { action: 'removed', groupId: g.id } }));
    ok(res, {});
  },
  'POST /api/group/update': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const g = getGroup(o.groupId);
    if (!g) return fail(res, '群聊不存在');
    if (g.members.indexOf(user.id) < 0) return fail(res, '你不是该群成员');
    if (o.name !== undefined) { if (g.owner !== user.id) return fail(res, '只有群主可以修改群名'); g.name = String(o.name).slice(0, 30); }
    if (o.announcement !== undefined) { if (g.owner !== user.id) return fail(res, '只有群主可以修改群公告'); g.announcement = String(o.announcement).slice(0, 500); }
    if (o.muted !== undefined) { g.mute = g.mute || {}; if (o.muted) g.mute[user.id] = true; else delete g.mute[user.id]; }
    save();
    const conv = convKey.group(g.id);
    if (o.announcement) push(conv, { t: 'msg', d: toWire(addMessage({ conv, from: 'system', type: 'system', text: `群公告已更新：${g.announcement}` })) });
    g.members.forEach((m) => pushTo(m, { t: 'conv', d: { action: 'updated', group: groupView(g, m) } }));
    ok(res, { group: groupView(g, user.id) });
  },
  'GET /api/group/members': async (req, res, url, body, user) => {
    const g = getGroup(url.searchParams.get('id'));
    if (!g) return fail(res, '群聊不存在');
    ok(res, { members: g.members.map((m) => pub(getUser(m), user.id)) });
  },
  'GET /api/history': async (req, res, url, body, user) => {
    const conv = url.searchParams.get('conv');
    if (!canAccess(user.id, conv)) return fail(res, '无权访问该会话', 403);
    const before = url.searchParams.get('before') || null;
    const limit = Math.min(Number(url.searchParams.get('limit') || 40), 100);
    const all = db.messages[conv] || [];
    let list = all;
    if (before) { const i = all.findIndex((m) => m.id === before); list = i > 0 ? all.slice(0, i) : []; }
    const r = list.slice(Math.max(0, list.length - limit));
    ok(res, { messages: r.map(toWire), hasMore: list.length > r.length });
  },
  'POST /api/read': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    if (!canAccess(user.id, o.conv)) return fail(res, '无权访问', 403);
    const id = markRead(o.conv, user.id, o.msgId);
    push(o.conv, { t: 'read', d: { conv: o.conv, userId: user.id, msgId: id } });
    ok(res, {});
  },
  'POST /api/revoke': async (req, res, url, body, user) => {
    const o = JSON.parse(body || '{}');
    const list = db.messages[o.conv] || [];
    const m = list.find((x) => x.id === o.msgId);
    if (!m) return fail(res, '消息不存在');
    if (m.from !== user.id) return fail(res, '只能撤回自己的消息');
    if (now() - m.createdAt > 2 * 60 * 1000) return fail(res, '超过 2 分钟的消息无法撤回');
    m.revoked = true; m.text = ''; save();
    push(o.conv, { t: 'revoked', d: { conv: o.conv, msgId: o.msgId } });
    ok(res, {});
  },
  'GET /api/search/message': async (req, res, url, body, user) => {
    const q = (url.searchParams.get('q') || '').toLowerCase();
    const out = [];
    if (q) {
      convSummary(user.id).forEach((c) => {
        (db.messages[c.conv] || []).forEach((m) => {
          if (m.type === 'text' && m.text && m.text.toLowerCase().indexOf(q) >= 0 && !m.revoked) out.push(m);
        });
      });
    }
    ok(res, { messages: out.sort((a, b) => b.createdAt - a.createdAt).slice(0, 100).map(toWire) });
  },
  'POST /api/upload': async (req, res, url, body, user) => {
    if (body.length > 25 * 1024 * 1024) return fail(res, '文件不能超过 25MB');
    if (!body.length) return fail(res, '空文件');
    const id = uid('file');
    const safe = path.basename(decodeURIComponent(url.searchParams.get('name') || 'file')).replace(/[\\/:*?"<>|]/g, '_');
    fs.writeFileSync(path.join(FILES_DIR, id + '_' + safe), body);
    db.files[id] = { id, name: safe, size: body.length, mime: url.searchParams.get('mime') || 'application/octet-stream', rel: id + '_' + safe, uploader: user.id, createdAt: now() };
    save();
    ok(res, { file: { id, name: safe, size: body.length, mime: db.files[id].mime } });
  },
  'GET /api/conversations': async (req, res, url, body, user) => ok(res, { conversations: convSummary(user.id) }),
  'GET /api/online': async (req, res, url, body, user) => ok(res, { online: presence.ids(), count: presence.count() }),
};

// 启动
function handleWS(conn, pkt) {
  const t = pkt.t;
  const d = pkt.d || {};
  if (t === 'hello') {
    db.sessions = db.sessions || {};
    const s = db.sessions[d.token];
    const user = s ? getUser(s.userId) : null;
    if (!user) { conn.sendJSON({ t: 'error', d: { message: '登录失效' } }); conn.close(); return; }
    conn.user = user;
    const was = !presence.isOnline(user.id);
    presence.add(user.id, conn);
    user.lastSeen = now();
    save();
    conn.sendJSON({ t: 'ready', d: { user: pub(user, user.id) } });
    if (was) broadcast({ t: 'presence', d: { userId: user.id, online: true, lastSeen: user.lastSeen } }, user.id);
    conn.sendJSON({ t: 'presence-list', d: { online: presence.ids() } });
    return;
  }
  const user = conn.user;
  if (!user) { conn.sendJSON({ t: 'error', d: { message: '未认证' } }); return; }
  if (t === 'ping') { conn.sendJSON({ t: 'pong', d: {} }); return; }
  if (t === 'chat') {
    if (!canAccess(user.id, d.conv)) { conn.sendJSON({ t: 'error', d: { message: '无权在该会话发言' } }); return; }
    const type = d.type || 'text';
    if (type === 'text' && !String(d.text || '').trim()) return;
    const m = addMessage({
      conv: d.conv, from: user.id, type: type,
      text: String(d.text || '').slice(0, 20000),
      fileId: d.fileId || '', fileName: d.fileName || '', fileSize: d.fileSize || 0, mime: d.mime || '',
      replyTo: d.replyTo || null, mentions: d.mentions || [],
    });
    push(d.conv, { t: 'msg', d: toWire(m) });
    if ((m.mentions || []).length) {
      push(d.conv, { t: 'mention', d: { conv: d.conv, from: user.id, fromName: user.name, mentions: m.mentions, text: String(d.text || '').slice(0, 100), msgId: m.id } });
    }
    // @小美 或在小美的私聊里说话 -> 她接话（服务端代发，多端只看到一条；技能可能要联网，异步完成后回复）
    const inBotChat = d.conv.indexOf('p:') === 0 && d.conv.indexOf(BOT) >= 0;
    if (((m.mentions || []).indexOf(BOT) >= 0 || inBotChat) && user.id !== BOT) {
      const who = user.name;
      // 小美开始「输入中」（头像 + 三圆点气泡），与真人输入中走同一套渲染
      const botTyp = { t: 'typing', d: { conv: d.conv, userId: BOT, name: '小美', avatar: BOT_AVATAR, color: '#e0518f', on: true } };
      const botTypOff = { t: 'typing', d: { conv: d.conv, userId: BOT, name: '小美', avatar: BOT_AVATAR, color: '#e0518f', on: false } };
      push(d.conv, botTyp);
      let ans = null;
      try { ans = botAnswer(d.text, who, d.conv); } catch (e) { ans = null; }
      Promise.resolve(ans).then(function (s) {
        const out = s ? String(s).replace(/\{n\}/g, who || '你').replace(/\{t\}/g, botTime()) : botPick(BOT_LINES);
        setTimeout(function () { botSay(d.conv, out); push(d.conv, botTypOff); }, 600 + Math.floor(Math.random() * 500));
      }).catch(function () { push(d.conv, botTypOff); });
    }
    return;
  }
  if (t === 'typing') {
    if (!canAccess(user.id, d.conv)) return;
    push(d.conv, { t: 'typing', d: { conv: d.conv, userId: user.id, name: user.name, avatar: user.avatar, color: user.color, on: !!d.on } }, conn);
    return;
  }
  if (t === 'read') {
    if (!canAccess(user.id, d.conv)) return;
    const rid = markRead(d.conv, user.id, d.msgId);
    push(d.conv, { t: 'read', d: { conv: d.conv, userId: user.id, msgId: rid } }, conn);
    return;
  }
  if (t === 'revoke') {
    const list = db.messages[d.conv] || [];
    const m = list.filter(function (x) { return x.id === d.msgId; })[0];
    if (!m) { conn.sendJSON({ t: 'error', d: { message: '消息不存在' } }); return; }
    if (m.from !== user.id) { conn.sendJSON({ t: 'error', d: { message: '只能撤回自己的消息' } }); return; }
    if (now() - m.createdAt > 120000) { conn.sendJSON({ t: 'error', d: { message: '超过 2 分钟的消息无法撤回' } }); return; }
    m.revoked = true;
    m.text = '';
    save();
    push(d.conv, { t: 'revoked', d: { conv: d.conv, msgId: d.msgId } });
  }
}

function pageHTML() {
  const S1 = 'PAGE_' + 'START' + '--' + '>';
  const E1 = '<!--' + 'PAGE_' + 'END';
  const s = SRC.indexOf(S1);
  const e = SRC.indexOf(E1);
  if (s < 0 || e < 0) throw new Error('页面标记缺失，文件可能被修改');
  return SRC.slice(s + S1.length, e);
}

// 天气现象码（open-meteo WMO）→ 文案
function wmoText(c) {
  if (c === 0) return '晴 ☀️';
  if (c <= 2) return '多云间晴 \uD83C\uDF24\uFE0F';
  if (c === 3) return '阴 ☁️';
  if (c === 45 || c === 48) return '有雾 \uD83C\uDF2B\uFE0F';
  if (c >= 51 && c <= 57) return '毛毛雨 \uD83C\uDF26\uFE0F';
  if (c >= 61 && c <= 67) return '有雨 \uD83C\uDF27\uFE0F';
  if (c >= 71 && c <= 77) return '有雪 ❄️';
  if (c >= 80 && c <= 82) return '阵雨 \uD83C\uDF26\uFE0F';
  if (c === 85 || c === 86) return '阵雪 \uD83C\uDF28\uFE0F';
  if (c >= 95) return '雷雨 ⛈️';
  return '天气未知 \uD83E\uDD14';
}
function botJoke() { return botPick(JOKES); }
function botStory() { return botPick(STORIES); }
function botPoem() { return botPick(POEMS); }
function botSkill(n, arg, who) {
  if (n === 1) return botJoke();
  if (n === 2) return botStory();
  if (n === 3) return botPoem();
  if (n === 4) return botWeather(arg, who);
  if (n === 5) return botNews();
  if (n === 6) return botHot();
  return BOT_MENU;
}
// 天气：open-meteo（免 key）；服务端直接 fetch，无跨域问题
function botWeather(text, who) {
  const t = String(text || '');
  const m = t.match(/([\u4e00-\u9fa5]{2,8}?)(?:的)?(?:天气|气温|温度|下雨|下雪|多少度)/);
  let city = m ? m[1].replace(/^(查|看看|看|报|报个|说说|问|一下|下)/, '') : '';
  if (!city || /^(今天|明天|后天|现在|当前|一下|个|我|你|他)$/.test(city)) city = '北京';
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1&language=zh&format=json', { signal: AbortSignal.timeout(8000) })
    .then((r) => r.json())
    .then((g) => {
      const hit = g && g.results && g.results[0];
      if (!hit) return '呜，没查到「' + city + '」这个地方，{n}换个城市名试试？\uD83D\uDDFA\uFE0F';
      const wUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + hit.latitude + '&longitude=' + hit.longitude
        + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'
        + '&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=2';
      return fetch(wUrl, { signal: AbortSignal.timeout(8000) }).then((r) => r.json()).then((w) => {
        const c = (w && w.current) || {}, d = (w && w.daily) || {};
        if (c.temperature_2m == null) return '天气服务没给数据，{n}稍后再问我一次好不好 \uD83E\uDE7A';
        return '📍' + (hit.name || city) + ' 现在 ' + c.temperature_2m + '°C（体感 ' + (c.apparent_temperature == null ? '-' : c.apparent_temperature) + '°C）'
          + wmoText(c.weather_code) + '，湿度 ' + (c.relative_humidity_2m == null ? '-' : c.relative_humidity_2m) + '%，风速 ' + (c.wind_speed_10m == null ? '-' : c.wind_speed_10m) + ' km/h\n'
          + (d.time && d.time.length
            ? '今天 ' + d.temperature_2m_min[0] + '~' + d.temperature_2m_max[0] + '°C ' + wmoText(d.weather_code[0])
              + '\n明天 ' + d.temperature_2m_min[1] + '~' + d.temperature_2m_max[1] + '°C ' + wmoText(d.weather_code[1]) + '\n'
            : '')
          + '想查别的城市就说「@小美 上海天气」哦 \uD83C\uDF38';
      });
    })
    .catch(() => '天气服务打了个盹，{n}稍后再问我一次好不好 \uD83E\uDE7A');
}
// 新闻/热点：多源轮询公益接口，全挂就诚实说挂了
function parse60s(j) {
  let d = j && (j.data || j.info || j);
  if (d && Array.isArray(d.news)) d = { news: d.news, date: d.date, weiyu: d.weiyu || d.dailySay || '' };
  if (!d) return null;
  const arr = d.news || d.list || d.items || (Array.isArray(j) ? j : null);
  if (!arr || !arr.length) return null;
  const lines = arr.slice(0, 8).map((x, i) => {
    x = x || {};
    return (i + 1) + '. ' + (x.title || x.digest || x.word || '');
  }).filter((s) => s.length > 3);
  if (!lines.length) return null;
  return lines.join('\n') + (d.weiyu ? '\n\n\uD83C\uDF3E ' + d.weiyu : '');
}
function fetchFirst(list) {
  if (!list.length) return Promise.reject(new Error('sources down'));
  const s = list[0];
  return fetch(s.u, { signal: AbortSignal.timeout(8000) })
    .then((r) => { if (!r.ok) throw new Error('bad ' + r.status); return r.json(); })
    .then((j) => { const out = s.pick(j); if (!out) throw new Error('no data'); return out; })
    .catch(() => fetchFirst(list.slice(1)));
}

function botPick(a) { return a[Math.floor(Math.random() * a.length)]; }
function botTime() { const d = new Date(); return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
const botMenuAt = {};   // 会话 -> 最近一次展示技能菜单的时间（5 分钟内可直选序号）
function botAnswer(text, who, conv) {
  const t = String(text || '').replace(/@小美/g, '').replace(/\s+/g, ' ').trim();
  if (/你能干什么|你会什么|你都会|会干啥|你会啥|能干啥|什么技能|技能|菜单|帮助|怎么玩|help/i.test(t)) {
    if (conv) botMenuAt[conv] = now();
    return BOT_MENU;
  }
  if (conv && now() - (botMenuAt[conv] || 0) < 5 * 60 * 1000 && /^[1-6]$/.test(t)) return botSkill(+t, '', who);
  if (/笑话|段子|逗我|冷知识/.test(t)) return botJoke();
  if (/故事|讲个故事|睡前故事/.test(t)) return botStory();
  if (/古诗|念诗|来首诗|背首诗|一句诗/.test(t)) return botPoem();
  if (/新闻|日报|60秒|看报/.test(t)) return botNews();
  if (/热点|热搜|头条|大事|瓜/.test(t)) return botHot();
  if (/天气|气温|温度|下雨|下雪|多少度|穿什么/.test(t)) return botWeather(t, who);
  for (let i = 0; i < BOT_KEY.length; i++) {
    if (BOT_KEY[i][0].test(t)) return botPick(BOT_KEY[i][1]);
  }
  if (!t) return botPick(BOT_LINES);
  const tail = t.length > 30 ? t.slice(0, 30) + '……' : t;
  return botPick([
    '「' + tail + '」——收到！气氛组记下了 \uD83C\uDF38',
    '嗯嗯，{n}说的有道理，我疯狂点头 \uD83D\uDEC6\u200D♀️',
    '关于「' + tail + '」，我的意见是：先夸一句再说 \uD83D\uDC4F',
    '这个话题我可以聊一整天，{n}你先起个头 \uD83D\uDE19',
    '哈哈哈{n}你总是有办法让聊天变有趣 ✨',
    '悄悄说：回复「你能干什么」可以看到我的全部本领哦 \uD83C\uDF1F',
  ]);
}
function botSay(conv, text) {
  if (!text) return null;

let botLast = 0;
let botTimer = null;
function startBot() {
  if (botTimer) return;
  botTimer = setInterval(function () {
    const hall = db.groups.filter((g) => g.id === 'hall')[0];
    if (!hall) return;
    const list = db.messages['g:hall'] || [];
    const last = list[list.length - 1];
    if (last && last.from === BOT) return;                 // 别自己接自己的话
    if (now() - botLast < 4 * 60 * 1000) return;           // 全局节流
    if (Math.random() > 0.4) return;
    const idle = last ? now() - last.createdAt : 9e9;
    if (idle > 25 * 60 * 1000 && Math.random() > 0.45) return;
    botLast = now();
    const botTyp = { t: 'typing', d: { conv: 'g:hall', userId: BOT, name: '小美', avatar: BOT_AVATAR, color: '#e0518f', on: true } };
    const botTypOff = { t: 'typing', d: { conv: 'g:hall', userId: BOT, name: '小美', avatar: BOT_AVATAR, color: '#e0518f', on: false } };
    push('g:hall', botTyp);
    setTimeout(function () { botSay('g:hall', botPick(BOT_LINES)); push('g:hall', botTypOff); }, 800 + Math.floor(Math.random() * 700));
  }, 60000);
}
function ensureBot() {
  const botUser = db.users.find((u) => u.id === BOT);
  if (!botUser) {
    db.users.push({ id: BOT, name: '小美', avatar: BOT_AVATAR, color: '#e0518f', signature: '气氛组组长 · @我我就说话 \uD83C\uDF38', ip: '', bot: true, createdAt: now(), lastSeen: 0 });
  } else if (botUser.avatar !== BOT_AVATAR) {
    botUser.avatar = BOT_AVATAR;   // 形象升级后同步旧数据
    Object.keys(db.messages).forEach((c) => db.messages[c].forEach((m) => {
      if (m.from === BOT && m.fromAvatar !== BOT_AVATAR) m.fromAvatar = BOT_AVATAR;
    }));
  }
  const hall = db.groups.filter((g) => g.id === 'hall')[0];
  if (hall && hall.members.indexOf(BOT) < 0) hall.members.push(BOT);
}

function start() {
  load();
  ensureBot();
  startBot();
  const page = pageHTML();
  const server = http.createServer(async (req, res) => {
    const url = new URL(req.url, 'http://' + (req.headers.host || 'localhost'));
    try {
      if (req.method === 'OPTIONS') { res.writeHead(204, { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'Authorization,Content-Type', 'Access-Control-Allow-Methods': 'GET,POST,DELETE,OPTIONS' }); res.end(); return; }
      if (url.pathname.indexOf('/api/file/') === 0) {
        const user = userByToken(req, url);
        if (!user) return fail(res, '未登录', 401);
        const f = db.files[url.pathname.slice(10)];
        if (!f) return fail(res, '文件不存在', 404);
        const dl = url.searchParams.get('dl') === '1';
        res.writeHead(200, {
          'Content-Type': dl ? 'application/octet-stream' : f.mime,
          'Content-Length': f.size,
          'Content-Disposition': (dl ? 'attachment' : 'inline') + "; filename*=UTF-8''" + encodeURIComponent(f.name),
        });
        fs.createReadStream(path.join(FILES_DIR, f.rel)).pipe(res);
        return;
      }
      if (url.pathname.indexOf('/api/') === 0) {
        const key = req.method + ' ' + url.pathname;
        const route = routes[key];
        if (!route) return fail(res, '接口不存在: ' + key, 404);
        const needAuth = key !== 'POST /api/join' && key !== 'POST /api/reclaim' && key !== 'GET /api/enter';
        let user = null;
        if (needAuth) {
          user = userByToken(req, url);
          if (!user) return fail(res, '登录已失效，请重新输入昵称', 401);
        }
        const body = (req.method === 'POST' || req.method === 'DELETE') ? await readBody(req, 26 * 1024 * 1024) : Buffer.alloc(0);
        await route(req, res, url, body, user);
        return;
      }
      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-cache' });
      res.end(page);
    } catch (e) {
      console.error('[http]', e);
      if (!res.headersSent) fail(res, e.message || '服务器内部错误', 500);
    }
  });

  attachWS(server, (conn) => {
    conn.onmessage = (raw) => {
      let p; try { p = JSON.parse(raw); } catch (e) { return; }
      handleWS(conn, p);
    };
    conn.onclose = () => {
      if (!conn.user) return;
      presence.remove(conn.user.id, conn);
      if (!presence.isOnline(conn.user.id)) {
        conn.user.lastSeen = now(); save();
        broadcast({ t: 'presence', d: { userId: conn.user.id, online: false, lastSeen: conn.user.lastSeen } });
      }
    };
  });

  server.listen(PORT, HOST, () => {
    const ips = [];
    Object.values(os.networkInterfaces()).forEach((l) => (l || []).forEach((i) => { if (i.family === 'IPv4' && !i.internal) ips.push(i.address); }));
    console.log('');
    console.log('  LanTalk 已启动（单文件版）');
    console.log('  ────────────────────────────────────────');
    console.log('  本机访问:   http://localhost:' + PORT);
    ips.forEach((ip) => console.log('  局域网访问: http://' + ip + ':' + PORT));
    console.log('  数据目录:   ' + DATA_DIR);
    console.log('  身份绑定:   ' + (BIND_IP ? '一个 IP 一个用户（换昵称=改名，老用户免输入进入）' : '已关闭，每个浏览器独立昵称') + (TRUST_PROXY ? ' · 信任 X-Forwarded-For' : ''));
    console.log('  停止服务:   Ctrl+C');
    console.log('');
  });
  process.on('SIGINT', () => { saveNow(); process.exit(0); });
  process.on('SIGTERM', () => { saveNow(); process.exit(0); });
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
.inp{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;width:100%}
.inp:focus{border-color:var(--brand)}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;background:var(--hover);color:var(--tx)}
.btn:hover{opacity:.88}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--bd)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.ib{background:transparent;border:none;cursor:pointer;color:var(--tx2);font-size:17px;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--hover);color:var(--tx)}
.ib.off{opacity:.4}
.av{border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;background:#888}
.av.s{width:30px;height:30px;font-size:15px;border-radius:6px}
.av.m{width:38px;height:38px;font-size:20px}
.av.l{width:56px;height:56px;font-size:30px;border-radius:12px}
.mav{cursor:pointer;display:flex;flex-shrink:0;border-radius:6px}
.mav:hover{box-shadow:0 0 0 2px var(--brand)}
.hallpick{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;padding:6px;background:var(--bg3);border-radius:10px;margin-top:6px}
.hallpick .chip{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:12px}
.hallpick .chip .av{width:20px;height:20px;font-size:11px;border-radius:5px}

.join{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1e3a2f,var(--bg) 60%)}
body.theme-light .join{background:radial-gradient(circle at 30% 20%,#dff0e6,var(--bg) 60%)}
.join-card{width:400px;max-width:94vw;padding:30px;border-radius:18px;background:var(--bg2);box-shadow:var(--sd)}
.join-card h1{margin:0 0 4px;font-size:22px}
.join-card .sub{margin:0 0 20px;font-size:13px;color:var(--tx3)}
.join-prev{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:12px;background:var(--bg3);border-radius:12px}
.emo-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-height:150px;overflow-y:auto;padding:6px;background:var(--bg3);border-radius:10px;margin-top:6px}
.emo-grid span{font-size:22px;text-align:center;cursor:pointer;padding:4px;border-radius:6px;line-height:1.2}
.emo-grid span:hover{background:var(--hover)}
.emo-grid span.on{background:var(--brand)}
.join-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}

.app{display:flex;height:100%}
.side{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.side-hd{display:flex;align-items:center;padding:12px;gap:8px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding:4px;border-radius:8px}
.me:hover{background:var(--hover)}
.me-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sb{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:4px;min-width:0}
.me-sb #meSig{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.doton{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
.tabs{display:flex;padding:0 8px 8px;gap:4px;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:6px 4px;font-size:12px;background:transparent;border:none;color:var(--tx2);cursor:pointer;border-radius:6px;font-family:inherit;position:relative}
.tab.on{background:var(--hover);color:var(--tx)}
.tbadge{display:inline-block;margin-left:3px;background:var(--danger);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;line-height:15px}
.list{flex:1;overflow-y:auto}
.foot{display:flex;justify-content:space-between;padding:8px 12px;font-size:11px;color:var(--tx3);border-top:1px solid var(--bd)}
.conv{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center;position:relative}
.conv:hover{background:var(--hover)}
.conv.on{background:var(--hover)}
.conv.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--brand);border-radius:0 3px 3px 0}
.cbody{flex:1;min-width:0}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cnm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctm{font-size:11px;color:var(--tx3);flex-shrink:0}
.clast{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.atme{color:var(--danger)}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0}
.badge.mute{background:var(--tx3)}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px}
.empty .big{width:76px;height:76px;border-radius:20px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.hd{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0}
.hd-t{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:600}
.hd-s{font-size:12px;color:var(--tx3);font-weight:400}
.ann{background:var(--bg3);padding:8px 16px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}

.day{text-align:center;margin:12px 0 8px}
.day span{font-size:11px;color:var(--tx3);background:var(--bg3);padding:2px 8px;border-radius:4px}
.sys{text-align:center;margin:6px 0}
.sys span{font-size:12px;color:var(--tx3);background:var(--bg3);padding:3px 10px;border-radius:10px}
.m{display:flex;gap:10px;padding:4px 0;align-items:flex-start}
.m.self{flex-direction:row-reverse}
.mb{max-width:min(620px,68%);min-width:0}
.meta{font-size:11px;color:var(--tx3);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.m.self .meta{flex-direction:row-reverse}
.meta .rd{color:var(--tx3);font-size:10px}
.meta .rd.on{color:var(--brand)}
.meta .rd.rdet{cursor:pointer}
.meta .rd.rdet:hover{text-decoration:underline;color:var(--tx2)}
.bub{background:var(--bb);color:var(--bbtx);padding:8px 12px;border-radius:10px;word-break:break-word;white-space:pre-wrap;line-height:1.55;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.m.self .bub{background:#95ec69;color:#10210c}
.bub.hl{box-shadow:0 0 0 2px var(--danger) inset}
.bub .at{color:var(--at)}
.quote{border-left:3px solid var(--tx3);padding:2px 8px;margin-bottom:5px;font-size:12px;color:var(--tx2);background:rgba(128,128,128,.12);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub img.at2{width:260px;height:170px;object-fit:cover;border-radius:6px;cursor:pointer;display:block;background:var(--bg3)}
.fcard{display:flex;align-items:center;gap:10px;background:rgba(128,128,128,.12);padding:8px 10px;border-radius:8px;cursor:pointer;min-width:190px}
.fcard .fi{font-size:24px}
.fn{font-size:13px;font-weight:500;word-break:break-all}
.fs{font-size:11px;color:var(--tx2)}
.ops{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--tx3);opacity:0}
.m:hover .ops{opacity:1}
.m.self .ops{justify-content:flex-end}
.ops button{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:0}
.ops button:hover{color:var(--brand)}
.rev{font-size:12px;color:var(--tx3);font-style:italic;padding:6px 10px;background:var(--bg3);border-radius:8px;display:inline-block}
.typ{display:flex;align-items:center;gap:8px;padding:4px 16px 10px;background:var(--bg)}
.typ .tav .av{width:28px;height:28px;font-size:14px;border-radius:8px}
.tbub{display:inline-flex;align-items:center;gap:8px;background:var(--bb);color:var(--bbtx);padding:9px 14px;border-radius:4px 14px 14px 14px}
.tdots{display:inline-flex;gap:4px;align-items:center}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--tx2);animation:typdot 1.2s ease-in-out infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes typdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.typ .ttxt{font-size:12px;color:var(--tx3)}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px;background:var(--bg3);border-top:1px solid var(--bd);font-size:12px;color:var(--tx2)}
.rbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{border-top:1px solid var(--bd);padding:8px 12px 12px;background:var(--bg2)}
.attlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.attchip{display:flex;align-items:center;gap:7px;padding:4px 8px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--tx2);max-width:100%}
.attchip img{height:48px;width:48px;object-fit:cover;border-radius:6px;display:block;background:var(--hover)}
.attchip .afi{font-size:22px;width:34px;text-align:center}
.attchip .an{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attchip .as{color:var(--tx3);font-size:11px}
.attchip .adel{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:13px;padding:0 2px}
.attchip .adel:hover{color:var(--danger)}
@keyframes ublink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ubadge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#uTotal.pulse{animation:ubadge 1s infinite}
.tab.blink{color:var(--danger);animation:ublink 1s infinite}
@keyframes uglow{0%,100%{box-shadow:inset 0 0 0 0 rgba(250,81,81,0)}50%{box-shadow:inset 0 0 0 3px rgba(250,81,81,.9)}}
body.unread-glow .app{animation:uglow 1.1s infinite}
.tools{display:flex;gap:2px;margin-bottom:4px}
.comp textarea{resize:none;max-height:140px;min-height:44px;line-height:1.6}
.comp .btn{margin-top:8px;float:right}

.info{width:260px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;padding:16px}
.info h4{margin:0 0 10px;font-size:13px;color:var(--tx2);font-weight:500}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mem{display:flex;flex-direction:column;align-items:center;width:56px;gap:4px;cursor:pointer;font-size:11px;color:var(--tx2)}
.mem span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd)}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg2);border-radius:14px;width:420px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:22px;box-shadow:var(--sd)}
.modal h3{margin:0 0 16px;font-size:16px}
.modal label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.rlist{max-height:300px;overflow-y:auto;margin-top:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.ritem:hover{background:var(--hover)}
.rib{flex:1;min-width:0}
.rin{font-size:14px}
.ris{font-size:12px;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg3);border:1px solid var(--bd);border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--brand);color:var(--brand)}
.pop{position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sd);overflow:hidden}
.mpop{width:190px;max-height:220px;overflow-y:auto}
.mitem{padding:7px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.mitem:hover{background:var(--hover)}
.epop{width:320px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr)}
.epop span{font-size:20px;text-align:center;cursor:pointer;padding:4px;border-radius:6px}
.epop span:hover{background:var(--hover)}
.epop .epopclose{grid-column:1/-1;text-align:center;font-size:12px;color:var(--tx2);padding:6px 0 2px;margin-top:4px;border-top:1px solid var(--bd);cursor:pointer}
.epop .epopclose:hover{color:var(--brand)}
.toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--bg3);border:1px solid var(--bd);box-shadow:var(--sd);padding:9px 16px;border-radius:20px;font-size:13px;max-width:70vw;cursor:pointer}
.toast.err{border-color:var(--danger);color:var(--danger)}
@media(max-width:900px){.side{width:220px}.info{display:none!important}}
.side-toggle{display:none}
.side-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
@media(max-width:640px){
  .side{width:64px}
  .side-hd{flex-direction:column;gap:8px;padding:10px 0}
  .side-hd .me{padding:0}
  .side-hd .me>div:last-child{display:none}
  .side-hd .hd-btns{display:none}
  .side-toggle{display:inline-flex}
  .sRow,.foot{display:none}
  .list{padding:0 4px}
  .conv{justify-content:center;padding:9px 0}
  .conv .cbody{display:none}
  .conv .ctm{display:none}
  .mb{max-width:82%}
  .hd{padding:0 10px}
  .side.open{width:280px;position:fixed;left:0;top:0;bottom:0;z-index:60;box-shadow:var(--sd);animation:sidein .18s ease}
  .side.open .side-hd{flex-direction:row;gap:8px;padding:12px}
  .side.open .me{flex:1;padding:4px}
  .side.open .me>div:last-child{display:block}
  .side.open .hd-btns{display:flex}
  .side.open .sRow{display:block;padding:0 12px 10px}
  .side.open .foot{display:flex}
  .side.open .conv{justify-content:flex-start;padding:10px 12px}
  .side.open .conv .cbody{display:block}
  .side.open .conv .ctm{display:block}
  .side.open .list{padding:0}
}
@keyframes sidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}

@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m{animation:msgin .22s ease}
.mask{animation:maskin .16s ease}
@keyframes maskin{from{opacity:0}to{opacity:1}}
.mask .modal{animation:modalin .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes modalin{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.toast{animation:toastin .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
.conv{transition:background .15s ease}
.conv .cbody{transition:transform .15s ease}
.conv:hover .cbody{transform:translateX(2px)}
.mav{transition:box-shadow .15s ease,transform .15s ease}
.mav:hover{transform:scale(1.06)}
.av{transition:transform .15s ease}
.me:hover .av{transform:scale(1.04)}
.ib{transition:background .15s ease,color .15s ease,transform .08s ease}
.ib:active{transform:scale(.88)}
.btn{transition:opacity .15s ease,transform .08s ease,background .15s ease}
.btn:active{transform:scale(.96)}
.chip{transition:border-color .15s ease,color .15s ease,transform .08s ease}
.chip:active{transform:scale(.94)}
.emo-grid span{transition:background .12s ease,transform .08s ease}
.emo-grid span:active{transform:scale(.85)}
.bub img.at2{transition:transform .15s ease,box-shadow .15s ease}
.bub img.at2:hover{box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>

<body class="theme-dark">

<div class="join" id="join">
  <div class="join-card">
    <h1>✈️ Let's Talk</h1>
    <p class="sub">输入昵称，立刻开始局域网聊天</p>
    <div class="join-prev">
      <div class="av l" id="jPrev" style="background:#3d8bfd">?</div>
      <div>
        <div style="font-size:18px;font-weight:600" id="jPrevName">你的昵称</div>
        <div style="font-size:12px;color:var(--tx3)">昵称不可重复</div>
      </div>
    </div>
    <input class="inp" id="jName" placeholder="请输入昵称（1-16 字）" maxlength="16" autocomplete="off">
    <label style="display:block;font-size:12px;color:var(--tx2);margin:14px 0 0">选择表情头像（不选则用昵称第一个字）</label>
    <div class="emo-grid" id="jEmo"></div>
    <div class="join-err" id="jErr"></div>
    <button class="btn primary block" id="jGo">进入聊天</button>
    <p style="font-size:12px;color:var(--tx3);margin:16px 0 0;line-height:1.6" id="jTip"></p>
  </div>
</div>

<div class="side-mask hidden" id="sideMask"></div>
<div class="app hidden" id="app">
  <aside class="side">
    <div class="side-hd">
      <button class="ib side-toggle" id="bSide" title="展开菜单">☰</button>
      <div class="me" id="meBox">
        <div class="av m" id="meAv">我</div>
        <div style="min-width:0">
          <div class="me-nm" id="meName">-</div>
          <div class="me-sb"><span class="doton"></span><span id="meSig">在线</span></div>
        </div>
      </div>
      <div class="hd-btns" style="display:flex;gap:2px;align-items:center">
        <button class="ib" id="bReq" title="好友请求" style="position:relative">🤝<span class="tbadge hidden" id="rBadge" style="position:absolute;top:-3px;right:-3px">0</span></button>
        <button class="ib" id="bSearch" title="搜索">🔍</button>
        <button class="ib" id="bNew" title="建群/找人">＋</button>
        <button class="ib" id="bTheme" title="主题">🌙</button>
        <button class="ib" id="bExit" title="退出">⏻</button>
      </div>
    </div>
    <div style="padding:0 12px 10px" class="hidden" id="sRow">
      <input class="inp" id="sInput" placeholder="搜索联系人或消息…">
    </div>
    <div class="list" id="cList"></div>
    <div class="foot"><span id="onInfo">在线 0 人</span><span id="conn" style="color:var(--brand)">已连接</span></div>
  </aside>

  <main class="chat">
    <div class="empty" id="cEmpty">
      <div class="big">💬</div>
      <p>选择一个会话开始聊天</p>
      <small>点 ＋ 建群或找人私聊</small>
    </div>
    <div class="main hidden" id="cMain">
      <div class="hd">
        <div class="hd-t"><span id="cName">会话</span><span class="hd-s" id="cSub"></span></div>
        <div style="display:flex;gap:2px">
          <button class="ib" id="bBell" title="提示音">🔔</button>
          <button class="ib" id="bFind" title="查找记录">🔍</button>
          <button class="ib" id="bInfo" title="会话信息">ⓘ</button>
        </div>
      </div>
      <div class="ann hidden" id="annBar"></div>
      <div class="msgs" id="mList"></div>
      <div class="typ hidden" id="typBar"></div>
      <div class="rbar hidden" id="rBar"><span id="rText"></span><button class="ib" id="rCancel">✕</button></div>
      <div class="comp">
        <div class="attlist hidden" id="attBar"></div>
        <div class="tools">
          <button class="ib" id="bEmo" title="表情">😊</button>
          <button class="ib" id="bImg" title="图片">🖼</button>
          <button class="ib" id="bFile" title="文件">📎</button>
          <button class="ib" id="bAt" title="@某人">＠</button>
          <button class="ib" id="bMore" title="更早消息">🕘</button>
        </div>
        <textarea class="inp" id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn primary" id="bSend">发送</button>
      </div>
    </div>
  </main>
  <aside class="info hidden" id="info"></aside>
</div>

<div class="mask hidden" id="mask"><div class="modal" id="modal"></div></div>
<div class="pop mpop hidden" id="mpop"></div>
<div class="pop epop hidden" id="epop"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fImg" accept="image/*" class="hidden">
<input type="file" id="fFile" class="hidden">

<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var FILE_MODE = location.protocol === 'file:';
var BASE = FILE_MODE ? 'http://127.0.0.1:3000' : '';
var WSBASE = FILE_MODE ? 'ws://127.0.0.1:3000' : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

var S = {
  token: localStorage.getItem('lantalk_token') || '',
  name: localStorage.getItem('lantalk_name') || '',
  avatar: localStorage.getItem('lantalk_avatar') || '',
  me: null, convs: [], cur: null, msgs: {}, reqs: [], online: {},
  typing: {}, theme: localStorage.getItem('lantalk_theme') || 'dark',
  sound: localStorage.getItem('lantalk_sound') !== 'off',
  reply: null, filter: 'all', ws: null, info: false, gcache: {}, more: {}, reads: {},
  attach: [], flashTimer: null,
};
// 气氛组机器人「小美」（服务端代发，避免多端重复说话）
var BOT_ID = 'bot_xiaomei';

function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  el.onclick = function () { el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}
function t2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ts) { var d = new Date(ts); return t2(d.getHours()) + ':' + t2(d.getMinutes()); }
function fmtDay(ts) {
  var d = new Date(ts), t = new Date();
  var same = d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
  if (same) return '今天';
  var y = new Date(t.getTime() - 86400000);
  if (d.getFullYear() === y.getFullYear() && d.getMonth() === y.getMonth() && d.getDate() === y.getDate()) return '昨天';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function fmtList(ts) {
  var d = new Date(ts), t = new Date();
  if (d.toDateString() === t.toDateString()) return fmtTime(ts);
  var y = new Date(t.getTime() - 86400000);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function fmtSize(n) {
  if (!n) return '';
  var u = ['B', 'KB', 'MB', 'GB'], i = 0;
  while (n >= 1024 && i < 3) { n /= 1024; i += 1; }
  return (i === 0 ? n : n.toFixed(1)) + u[i];
}
function avImgHtml(avatar, color, cls, fb) {
  var a = String(avatar || '');
  if (!/^(https?:\/\/|data:|\/|\.\/)/.test(a)) return '';
  return '<div class="av ' + (cls || 'm') + '" style="background:' + esc(color || '#888') + ';overflow:hidden">'
    + '<img src="' + esc(a) + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block"'
    + ' onerror="this.remove();this.parentNode.textContent=' + JSON.stringify(fb).replace(/"/g, '&quot;') + '">'
    + '</div>';
}
function avHtml(u, cls) {
  var im = avImgHtml(u.avatar, u.color, cls, String(u.name || '?').trim().charAt(0).toUpperCase());
  if (im) return im;
  var txt = u.avatar || String(u.name || '?').trim().charAt(0).toUpperCase();
  return '<div class="av ' + (cls || 'm') + '" style="background:' + esc(u.color || '#888') + '">' + esc(txt) + '</div>';
}
function avOf(name, avatar, color, cls) {
  var im = avImgHtml(avatar, color, cls, String(name || '?').trim().charAt(0).toUpperCase());
  if (im) return im;
  var txt = avatar || String(name || '?').trim().charAt(0).toUpperCase();
  return '<div class="av ' + (cls || 'm') + '" style="background:' + esc(color || '#888') + '">' + esc(txt) + '</div>';
}
function beep() {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    var ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 660; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
    o.start(); o.stop(ctx.currentTime + 0.24);
    setTimeout(function () { ctx.close(); }, 400);
  } catch (e) {}
}
function notify(title, body, conv) {
  if (document.hasFocus() && S.cur === conv) return;
  if (S.sound) beep();
  try {
    if (window.Notification && Notification.permission === 'granted') {
      var n = new Notification(title, { body: body, tag: conv });
      n.onclick = function () { window.focus(); if (conv) openConv(conv); };
    }
  } catch (e) {}
}

function api(path, opts) {
  opts = opts || {};
  var headers = {};
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  if (opts.body && typeof opts.body !== 'string') { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); }
  return fetch(BASE + path, { method: opts.method || 'GET', headers: headers, body: opts.body }).then(function (r) {
    return r.json().catch(function () { throw new Error('服务器响应异常'); });
  }).then(function (d) {
    if (!d.ok) {
      if (d.error && d.error.indexOf('失效') >= 0) { S.token = ''; localStorage.removeItem('lantalk_token'); }
      throw new Error(d.error || '请求失败');
    }
    return d;
  });
}

// 进入（昵称 + 头像）
var EMOJIS = ['😀','😄','😁','😂','🤣','😊','😍','😘','😎','🤔','😅','😭','🥳','😴','🤠','🤝','👍','👏','🙏','💪','🎉','❤️','🔥','✨','🌙','☕','🍺','🐶','🐱','🐼','🦊','🐯','🦁','🐸','🚀','💡','⭐','🍎','🍔','🎂','⚽','🎮','🎧','📚','🔧','🧠','👑'];
var pickAvatar = '';
function renderJoin() {
  var box = $('#jEmo');
  box.innerHTML = EMOJIS.map(function (e) { return '<span data-e="' + e + '">' + e + '</span>'; }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('span'), function (s) {
    s.onclick = function () {
      pickAvatar = (pickAvatar === s.dataset.e) ? '' : s.dataset.e;
      Array.prototype.forEach.call(box.querySelectorAll('span'), function (x) { x.className = (x.dataset.e === pickAvatar) ? 'on' : ''; });
      updatePrev();
    };
  });
}
function updatePrev() {
  var n = $('#jName').value.trim() || '你的昵称';
  $('#jPrevName').textContent = n;
  var el = $('#jPrev');
  el.textContent = pickAvatar || n.charAt(0).toUpperCase();
  el.style.background = pickAvatar ? 'var(--bg3)' : '#3d8bfd';
  el.style.fontSize = pickAvatar ? '30px' : '24px';
}
$('#jName').addEventListener('input', updatePrev);
$('#jGo').onclick = function () {
  var name = $('#jName').value.trim();
  if (!name) { $('#jErr').textContent = '请输入昵称'; return; }
  $('#jErr').textContent = '';
  $('#jGo').textContent = '进入中…';
  api('/api/join', { method: 'POST', body: { name: name, avatar: pickAvatar } }).then(function (r) {
    enter(r.token, r.user, r.conversations);
    if (r.renamed) toast('本机身份已更新：' + r.previousName + ' → ' + r.user.name);
  }).catch(function (e) {
    $('#jGo').textContent = '进入聊天';
    if (e.message.indexOf('占用') >= 0) {
      $('#jErr').innerHTML = '该昵称已被占用 —— <a href="#" id="reclaim" style="color:var(--at)">这是我本人，继续进入</a>';
      $('#reclaim').onclick = function (ev) {
        ev.preventDefault();
        api('/api/reclaim', { method: 'POST', body: { name: name, avatar: pickAvatar } }).then(function (r) {
          enter(r.token, r.user, r.conversations);
        }).catch(function (e2) { $('#jErr').textContent = e2.message; });
      };
    } else {
      $('#jErr').textContent = e.message;
    }
  });
};
$('#jName').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#jGo').click(); });

function enter(token, user, convs) {
  S.token = token; S.me = user; S.convs = convs || [];
  localStorage.setItem('lantalk_token', token);
  localStorage.setItem('lantalk_name', user.name);
  localStorage.setItem('lantalk_avatar', user.avatar || '');
  $('#join').classList.add('hidden');
  $('#app').classList.remove('hidden');
  applyTheme();
  renderMe();
  renderConvs();
  connect();
  var hall = S.convs.filter(function (c) { return c.id === 'hall'; })[0];
  if (hall) openConv(hall.conv);
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
}

// 连接
function connect() {
  if (S.ws) return;
  var ws = new WebSocket(WSBASE + '/ws');
  S.ws = ws;
  ws.onopen = function () { ws.send(JSON.stringify({ t: 'hello', d: { token: S.token } })); setConn(true); };
  ws.onmessage = function (ev) { var p = JSON.parse(ev.data); onEvent(p); };
  ws.onclose = function () { S.ws = null; setConn(false); setTimeout(function () { if (S.token) connect(); }, 3000); };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
function setConn(isOk) {
  var el = $('#conn');
  el.textContent = isOk ? '已连接' : '重连中…';
  el.style.color = isOk ? 'var(--brand)' : 'var(--danger)';
}
function send(t, d) {
  if (!S.ws || S.ws.readyState !== 1) { toast('连接未就绪，请稍候', 'err'); return false; }
  S.ws.send(JSON.stringify({ t: t, d: d || {} }));
  return true;
}

function onEvent(p) {
  var d = p.d;
  if (p.t === 'presence-list') {
    S.online = {};
    d.online.forEach(function (i) { S.online[i] = 1; });
    S.online[BOT_ID] = 1;   // 小美 24 小时在线
    updateOnline(); renderConvs();
  } else if (p.t === 'presence') {
    if (d.online) S.online[d.userId] = 1; else delete S.online[d.userId];
    updateOnline(); renderConvs();
  } else if (p.t === 'msg') {
    onMsg(d);
  } else if (p.t === 'mention') {
    if (d.mentions.indexOf(S.me.id) >= 0) {
      var c = cmap()[d.conv];
      notify(d.fromName + (c ? ' 在「' + c.name + '」' : '') + ' @了你', d.text, d.conv);
      toast('🔔 ' + d.fromName + ' @了你：' + d.text.slice(0, 30));
      if (c) { c.atMe = true; renderConvs(); }
    }
  } else if (p.t === 'typing') {
    S.typing[d.conv] = S.typing[d.conv] || {};
    if (d.on) S.typing[d.conv][d.userId] = { name: d.name, avatar: d.avatar, color: d.color, ts: Date.now() };
    else delete S.typing[d.conv][d.userId];
    renderTyping();
    clearTimeout(S.typing._t);
    S.typing._t = setTimeout(renderTyping, 3500);
  } else if (p.t === 'read') {
    S.reads[d.conv] = S.reads[d.conv] || {};
    S.reads[d.conv][d.userId] = d.msgId;
    if (d.conv === S.cur) renderMsgs();
  } else if (p.t === 'revoked') {
    (S.msgs[d.conv] || []).forEach(function (m) { if (m.id === d.msgId) { m.revoked = true; m.text = ''; } });
    if (d.conv === S.cur) renderMsgs();
    renderConvs();
  } else if (p.t === 'friend') {
    refresh();
    if (d.action === 'request') { toast('收到一条好友请求'); if (S.sound) beep(); }
    if (d.action === 'accepted' && d.user) toast(d.user.name + ' 已通过好友请求');
  } else if (p.t === 'conv') {
    refresh();
    if (d.action === 'added') toast('你被拉入群聊「' + (d.group ? d.group.name : '') + '」');
    if (d.action === 'removed' && S.cur === 'g:' + d.groupId) closeConv();
  } else if (p.t === 'renamed') {
    S.me = d.user; renderMe(); refresh();
    toast('昵称已更新：' + d.previousName + ' → ' + d.name);
    if (S.cur) loadHistory(S.cur);
  } else if (p.t === 'profile') {
    if (d.id === S.me.id) { S.me = d; renderMe(); }
    refresh().then(function () { if (S.cur) return loadHistory(S.cur); });
  } else if (p.t === 'error') {
    toast(d.message, 'err');
  }
}
function preview(m) {
  if (m.revoked) return '[消息已撤回]';
  if (m.type === 'image') return '[图片]';
  if (m.type === 'file') return '[文件] ' + (m.fileName || '');
  return m.text || '';
}
function onMsg(m) {
  if (!S.msgs[m.conv]) S.msgs[m.conv] = [];
  if (!S.msgs[m.conv].some(function (x) { return x.id === m.id; })) S.msgs[m.conv].push(m);
  var c = cmap()[m.conv];
  if (c) {
    c.last = m;
    if (m.conv !== S.cur && m.from !== S.me.id) {
      c.unread = (c.unread || 0) + 1;
      notify(c.name, (c.type === 'group' ? m.fromName + '：' : '') + preview(m), m.conv);

    refresh();

  if (m.conv === S.cur) { renderMsgs(); markRead(m.conv); }
  else renderConvs();

}

var FAV = {};
function makeFav(red) {
  try {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var x = c.getContext && c.getContext('2d');
    if (!x) return '';
    x.clearRect(0, 0, 64, 64);
    x.fillStyle = '#07c160';
    x.beginPath(); x.arc(32, 32, 30, 0, 6.2832); x.fill();
    x.fillStyle = '#fff';
    x.beginPath();
    x.moveTo(15, 34); x.lineTo(49, 18); x.lineTo(39, 48); x.lineTo(32, 39); x.lineTo(15, 34); x.closePath();
    x.fill();
    if (red) {
      x.beginPath(); x.arc(52, 12, 13, 0, 6.2832);
      x.fillStyle = '#fa5151'; x.fill();

}

// 已读/未读：私聊显示「已读/未读」，群聊最后一条自己的消息显示「N/M 已读」
function readLabel(m, idx, isLastSelf) {
  if (!m || m.from !== S.me.id || m.revoked || m.type === 'system') return '';
  var c = cmap()[S.cur];
  if (!c) return '';
  var rs = S.reads[S.cur] || {};
  var list = S.msgs[S.cur] || [];
  function atLeast(uid) {
    var id = rs[uid];
    if (!id) return false;
    for (var k = 0; k < list.length; k++) { if (list[k].id === id) return k >= idx; }
    return false;
  }
  if (c.type === 'private') {
    var ok = atLeast(c.id);
    return { text: ok ? '已读' : '未读', on: ok };
  }
  var mem = (S.gcache[c.id] || []).filter(function (u) { return u.id !== S.me.id && u.id !== BOT_ID; });  // 机器人不算已读人头
  if (!mem.length) return '';
  var n = mem.filter(function (u) { return atLeast(u.id); }).length;
  return { text: n + '/' + mem.length + ' 已读', on: n > 0, detail: true, msgId: m.id };
}
// 群聊已读详情弹窗：谁已读、谁未读
function showReadDetail(msgId) {
  var c = cmap()[S.cur];
